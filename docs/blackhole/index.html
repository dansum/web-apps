<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Дупката</title>
<meta name="description" content="3D игра без реклами: управляваш дупка в земята, поглъщаш всичко по-малко от нея и растеш — от пейки и коли до цели блокове.">
<meta name="theme-color" content="#8fd3ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1633;
    --muted: #6b6488;
    --panel: rgba(255, 255, 255, .94);
    --accent: #7c3aed;
    --gold: #ffb020;
    --line: rgba(28, 22, 51, .12);
    --bg: #8fd3ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.4 Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- HUD ---- */
  .hud { position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 0; }
  .hud-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .pill { background: rgba(255,255,255,.88); border-radius: 999px; padding: 6px 14px; font-weight: 700;
    box-shadow: 0 2px 10px rgba(0,0,0,.12); white-space: nowrap; }
  #lvlName { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .hud-row > .timer, .hud-row > button { flex: none; }
  .timer { font-size: 22px; font-weight: 900; min-width: 76px; text-align: center; }
  .timer.low { color: #e11d48; }
  .hud button { pointer-events: auto; width: 42px; height: 42px; border-radius: 14px; border: 0;
    background: rgba(255,255,255,.88); color: var(--ink); font: inherit; font-size: 18px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .progress { margin: 10px auto 0; max-width: 360px; position: relative; height: 14px; border-radius: 999px;
    background: rgba(255,255,255,.7); box-shadow: 0 2px 10px rgba(0,0,0,.12); overflow: visible; }
  .progress .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, #a78bfa, #7c3aed); transition: width .25s; }
  .progress .mark { position: absolute; top: -7px; width: 24px; margin-left: -12px; text-align: center;
    font-size: 18px; line-height: 1; filter: grayscale(1) opacity(.55); transition: filter .2s, transform .2s; }
  .progress .mark.on { filter: none; transform: scale(1.2); }
  .score { text-align: center; margin-top: 8px; font-weight: 900; font-size: 26px; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.45); }
  .score.hit { animation: hit .5s ease-out; }
  @keyframes hit { 0%, 100% { color: #fff; transform: none; } 20% { color: #ff4d6d; transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { color: #ff4d6d; transform: translateX(-3px); } }
  .float.bad { color: #ff4d6d; font-size: 22px; }
  .sizeinfo { text-align: center; margin-top: 0; font-weight: 700; font-size: 14px; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.45); }
  .board { margin: 8px 0 0 auto; width: 150px; font-size: 13px; background: rgba(255,255,255,.85);
    border-radius: 12px; padding: 6px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .board div { display: flex; justify-content: space-between; gap: 6px; }
  .board .me { font-weight: 900; }
  .board i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

  .label { position: fixed; z-index: 1; transform: translate(-50%, -100%); pointer-events: none;
    font-weight: 700; font-size: 13px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; }

  .joy { position: fixed; z-index: 1; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12); pointer-events: none; display: none; }
  .joy b { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; background: rgba(255,255,255,.8); }

  .float { position: fixed; z-index: 2; pointer-events: none; font-weight: 900; color: #fff; font-size: 16px;
    text-shadow: 0 1px 4px rgba(0,0,0,.55); transform: translate(-50%, -50%); animation: up .9s ease-out forwards; }
  @keyframes up { to { transform: translate(-50%, -160%); opacity: 0; } }

  .banner { position: fixed; left: 50%; top: 30%; z-index: 3; transform: translate(-50%, -50%);
    pointer-events: none; text-align: center; font-weight: 900; font-size: 34px; color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,.4); opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .banner.show { opacity: 1; }
  .banner small { display: block; font-size: 16px; font-weight: 700; }

  /* ---- екрани ---- */
  .screen { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(40, 20, 80, .28); }
  .card { width: 100%; max-width: 400px; max-height: 100%; overflow: auto; touch-action: pan-y;
    background: var(--panel); border-radius: 24px; padding: 22px 20px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  h1 { margin: 0; font-size: 46px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; color: var(--ink); }
  h1 span { color: var(--accent); }
  h2 { margin: 0 0 6px; font-size: 28px; font-weight: 900; }
  .tagline { color: var(--muted); margin: 8px 0 14px; }
  .btn { display: block; width: 100%; padding: 15px; margin-top: 10px; border: 0; border-radius: 16px;
    cursor: pointer; font: inherit; font-weight: 900; font-size: 19px; color: #fff;
    background: linear-gradient(180deg, #8b5cf6, #6d28d9); box-shadow: 0 4px 0 #4c1d95; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #4c1d95; }
  .btn.alt { background: linear-gradient(180deg, #ffc247, #ff9a1f); box-shadow: 0 4px 0 #b45309; color: #2b1600; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border: 2px solid var(--line);
    font-size: 16px; font-weight: 700; padding: 11px; }
  .btn small { display: block; font-size: 13px; font-weight: 500; opacity: .85; }
  .coins { font-weight: 900; color: #b45309; margin: 2px 0 8px; }
  .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
  .up { border: 2px solid var(--line); border-radius: 14px; padding: 8px 4px; background: #fff; cursor: pointer;
    font: inherit; color: var(--ink); }
  .up .ic { font-size: 22px; display: block; }
  .up .nm { font-size: 12px; font-weight: 700; display: block; }
  .up .lv { font-size: 11px; color: var(--muted); display: block; }
  .up .pr { font-size: 13px; font-weight: 900; color: #b45309; display: block; margin-top: 2px; }
  .up:disabled { opacity: .45; cursor: default; }
  .how { text-align: left; font-size: 14px; color: var(--muted); margin: 12px 0 0; padding-left: 18px; }
  .how li { margin: 3px 0; }
  .stars { font-size: 44px; letter-spacing: 6px; margin: 4px 0; }
  .stars .off { filter: grayscale(1) opacity(.35); }
  .big { font-size: 46px; font-weight: 900; margin: 0; }
  .stat { color: var(--muted); margin: 2px 0; }
  .rank { text-align: left; margin: 10px 0; }
  .rank div { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 10px; }
  .rank .me { background: #ede9fe; font-weight: 900; }
  .rank i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .small { font-size: 13px; color: var(--muted); margin-top: 12px; }
  [hidden] { display: none !important; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 700; color: #fff; z-index: 9; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin: -6px -4px 6px; }
  .lang { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { border: 0; background: transparent; font: inherit; font-weight: 700; font-size: 13px; padding: 5px 11px; cursor: pointer; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0 14px; }
  .seg button { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 4px; font: inherit; cursor: pointer; color: var(--ink); }
  .seg.diffs button span { display: block; line-height: 1.25; margin-top: 2px; }
  .seg.seg2 { grid-template-columns: 1fr 1fr; }
  .seg.seg2 button span { display: block; }
  .seg button b { display: block; font-size: 15px; }
  .seg button span { font-size: 12px; color: var(--muted); }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #ede9fe; }
  .sec { text-align: left; font-weight: 900; font-size: 14px; margin: 4px 0 4px; display: flex; justify-content: space-between; align-items: center; }
  .sec button { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .cats { display: grid; gap: 2px; text-align: left; margin-bottom: 6px; }
  .cat { display: grid; grid-template-columns: 26px 1fr 34px; align-items: center; gap: 6px; padding: 4px 2px; }
  .cat .ic { font-size: 19px; text-align: center; }
  .cat .nm { font-size: 13px; font-weight: 700; }
  .cat .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; line-height: 1.2; }
  .cat .n { font-weight: 900; text-align: right; font-size: 15px; }
  .cat input[type=range] { width: 100%; accent-color: var(--accent); grid-column: 2 / 3; margin: 0; height: 24px; }
  .cat.off .nm, .cat.off .ic { opacity: .45; }
  .warn { background: #fef3c7; color: #92400e; border-radius: 10px; padding: 8px 10px; font-size: 13px; text-align: left; margin: 6px 0; }
</style>
</head>
<body>
<canvas id="c" aria-label="Игрално поле"></canvas>
<div class="loading" id="loading">…</div>

<div class="hud" id="hud" hidden>
  <div class="hud-row">
    <div class="pill" id="lvlName"></div>
    <div class="pill timer" id="timer">1:40</div>
    <button id="btnPause" type="button" aria-label="Pause">⏸</button>
  </div>
  <div class="progress" id="progress">
    <div class="fill" id="progFill"></div>
    <span class="mark" id="m1" style="left:40%">⭐</span>
    <span class="mark" id="m2" style="left:70%">⭐</span>
    <span class="mark" id="m3" style="left:95%">⭐</span>
  </div>
  <div class="board" id="board" hidden></div>
  <div class="score" id="score"></div>
  <div class="sizeinfo" id="sizeInfo"></div>
</div>
<div id="labels"></div>
<div class="joy" id="joy"><b></b></div>
<div class="banner" id="banner"></div>

<section class="screen" id="scrMenu" hidden>
  <div class="card">
    <div class="topbar">
      <div class="coins" id="coins">🪙 0</div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="bg">БГ</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <h1 id="logo"></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <button class="btn alt" id="btnContinue" type="button" hidden><span data-i18n="continue"></span><small id="continueSub"></small></button>
    <button class="btn" id="btnCareer" type="button"><span data-i18n="career"></span><small id="careerSub"></small></button>
    <button class="btn" id="btnSingle" type="button"><span data-i18n="single"></span><small data-i18n="singleSub"></small></button>
    <button class="btn alt" id="btnBattle" type="button"><span data-i18n="battle"></span><small data-i18n="battleSub"></small></button>
    <div class="shop" id="shop"></div>
    <ol class="how">
      <li data-i18n="how1"></li>
      <li data-i18n="how2"></li>
      <li data-i18n="how3"></li>
      <li data-i18n="how4"></li>
    </ol>
    <button class="btn ghost" id="btnSound" type="button"></button>
    <button class="btn ghost" id="btnInstall" type="button" hidden data-i18n="install"></button>
    <div class="small" id="installHint" data-i18n="installHint"></div>
  </div>
</section>

<section class="screen" id="scrSingle" hidden>
  <div class="card">
    <h2 data-i18n="single"></h2>
    <div class="sec" data-i18n="levelKind"></div>
    <div class="seg seg2" id="kinds">
      <button type="button" data-kind="objects"><b data-i18n="kindObjects"></b><span data-i18n="kindObjectsD"></span></button>
      <button type="button" data-kind="cubes"><b data-i18n="kindCubes"></b><span data-i18n="kindCubesD"></span></button>
    </div>
    <div class="sec" data-i18n="mapSize"></div>
    <div class="seg" id="sizes">
      <button type="button" data-size="s"><b data-i18n="sizeS"></b><span>2 min</span></button>
      <button type="button" data-size="m"><b data-i18n="sizeM"></b><span>3 min</span></button>
      <button type="button" data-size="l"><b data-i18n="sizeL"></b><span>5 min</span></button>
    </div>
    <div class="sec"><span data-i18n="whatToEat"></span><button type="button" id="btnRandom" data-i18n="random"></button></div>
    <div class="cats" id="cats"></div>
    <div class="warn" id="singleWarn" hidden data-i18n="needSmall"></div>
    <button class="btn" id="btnSinglePlay" type="button" data-i18n="play"></button>
    <button class="btn ghost" id="btnSingleBack" type="button" data-i18n="back"></button>
  </div>
</section>

<section class="screen" id="scrBattle" hidden>
  <div class="card">
    <h2 data-i18n="battle"></h2>
    <p class="tagline" data-i18n="battleSub"></p>
    <div class="sec" data-i18n="difficulty"></div>
    <div class="seg diffs" id="diffs">
      <button type="button" data-diff="easy"><b data-i18n="diff_easy"></b><span data-i18n="diffd_easy"></span></button>
      <button type="button" data-diff="normal"><b data-i18n="diff_normal"></b><span data-i18n="diffd_normal"></span></button>
      <button type="button" data-diff="hard"><b data-i18n="diff_hard"></b><span data-i18n="diffd_hard"></span></button>
    </div>
    <p class="note" data-i18n="diffNote"></p>
    <button class="btn alt" id="btnBattlePlay" type="button" data-i18n="play"></button>
    <button class="btn ghost" id="btnBattleBack" type="button" data-i18n="back"></button>
  </div>
</section>

<section class="screen" id="scrPause" hidden>
  <div class="card">
    <h2 data-i18n="paused"></h2>
    <button class="btn" id="btnResume" type="button" data-i18n="resume"></button>
    <button class="btn ghost" id="btnSound2" type="button"></button>
    <button class="btn ghost" id="btnQuit" type="button" data-i18n="toMenu"></button>
    <p class="note" data-i18n="savedNote"></p>
  </div>
</section>

<section class="screen" id="scrLevelEnd" hidden>
  <div class="card">
    <h2 id="leTitle"></h2>
    <div class="stars" id="leStars"></div>
    <p class="big" id="lePct">0%</p>
    <p class="stat" id="leStat"></p>
    <p class="coins" id="leCoins"></p>
    <button class="btn" id="btnNext" type="button" data-i18n="next"></button>
    <button class="btn ghost" id="btnRetry" type="button" data-i18n="retry"></button>
    <button class="btn ghost" id="btnMenu1" type="button" data-i18n="toMenu"></button>
  </div>
</section>

<section class="screen" id="scrBattleEnd" hidden>
  <div class="card">
    <h2 id="beTitle"></h2>
    <div class="rank" id="beRank"></div>
    <p class="coins" id="beCoins"></p>
    <button class="btn alt" id="btnBattleAgain" type="button" data-i18n="newBattle"></button>
    <button class="btn ghost" id="btnMenu2" type="button" data-i18n="toMenu"></button>
  </div>
</section>

<script type="module" src="main.js"></script>
</body>
</html>
