<style>

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121418; --card: #1b1e24; --ink: #eceef2; --muted: #9aa0ad;

    --bg: #121418; --card: #1b1e24; --ink: #eceef2; --muted: #9aa0ad;

    --shadow: none;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "locl" 0;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* Top bar with the two switches */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 16px 0;
  }
  .seg {
    display: inline-flex; padding: 3px; gap: 2px;
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  }
  .seg button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; min-width: 44px;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .theme {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }

  header { padding: 24px 0 28px; }
  .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--ink); color: var(--bg);
    font-weight: 800; font-size: 28px; letter-spacing: -1px;
  }
  h1 { font-size: clamp(36px, 7vw, 60px); line-height: 1.05; margin: 28px 0 12px; letter-spacing: -1.5px; }
  .lede { color: var(--muted); font-size: 18px; max-width: 620px; margin: 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 32px 0 20px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip .n { opacity: .6; margin-left: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; padding-bottom: 48px; }
  .card {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; color: inherit; text-decoration: none; box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .card .head { display: flex; align-items: center; gap: 12px; }
  .icon {
    flex: none; width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center; font-size: 22px;
    background: color-mix(in srgb, var(--c) 14%, transparent);
  }
  .card h2 { font-size: 18px; margin: 0; line-height: 1.25; }
  .tag { font-size: 12px; font-weight: 600; color: var(--c); text-transform: uppercase; letter-spacing: .06em; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
  body.short .card p { font-size: 17px; color: var(--ink); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta span { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--muted); }
  .open { font-weight: 600; font-size: 14px; color: var(--accent); }
  .games { --c: var(--games); }
  .learn { --c: var(--learn); }
  .tools { --c: var(--tools); }
  [hidden] { display: none !important; }
  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--accent); }
  footer .ck { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
</style>
</head>

        short: 'Lauf in 3D durch die Straßen großer Städte. Du gehst mit den Tasten.' } },

    { href: 'care-training/', icon: '🩺', kind: 'tools',
      bg: { tag: 'Инструмент', title: 'Годишно обучение за домашни грижи', meta: ['EN', 'Сертификат'],
        full: 'Обучение за домашни грижи: видео, тест от 10 въпроса и сертификат за изтегляне като PDF при успешно преминаване.',
        short: 'Урок за хора, които се грижат за болни или възрастни хора вкъщи. Гледаш видео и решаваш тест.' },
      en: { tag: 'Tool', title: 'Annual Care Training', meta: ['EN', 'Certificate'],
        full: 'In-home care training: watch a video, take a 10-question quiz and, on passing, download a certificate as PDF.',
        short: 'A lesson for people who look after sick or elderly people at home. Watch a video and take a test.' },
      de: { tag: 'Werkzeug', title: 'Jährliche Pflegeschulung', meta: ['EN', 'Zertifikat'],
        full: 'Schulung für die häusliche Pflege: Video ansehen, Test mit 10 Fragen machen und nach dem Bestehen ein Zertifikat als PDF herunterladen.',
        short: 'Ein Kurs für Menschen, die kranke oder alte Menschen zu Hause pflegen. Video schauen und Test machen.' } }
  ];

  /* ---------- State ---------- */
  function load(key, ok, def) {
    try { var v = localStorage.getItem(key); if (ok.indexOf(v) >= 0) return v; } catch (e) {}
    return def;
  }
  function save(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }

  var state = {
    lang: load('d4-lang', ['bg', 'en', 'de'], 'bg'),
    len: load('d4-len', ['full', 'short'], 'short'),
    filter: 'all',
    theme: load('d4-theme', ['auto', 'light', 'dark'], 'auto')
  };

  var grid = document.getElementById('grid');
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderCards() {
    var t = UI[state.lang];
    grid.textContent = '';
    PROJECTS.forEach(function (p) {
      var d = p[state.lang];
      var a = el('a', 'card ' + p.kind);
      a.href = p.href;
      a.hidden = state.filter !== 'all' && state.filter !== p.kind;
      var head = el('div', 'head');
      head.appendChild(el('span', 'icon', p.icon));
      var box = el('div');
      box.appendChild(el('div', 'tag', d.tag));
      box.appendChild(el('h2', null, d.title));
      head.appendChild(box);
      a.appendChild(head);
      a.appendChild(el('p', null, d[state.len]));
      var meta = el('div', 'meta');
      d.meta.forEach(function (m) { meta.appendChild(el('span', null, m)); });
      a.appendChild(meta);
      a.appendChild(el('span', 'open', t.open));
      grid.appendChild(a);
    });
  }

  function render() {
    var t = UI[state.lang];
    document.documentElement.lang = state.lang;
    document.body.classList.toggle('short', state.len === 'short');

    document.getElementById('lang').setAttribute('aria-label', t.langLabel);
    var lenGroup = document.getElementById('len');
    lenGroup.setAttribute('aria-label', t.lenLabel);
    lenGroup.querySelector('[data-v="full"]').textContent = t.full;
    lenGroup.querySelector('[data-v="short"]').textContent = t.short;
    [['lang', state.lang], ['len', state.len]].forEach(function (g) {
      document.querySelectorAll('#' + g[0] + ' button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.v === g[1]));
      });
    });

    document.title = t.brand;
    document.getElementById('logo').textContent = t.brand;
    document.getElementById('brand').textContent = t.brand;
    document.getElementById('lede').textContent = t.lede[state.len];
    document.getElementById('footer').innerHTML = t.footer;
    document.getElementById('filters').setAttribute('aria-label', t.filterLabel);
    chips.forEach(function (c) {
      var f = c.dataset.f;
      c.querySelector('.t').textContent = t[f];
      c.querySelector('.n').textContent = f === 'all' ? PROJECTS.length
        : PROJECTS.filter(function (p) { return p.kind === f; }).length;
      c.setAttribute('aria-pressed', String(f === state.filter));
    });

    if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', state.theme);
    document.getElementById('theme').textContent = t.theme[state.theme];

    renderCards();
  }

  /* ---------- Events ---------- */
  document.getElementById('lang').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.lang = b.dataset.v; save('d4-lang', state.lang); render();
  });
  document.getElementById('len').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.len = b.dataset.v; save('d4-len', state.len); render();
  });
  chips.forEach(function (c) {
    c.addEventListener('click', function () { state.filter = c.dataset.f; render(); });
  });
  document.getElementById('theme').addEventListener('click', function () {
    var modes = ['auto', 'light', 'dark'];
    state.theme = modes[(modes.indexOf(state.theme) + 1) % modes.length];
    save('d4-theme', state.theme); render();
  });

  render();
})();
</script>
<script src="consent.js" defer></script>
</body>
</html>
