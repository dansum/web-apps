<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Човекът и природата в 3D</title>
  <meta name="description" content="Курсове по „Човекът и природата“ за 3.–6. клас по учебните програми на МОН, с 3D интерактивни упражнения.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="stylesheet" href="css/style.css">

  <header class="topbar">

    <p><a href="programa.html">Програмен план</a> · <a href="план.md">Технически план на разработката</a> · 3D: three.js (MIT)</p>

  <div class="dropmsg">Пусни файла с напредъка тук</div>
  <script type="module" src="js/app.js"></script>
