<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img"><title>Воден разтвор: разтворител и разтворено вещество</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker><marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="640" height="400" fill="#F7F7F7"/><text x="320" y="34" font-size="22" text-anchor="middle" font-weight="bold" fill="#0A2A66">Водата и водните разтвори</text><path d="M30,90 L30,210 Q30,218 38,218 L142,218 Q150,218 150,210 L150,90" fill="#fff" stroke="#0A2A66" stroke-width="3"/><rect x="32" y="120" width="116" height="124" fill="#28AAE1" opacity="0.35"/><text x="90" y="242" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">вода</text><text x="90" y="260" font-size="15" text-anchor="middle" font-weight="normal" fill="#5A6478">(разтворител)</text><text x="180" y="165" font-size="34" text-anchor="middle" font-weight="bold" fill="#0A2A66">+</text><path d="M205,160 L270,140" fill="none" stroke="#5A6478" stroke-width="6" stroke-linecap="round"/><ellipse cx="225" cy="160" rx="24" ry="12" fill="#D7DCE6" stroke="#0A2A66" stroke-width="2"/><rect x="210" y="148" width="8" height="8" rx="1" fill="#fff" stroke="#FA961E" stroke-width="1.5"/><rect x="216" y="144" width="8" height="8" rx="1" fill="#fff" stroke="#FA961E" stroke-width="1.5"/><rect x="222" y="148" width="8" height="8" rx="1" fill="#fff" stroke="#FA961E" stroke-width="1.5"/><rect x="228" y="144" width="8" height="8" rx="1" fill="#fff" stroke="#FA961E" stroke-width="1.5"/><rect x="234" y="148" width="8" height="8" rx="1" fill="#fff" stroke="#FA961E" stroke-width="1.5"/><text x="240" y="242" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">захар</text><text x="240" y="260" font-size="15" text-anchor="middle" font-weight="normal" fill="#5A6478">(разтворено вещество)</text><text x="330" y="165" font-size="34" text-anchor="middle" font-weight="bold" fill="#0A2A66">=</text><path d="M390,90 L390,210 Q390,218 398,218 L502,218 Q510,218 510,210 L510,90" fill="#fff" stroke="#0A2A66" stroke-width="3"/><rect x="392" y="120" width="116" height="124" fill="#28AAE1" opacity="0.35"/><circle cx="410" cy="140" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="420" cy="162" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="410" cy="184" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="430" cy="140" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="440" cy="162" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="430" cy="184" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="450" cy="140" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="460" cy="162" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="450" cy="184" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="470" cy="140" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="480" cy="162" r="4" fill="#FA961E" stroke="none" stroke-width="2"/><circle cx="