<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Органи за хранене и дишане; съзряване</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0A2A66">Органи за хранене и дишане</text>
<rect x="16" y="50" width="340" height="338" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<g transform="translate(-14 0)"><circle cx="186" cy="90" r="30" fill="#FFE0C2"/>
<path d="M170 120 h32 v14 h-32 z" fill="#FFE0C2"/>
<path d="M126 140 q60 -14 120 0 l6 200 q-66 14 -132 0 z" fill="#FFE0C2"/>
<path d="M181 104 v100" stroke="#90A4AE" stroke-width="7" stroke-linecap="round"/>
<path d="M193 100 v46" stroke="#E57373" stroke-width="7" stroke-linecap="round"/>
<path d="M190 150 q-36 -4 -38 34 q-2 34 32 26 z" fill="#EF9A9A"/>
<path d="M196 150 q36 -4 38 34 q2 34 -32 26 z" fill="#EF9A9A"/>
<path d="M181 204 q40 -6 36 16 q-6 18 -40 10 z" fill="#FFB74D"/>
<path d="M160 244 q26 -12 52 0 q14 10 0 20 q-26 10 -52 0 q-14 -10 0 -20 z" fill="none" stroke="#E57373" stroke-width="7"/>
<path d="M166 254 q20 -8 40 0 M164 270 q24 10 46 0" stroke="#F8BBD0" stroke-width="6" fill="none"/>
<path d="M140 210 q20 -8 32 4 q-4 16 -32 10 z" fill="#8D6E63"/>
</g>
<g font-size="16" fill="#0A2A66">
<line x1="236" y1="80" x2="202" y2="96" stroke="#0A2A66"/><text x="240" y="84">уста, нос</text>
<line x1="236" y1="122" x2="182" y2="122" stroke="#0A2A66"/><text x="240" y="126">трахея</text>
<line x1="236" y1="168" x2="216" y2="176" stroke="#0A2A66"/><text x="240" y="172">бели дробове</text>
<line x1="236" y1="214" x2="200" y2="216" stroke="#0A2A66"/><text x="240" y="218">стомах</text>
<line x1="236" y1="262" x2="200" y2="258" stroke="#0A2A66"/><text x="240" y="266">черва</text>
<line x1="128" y1="150" x2="166" y2="150" stroke="#0A2A66"/><text x="30" y="155">хранопровод</text>
<line x1="84" y1="214" x2="132" y2="214" stroke="#0A2A66"/><text x="30" y="219">черен</text><text x="30" y="237">дроб</text>
</g>
<rect x="36" y="352" width="16" height="16" rx="4" fill="#EF9A9A"/><text x="58" y="366" font-size="16" fill="#0A2A66">дишане</text>
<rect x="140" y="352" width="16" height="16" rx="4" fill="#FFB74D"/><text x="162" y="366" font-size="16" fill="#0A2A66">хранене (храносмилане)</text>
<rect x="366" y="50" width="258" height="338" rx="16" fill="#fff" stroke="#14BF96" stroke-width="2"/>
<text x="495" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Растеж и съзряване</text>
<g fill="#28AAE1">
<circle cx="390" cy="226" r="9"/><rect x="382" y="236" width="16" height="30" rx="7"/>
<circle cx="440" cy="196" r="11"/><rect x="430" y="208" width="20" height="58" rx="9"/>
<circle cx="494" cy="164" r="12"/><rect x="483" y="178" width="22" height="88" rx="10"/>
<circle cx="572" cy="134" r="13"/><rect x="560" y="149" width="24" height="117" rx="11"/>
</g>
<line x1="380" y1="268" x2="610" y2="268" stroke="#90A4AE" stroke-width="2"/>
<g font-size="16" fill="#0A2A66" text-anchor="middle">
<text x="390" y="290">бебе</text><text x="440" y="290">дете</text><text x="494" y="290">юноша</text><text x="572" y="290">възрастен</text>
</g>
<text x="495" y="320" text-anchor="middle" font-size="16" fill="#0A2A66">При съзряване тялото расте</text>
<text x="495" y="342" text-anchor="middle" font-size="16" fill="#0A2A66">бързо, гласът и кожата се</text>
<text x="495" y="364" text-anchor="middle" font-size="16" fill="#0A2A66">променят. Това е нормално!</text>
</svg>
