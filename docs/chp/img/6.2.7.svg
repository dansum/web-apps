<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Замърсители на въздуха и екологични проблеми</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Замърсители на въздуха</text>
<rect x="0" y="300" width="640" height="100" fill="#CFE8C4"/>
<circle cx="590" cy="95" r="26" fill="#FFD23F"/>
<rect x="40" y="220" width="120" height="80" fill="#5B6470"/><rect x="60" y="150" width="22" height="70" fill="#5B6470"/><rect x="110" y="170" width="22" height="50" fill="#5B6470"/>
<circle cx="72" cy="130" r="16" fill="#8A8F98" opacity="0.8"/><circle cx="92" cy="112" r="20" fill="#8A8F98" opacity="0.7"/><circle cx="122" cy="150" r="14" fill="#8A8F98" opacity="0.8"/>
<text x="100" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">завод</text>
<rect x="200" y="272" width="70" height="22" rx="6" fill="#FA961E"/><circle cx="215" cy="296" r="7" fill="#0A2A66"/><circle cx="255" cy="296" r="7" fill="#0A2A66"/>
<circle cx="190" cy="285" r="9" fill="#8A8F98" opacity="0.7"/><circle cx="176" cy="276" r="11" fill="#8A8F98" opacity="0.6"/>
<rect x="150" y="70" width="220" height="92" rx="12" fill="#FFFFFF" stroke="#D9363E" stroke-width="2"/>
<text x="162" y="94" text-anchor="start" font-size="15" font-weight="700" fill="#0A2A66">SO₂ серен диоксид</text>
<text x="162" y="118" text-anchor="start" font-size="15" font-weight="700" fill="#0A2A66">CO₂ въглероден диоксид</text>
<text x="162" y="142" text-anchor="start" font-size="15" font-weight="700" fill="#0A2A66">CO въглероден оксид</text>
<line x1="140" y1="120" x2="122" y2="128" stroke="#0A2A66" stroke-width="2"/>
<g fill="#9AA3AE"><circle cx="440" cy="110" r="28"/><circle cx="475" cy="95" r="32"/><circle cx="510" cy="115" r="26"/><rect x="420" y="110" width="110" height="28" rx="14"/></g>
<line x1="430" y1="148" x2="422" y2="172" stroke="#28AAE1" stroke-width="3"/>
<line x1="446" y1="148" x2="438" y2="172" stroke="#28AAE1" stroke-width="3"/>
<line x1="462" y1="148" x2="454" y2="172" stroke="#28AAE1" stroke-width="3"/>
<line x1="478" y1="148" x2="470" y2="172" stroke="#28AAE1" stroke-width="3"/>
<line x1="494" y1="148" x2="486" y2="172" stroke="#28AAE1" stroke-width="3"/>
<line x1="510" y1="148" x2="502" y2="172" stroke="#28AAE1" stroke-width="3"/>
<line x1="526" y1="148" x2="518" y2="172" stroke="#28AAE1" stroke-width="3"/>
<text x="475" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#D9363E">киселинен дъжд</text>
<rect x="465" y="240" width="10" height="60" fill="#7A5230"/><circle cx="470" cy="232" r="24" fill="#B8A44A"/>
<line x1="380" y1="125" x2="415" y2="120" stroke="#0A2A66" stroke-width="2" marker-end="url(#an)"/>
<text x="392" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2A66">SO₂</text>
<path d="M590,128 L560,255" stroke="#FA961E" stroke-width="3" marker-end="url(#ao)"/>
<path d="M560,265 L600,215" stroke="#D9363E" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="560" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#D9363E">парников</text>
<text x="560" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#D9363E">ефект (CO₂)</text>
<text x="320" y="340" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">CO е отровен газ. SO₂ води до киселинни дъждове, а CO₂ засилва парниковия ефект.</text>
<text x="320" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#1E7A3A">Можем да помогнем: по-малко коли, чиста енергия, повече зеленина.</text>
</svg>
