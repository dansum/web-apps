<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Дишане и развитие на животните</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FA961E"/></marker></defs>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0A2A66">Как дишат и как растат животните</text>
<rect x="16" y="50" width="250" height="250" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="141" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Дишане</text>
<path d="M70 100 v20" stroke="#E57373" stroke-width="6" stroke-linecap="round"/>
<path d="M68 118 q-30 -4 -32 30 q-2 30 26 30 q8 0 8 -12 z" fill="#E57373"/>
<path d="M72 118 q30 -4 32 30 q2 30 -26 30 q-8 0 -8 -12 z" fill="#E57373"/>
<text x="70" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#0A2A66">бели дробове</text>
<text x="70" y="228" text-anchor="middle" font-size="16" fill="#0A2A66">куче, птица,</text>
<text x="70" y="248" text-anchor="middle" font-size="16" fill="#0A2A66">човек</text>
<path d="M150 140 q40 -34 90 0 q-40 34 -90 0 z" fill="#28AAE1"/>
<path d="M240 140 l18 -16 v32 z" fill="#28AAE1"/>
<circle cx="166" cy="136" r="4" fill="#0A2A66"/>
<path d="M180 126 q6 14 0 28 M188 126 q6 14 0 28" stroke="#E53935" stroke-width="3" fill="none"/>
<circle cx="150" cy="108" r="4" fill="none" stroke="#28AAE1" stroke-width="2"/><circle cx="144" cy="96" r="3" fill="none" stroke="#28AAE1" stroke-width="2"/>
<text x="200" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#0A2A66">хриле</text>
<text x="200" y="228" text-anchor="middle" font-size="16" fill="#0A2A66">риби</text>
<text x="141" y="280" text-anchor="middle" font-size="16" fill="#0A2A66">Всички дишат кислород.</text>
<rect x="276" y="50" width="348" height="250" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="450" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Развитие</text>
<text x="292" y="104" font-size="16" fill="#0A2A66">снасят яйца:</text>
<ellipse cx="320" cy="146" rx="16" ry="21" fill="#FFF3E0" stroke="#C8A165" stroke-width="2"/>
<line x1="344" y1="146" x2="376" y2="146" stroke="#FA961E" stroke-width="3" marker-end="url(#a)"/>
<circle cx="406" cy="146" r="16" fill="#FFE082"/><circle cx="412" cy="140" r="2.5" fill="#0A2A66"/><path d="M420 144 l8 3 l-8 3 z" fill="#FA961E"/>
<line x1="432" y1="146" x2="464" y2="146" stroke="#FA961E" stroke-width="3" marker-end="url(#a)"/>
<ellipse cx="510" cy="152" rx="28" ry="20" fill="#fff" stroke="#0A2A66" stroke-width="2"/><circle cx="534" cy="128" r="12" fill="#fff" stroke="#0A2A66" stroke-width="2"/><path d="M534 114 l4 -8 l4 8" fill="#E53935"/><path d="M545 128 l8 3 l-8 3 z" fill="#FA961E"/>
<text x="320" y="186" text-anchor="middle" font-size="16" fill="#0A2A66">яйце</text><text x="406" y="186" text-anchor="middle" font-size="16" fill="#0A2A66">пиле</text><text x="510" y="190" text-anchor="middle" font-size="16" fill="#0A2A66">кокошка</text>
<text x="292" y="214" font-size="16" fill="#0A2A66">раждат малките си:</text>
<ellipse cx="340" cy="254" rx="18" ry="12" fill="#FFB74D"/><circle cx="356" cy="244" r="9" fill="#FFB74D"/>
<line x1="372" y1="254" x2="420" y2="254" stroke="#FA961E" stroke-width="3" marker-end="url(#a)"/>
<ellipse cx="480" cy="256" rx="34" ry="18" fill="#FFB74D"/><circle cx="514" cy="238" r="14" fill="#FFB74D"/><path d="M506 226 l4 -10 l6 8 M518 224 l6 -8 l2 10" fill="#FFB74D" stroke="#FFB74D"/>
<text x="340" y="288" text-anchor="middle" font-size="16" fill="#0A2A66">коте</text><text x="480" y="288" text-anchor="middle" font-size="16" fill="#0A2A66">котка – бозае малките</text>
<rect x="16" y="310" width="608" height="78" rx="16" fill="#E6F8F2" stroke="#14BF96" stroke-width="2"/>
<text x="320" y="338" text-anchor="middle" font-size="17" font-weight="bold" fill="#0A2A66">Откъде е енергията? От храната!</text>
<text x="320" y="366" text-anchor="middle" font-size="16" fill="#0A2A66">Животните я използват, за да се движат, растат и да поддържат телесна топлина.</text>
</svg>
