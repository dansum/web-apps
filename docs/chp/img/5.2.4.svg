<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img"><title>Замърсяване и опазване на въздуха</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker><marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="640" height="400" fill="#F7F7F7"/><text x="320" y="34" font-size="22" text-anchor="middle" font-weight="bold" fill="#0A2A66">Опазване чистотата на въздуха</text><rect x="14" y="52" width="300" height="300" rx="10" fill="#FDEDEC" stroke="#E94B3C" stroke-width="2"/><rect x="326" y="52" width="300" height="300" rx="10" fill="#E8F8EE" stroke="#3CB44B" stroke-width="2"/><text x="164" y="80" font-size="17" text-anchor="middle" font-weight="bold" fill="#C0392B">Източници на замърсяване</text><text x="476" y="80" font-size="17" text-anchor="middle" font-weight="bold" fill="#1E7B34">Как опазваме въздуха</text><path d="M30,230 L80,160 L100,160 L150,230 z" fill="#8D6E63" stroke="none" stroke-width="2"/><path d="M88,158 q-10,-24 8,-32 q18,-6 18,-20" fill="none" stroke="#5A6478" stroke-width="8" stroke-linecap="round" opacity="0.7"/><text x="90" y="252" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">вулкан</text><text x="90" y="270" font-size="15" text-anchor="middle" font-weight="normal" fill="#5A6478">(природно)</text><rect x="180" y="185" width="110" height="45" rx="2" fill="#9AA5B8" stroke="#0A2A66" stroke-width="2"/><rect x="250" y="140" width="20" height="45" rx="2" fill="#7D889C" stroke="#0A2A66" stroke-width="2"/><path d="M260,136 q-8,-14 6,-20 q14,-6 10,-16" fill="none" stroke="#555" stroke-width="10" stroke-linecap="round" opacity="0.6"/><text x="235" y="252" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">завод</text><text x="235" y="270" font-size="15" text-anchor="middle" font-weight="normal" fill="#5A6478">(човешка дейност)</text><path d="M60,330 L60,310 L80,310 L95,295 L140,295 L155,310 L175,310 L175,330 z" fill="#FA961E" stroke="#0A2A66" stroke-width="2"/><circle cx="85" cy="332" r="9" fill="#0A2A66" stroke="none" stroke-width="2"/><circle cx="150" cy="332" r="9" fill="#0A2A66" stroke="none" stroke-width="2"/><path d="M58,325 q-14,0 -18,-10 q-10,-4 -14,4" fill="none" stroke="#5A6478" stroke-width="5" stroke-linecap="round" opacity="0.7"/><text x="240" y="322" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">автомобили</text><text x="240" y="340" font-size="15" text-anchor="middle" font-weight="normal" fill="#5A6478">дим, прах, газове</text><rect x="364" y="210" width="10" height="40" rx="2" fill="#8D6E63" stroke="none" stroke-width="0"/><circle cx="369" cy="190" r="30" fill="#3CB44B" stroke="none" stroke-width="2"/><text x="370" y="274" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">дървета</text><circle cx="445" cy="230" r="16" fill="none" stroke="#0A2A66" stroke-width="3"/><circle cx="495" cy="230" r="16" fill="none" stroke="#0A2A66" stroke-width="3"/><path d="M445,230 L465,200 L495,230 M465,200 L485,200 L495,230 M460,192 L472,192" fill="none" stroke="#14BF96" stroke-width="3"/><text x="470" y="274" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">колело и</text><text x="470" y="292" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">ходене пеша</text><path d="M540,240 L560,190 L610,190 L600,240 z" fill="#28AAE1" stroke="#0A2A66" stroke-width="2"/><line x1="550" y1="215" x2="605" y2="215" stroke="#fff" stroke-width="1.5"/><line x1="580" y1="190" x2="570" y2="240" stroke="#fff" stroke-width="1.5"/><text x="575" y="274" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">чиста</text><text x="575" y="292" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">енергия</text><text x="476" y="322" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">филтри в комините,</text><text x="476" y="340" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">без горене на отпадъци</text><text x="320" y="382" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">Замърсеният въздух вреди на здравето и на природата.</text></svg>