<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Групи животни</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0A2A66">Групи животни</text>
<rect x="16" y="50" width="160" height="338" rx="16" fill="#FFF4E6" stroke="#FA961E" stroke-width="2"/>
<text x="96" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#FA961E">Безгръбначни</text>
<text x="96" y="100" text-anchor="middle" font-size="16" fill="#0A2A66">нямат гръбнак</text>
<g transform="translate(96 160)">
<ellipse cx="0" cy="0" rx="8" ry="22" fill="#5D4037"/>
<ellipse cx="-20" cy="-8" rx="20" ry="13" fill="#FA961E"/><ellipse cx="20" cy="-8" rx="20" ry="13" fill="#FA961E"/>
<ellipse cx="-16" cy="12" rx="14" ry="10" fill="#FBC57E"/><ellipse cx="16" cy="12" rx="14" ry="10" fill="#FBC57E"/>
</g>
<text x="96" y="210" text-anchor="middle" font-size="16" fill="#0A2A66">насекоми:</text>
<text x="96" y="230" text-anchor="middle" font-size="16" fill="#0A2A66">пеперуда, пчела</text>
<path d="M60 290 q16 -16 32 0 q16 16 32 0" stroke="#F48FB1" stroke-width="10" fill="none" stroke-linecap="round"/>
<text x="96" y="330" text-anchor="middle" font-size="16" fill="#0A2A66">червеи, охлюви,</text>
<text x="96" y="350" text-anchor="middle" font-size="16" fill="#0A2A66">паяци</text>
<rect x="186" y="50" width="438" height="338" rx="16" fill="#E6F8F2" stroke="#14BF96" stroke-width="2"/>
<text x="405" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#14BF96">Гръбначни – имат гръбнак</text>
<g font-size="16" fill="#0A2A66" text-anchor="middle">
<rect x="200" y="92" width="134" height="140" rx="12" fill="#fff"/>
<path d="M232 150 q34 -28 70 0 q-34 28 -70 0 z" fill="#28AAE1"/><path d="M302 150 l14 -12 v24 z" fill="#28AAE1"/><circle cx="246" cy="146" r="3" fill="#0A2A66"/>
<text x="267" y="196" font-weight="bold">риби</text><text x="267" y="218">шаран</text>
<rect x="338" y="92" width="134" height="140" rx="12" fill="#fff"/>
<ellipse cx="405" cy="158" rx="26" ry="16" fill="#3CB44B"/><circle cx="392" cy="140" r="6" fill="#3CB44B"/><circle cx="418" cy="140" r="6" fill="#3CB44B"/><circle cx="392" cy="140" r="2.5" fill="#0A2A66"/><circle cx="418" cy="140" r="2.5" fill="#0A2A66"/>
<path d="M382 168 l-10 10 M428 168 l10 10" stroke="#3CB44B" stroke-width="5" stroke-linecap="round"/>
<text x="405" y="196" font-weight="bold">земноводни</text><text x="405" y="218">жаба</text>
<rect x="476" y="92" width="134" height="140" rx="12" fill="#fff"/>
<path d="M500 160 q20 -18 40 -4 q20 14 40 -4 q10 -6 18 2" stroke="#8D9440" stroke-width="12" fill="none" stroke-linecap="round"/>
<text x="543" y="196" font-weight="bold">влечуги</text><text x="543" y="218">гущер, змия</text>
<rect x="200" y="238" width="134" height="140" rx="12" fill="#fff"/>
<ellipse cx="262" cy="300" rx="28" ry="18" fill="#FA961E"/><circle cx="290" cy="280" r="12" fill="#FA961E"/><path d="M301 280 l10 4 l-10 4 z" fill="#0A2A66"/><path d="M250 296 q14 -20 30 0" fill="#FBC57E"/>
<text x="267" y="342" font-weight="bold">птици</text><text x="267" y="364">врабче, щъркел</text>
<rect x="338" y="238" width="272" height="140" rx="12" fill="#fff"/>
<ellipse cx="470" cy="300" rx="36" ry="20" fill="#A1887F"/><circle cx="508" cy="282" r="14" fill="#A1887F"/><path d="M498 270 l4 -12 l6 10 M512 268 l6 -10 l2 12" fill="#A1887F" stroke="#A1887F"/>
<path d="M444 316 v14 M496 316 v14" stroke="#A1887F" stroke-width="6" stroke-linecap="round"/>
<text x="474" y="342" font-weight="bold">бозайници</text><text x="474" y="364">куче, кон – кърмят малките</text>
</g>
</svg>
