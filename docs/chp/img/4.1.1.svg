<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Свойства на веществата около нас</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Как да сравним веществата?</text>
<g>
<rect x="20" y="56" width="292" height="160" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="166" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Привлича ли се от магнит?</text>
<path d="M45 100 h30 v50 a17 17 0 0 0 34 0 v-50 h30 v50 a47 47 0 0 1 -94 0 z" fill="#E53935"/>
<rect x="45" y="100" width="30" height="16" fill="#B0BEC5"/><rect x="109" y="100" width="30" height="16" fill="#B0BEC5"/>
<rect x="160" y="132" width="70" height="8" rx="3" fill="#78909C"/>
<text x="235" y="162" text-anchor="middle" font-size="16" fill="#0A2A66">желязо – да</text>
<rect x="160" y="176" width="70" height="10" rx="4" fill="#C8A165"/>
<text x="235" y="206" text-anchor="middle" font-size="16" fill="#0A2A66">дърво – не</text>
</g>
<g>
<rect x="328" y="56" width="292" height="160" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="474" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Плава или потъва?</text>
<rect x="350" y="105" width="150" height="100" rx="10" fill="#BDE7F7" stroke="#28AAE1" stroke-width="2"/>
<rect x="350" y="122" width="150" height="4" fill="#28AAE1"/>
<rect x="370" y="110" width="44" height="20" rx="5" fill="#C8A165"/>
<ellipse cx="460" cy="190" rx="22" ry="13" fill="#8D8D8D"/>
<text x="560" y="124" text-anchor="middle" font-size="16" fill="#0A2A66">дърво –</text>
<text x="560" y="144" text-anchor="middle" font-size="16" fill="#3CB44B" font-weight="bold">плава</text>
<text x="560" y="176" text-anchor="middle" font-size="16" fill="#0A2A66">камък –</text>
<text x="560" y="196" text-anchor="middle" font-size="16" fill="#FA961E" font-weight="bold">потъва</text>
</g>
<g>
<rect x="20" y="228" width="292" height="160" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="166" y="256" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Разтваря ли се във вода?</text>
<path d="M50 280 h60 l-6 90 h-48 z" fill="#E3F6FD" stroke="#28AAE1" stroke-width="2"/>
<rect x="58" y="300" width="45" height="66" fill="#BDE7F7"/>
<circle cx="70" cy="330" r="2" fill="#fff"/><circle cx="85" cy="345" r="2" fill="#fff"/><circle cx="92" cy="320" r="2" fill="#fff"/>
<path d="M170 280 h60 l-6 90 h-48 z" fill="#E3F6FD" stroke="#28AAE1" stroke-width="2"/>
<rect x="178" y="300" width="45" height="66" fill="#BDE7F7"/>
<rect x="184" y="352" width="34" height="12" rx="5" fill="#C8A165"/>
<text x="120" y="320" font-size="16" fill="#0A2A66">захар –</text>
<text x="120" y="340" font-size="16" fill="#3CB44B" font-weight="bold">да</text>
<text x="240" y="320" font-size="16" fill="#0A2A66">пясък –</text>
<text x="240" y="340" font-size="16" fill="#FA961E" font-weight="bold">не</text>
</g>
<g>
<rect x="328" y="228" width="292" height="160" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="474" y="256" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Провежда ли топлина?</text>
<path d="M350 300 h80 v50 a20 20 0 0 1 -20 20 h-40 a20 20 0 0 1 -20 -20 z" fill="#FA961E"/>
<path d="M370 292 q-6 -10 0 -20 M390 292 q-6 -10 0 -20 M410 292 q-6 -10 0 -20" stroke="#B0BEC5" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="395" y1="320" x2="440" y2="278" stroke="#78909C" stroke-width="7" stroke-linecap="round"/>
<text x="455" y="300" font-size="16" fill="#0A2A66">метал – да,</text>
<text x="455" y="320" font-size="16" fill="#0A2A66">лъжицата</text>
<text x="455" y="340" font-size="16" fill="#0A2A66">се затопля</text>
<text x="455" y="370" font-size="16" fill="#0A2A66">дърво – слабо</text>
</g>
</svg>
