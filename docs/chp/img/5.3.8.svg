<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img"><title>Единство на природата</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker><marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="640" height="400" fill="#F7F7F7"/><text x="320" y="34" font-size="22" text-anchor="middle" font-weight="bold" fill="#0A2A66">Единство на природата</text><circle cx="320" cy="215" r="120" fill="none" stroke="#B8C4D6" stroke-width="2" stroke-dasharray="6 5"/><circle cx="320" cy="215" r="62" fill="#14BF96" stroke="none" stroke-width="2"/><text x="320" y="209" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff">Човекът –</text><text x="320" y="231" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">част от природата</text><circle cx="320.0" cy="95.0" r="30" fill="#FFD23F" stroke="#0A2A66" stroke-width="2"/><text x="320.0" y="55.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">Слънце</text><circle cx="423.92304845413264" cy="155.0" r="30" fill="#D6EEF8" stroke="#0A2A66" stroke-width="2"/><text x="461.92304845413264" y="161.0" font-size="16" text-anchor="start" font-weight="bold" fill="#0A2A66">въздух</text><circle cx="423.92304845413264" cy="275.0" r="30" fill="#28AAE1" stroke="#0A2A66" stroke-width="2"/><text x="461.92304845413264" y="281.0" font-size="16" text-anchor="start" font-weight="bold" fill="#0A2A66">вода</text><circle cx="320.0" cy="335.0" r="30" fill="#C8A165" stroke="#0A2A66" stroke-width="2"/><text x="320.0" y="385.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">почва</text><circle cx="216.07695154586736" cy="275.0" r="30" fill="#FA961E" stroke="#0A2A66" stroke-width="2"/><text x="178.07695154586736" y="281.0" font-size="16" text-anchor="end" font-weight="bold" fill="#0A2A66">животни</text><circle cx="216.07695154586736" cy="155.0" r="30" fill="#3CB44B" stroke="#0A2A66" stroke-width="2"/><text x="178.07695154586736" y="161.0" font-size="16" text-anchor="end" font-weight="bold" fill="#0A2A66">растения</text><rect x="14" y="70" width="150" height="64" rx="8" fill="#fff" stroke="#28AAE1" stroke-width="2"/><text x="89" y="96" font-size="16" text-anchor="middle" font-weight="bold" fill="#28AAE1">нежива</text><text x="89" y="118" font-size="16" text-anchor="middle" font-weight="bold" fill="#28AAE1">природа</text><rect x="14" y="290" width="150" height="64" rx="8" fill="#fff" stroke="#3CB44B" stroke-width="2"/><text x="89" y="316" font-size="16" text-anchor="middle" font-weight="bold" fill="#3CB44B">жива</text><text x="89" y="338" font-size="16" text-anchor="middle" font-weight="bold" fill="#3CB44B">природа</text><rect x="480" y="70" width="150" height="120" rx="8" fill="#fff" stroke="#0A2A66" stroke-width="2"/><text x="555" y="96" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">Всичко е</text><text x="555" y="116" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">изградено от</text><text x="555" y="136" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">едни и същи</text><text x="555" y="156" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">химични</text><text x="555" y="176" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">елементи</text><rect x="480" y="250" width="150" height="104" rx="8" fill="#fff" stroke="#3CB44B" stroke-width="2"/><text x="555" y="276" font-size="15" text-anchor="middle" font-weight="bold" fill="#1E7B34">Опазваме</text><text x="555" y="296" font-size="15" text-anchor="middle" font-weight="bold" fill="#1E7B34">природата –</text><text x="555" y="316" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">пазим и</text><text x="555" y="336" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">своето здраве</text><text x="320" y="388" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">Живата и неживата природа са свързани в едно цяло.</text></svg>