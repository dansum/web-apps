<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img"><title>Единство на природата</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker><marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="640" height="400" fill="#F7F7F7"/><text x="320" y="34" font-size="22" text-anchor="middle" font-weight="bold" fill="#0A2A66">Единство на природата</text><circle cx="320" cy="205" r="125" fill="none" stroke="#B8C4D6" stroke-width="2" stroke-dasharray="6 5"/><circle cx="320" cy="205" r="66" fill="#14BF96" stroke="none" stroke-width="2"/><text x="320" y="191" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff">Човекът –</text><text x="320" y="211" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">част от</text><text x="320" y="231" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">природата</text><circle cx="320.0" cy="80.0" r="38" fill="#FFD23F" stroke="#28AAE1" stroke-width="4"/><text x="320.0" y="85.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">Слънце</text><circle cx="428.25317547305485" cy="142.5" r="38" fill="#E3F4FB" stroke="#28AAE1" stroke-width="4"/><text x="428.25317547305485" y="147.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">въздух</text><circle cx="428.25317547305485" cy="267.5" r="38" fill="#9ED8F0" stroke="#28AAE1" stroke-width="4"/><text x="428.25317547305485" y="272.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">вода</text><circle cx="320.0" cy="330.0" r="38" fill="#D9BE8E" stroke="#28AAE1" stroke-width="4"/><text x="320.0" y="335.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">почва</text><circle cx="211.74682452694515" cy="267.5" r="38" fill="#FDC98A" stroke="#3CB44B" stroke-width="4"/><text x="211.74682452694515" y="272.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">животни</text><circle cx="211.74682452694518" cy="142.5" r="38" fill="#A8E0A0" stroke="#3CB44B" stroke-width="4"/><text x="211.74682452694518" y="147.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">растения</text><rect x="14" y="70" width="150" height="64" rx="8" fill="#fff" stroke="#28AAE1" stroke-width="2"/><text x="89" y="96" font-size="16" text-anchor="middle" font-weight="bold" fill="#28AAE1">нежива</text><text x="89" y="118" font-size="16" text-anchor="middle" font-weight="bold" fill="#28AAE1">природа</text><rect x="14" y="290" width="150" height="64" rx="8" fill="#fff" stroke="#3CB44B" stroke-width="2"/><text x="89" y="316" font-size="16" text-anchor="middle" font-weight="bold" fill="#3CB44B">жива</text><text x="89" y="338" font-size="16" text-anchor="middle" font-weight="bold" fill="#3CB44B">природа</text><rect x="480" y="70" width="150" height="120" rx="8" fill="#fff" stroke="#0A2A66" stroke-width="2"/><text x="555" y="96" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">Всичко е</text><text x="555" y="116" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">изградено от</text><text x="555" y="136" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">едни и същи</text><text x="555" y="156" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">химични</text><text x="555" y="176" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">елементи</text><rect x="480" y="250" width="150" height="104" rx="8" fill="#fff" stroke="#3CB44B" stroke-width="2"/><text x="555" y="276" font-size="15" text-anchor="middle" font-weight="bold" fill="#1E7B34">Опазваме</text><text x="555" y="296" font-size="15" text-anchor="middle" font-weight="bold" fill="#1E7B34">природата –</text><text x="555" y="316" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">пазим и</text><text x="555" y="336" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">своето здраве</text><text x="320" y="388" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">Живата и неживата природа са свързани в едно цяло.</text></svg>