<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Светлината се разпространява праволинейно</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Светлината се движи по права линия</text>
<rect x="20" y="56" width="600" height="160" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="40" y="84" font-size="18" font-weight="bold" fill="#0A2A66">Опит с три картона</text>
<polygon points="60,136 110,118 110,154" fill="#FFE082"/>
<rect x="40" y="122" width="24" height="28" rx="4" fill="#0A2A66"/>
<line x1="64" y1="136" x2="560" y2="136" stroke="#FA961E" stroke-width="4"/>
<g fill="#C8A165"><rect x="180" y="96" width="14" height="80" rx="3"/><rect x="300" y="96" width="14" height="80" rx="3"/><rect x="420" y="96" width="14" height="80" rx="3"/></g>
<g fill="#fff"><circle cx="187" cy="136" r="5"/><circle cx="307" cy="136" r="5"/><circle cx="427" cy="136" r="5"/></g>
<circle cx="580" cy="136" r="16" fill="#fff" stroke="#0A2A66" stroke-width="3"/><circle cx="574" cy="136" r="6" fill="#0A2A66"/>
<text x="320" y="200" text-anchor="middle" font-size="16" fill="#0A2A66">Виждаме фенерчето само когато дупките са на една права линия.</text>
<rect x="20" y="228" width="600" height="160" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="40" y="256" font-size="18" font-weight="bold" fill="#0A2A66">Затова се образува сянка</text>
<circle cx="70" cy="320" r="18" fill="#FFD54F"/>
<g stroke="#FFD54F" stroke-width="3"><line x1="70" y1="292" x2="70" y2="284"/><line x1="70" y1="348" x2="70" y2="356"/><line x1="42" y1="320" x2="34" y2="320"/></g>
<polygon points="88,314 240,290 520,250 520,380 240,350 88,326" fill="#FFF3C4"/>
<line x1="88" y1="314" x2="520" y2="250" stroke="#FA961E" stroke-width="2"/><line x1="88" y1="326" x2="520" y2="380" stroke="#FA961E" stroke-width="2"/>
<polygon points="254,308 520,289 520,351 254,332" fill="#90A4AE"/>
<rect x="230" y="308" width="24" height="24" rx="5" fill="#14BF96"/>
<rect x="520" y="248" width="10" height="134" fill="#0A2A66"/>
<text x="242" y="298" text-anchor="middle" font-size="16" fill="#0A2A66">предмет</text>
<text x="420" y="324" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">сянка</text>
<text x="575" y="320" text-anchor="middle" font-size="16" fill="#0A2A66">екран</text>
<text x="70" y="380" text-anchor="middle" font-size="16" fill="#0A2A66">лампа</text>
</svg>
