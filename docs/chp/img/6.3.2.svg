<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Дразнимост и движение – път на сигнала</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Дразнимост и движение</text>
<rect x="18" y="80" width="104" height="70" rx="12" fill="#FFFFFF" stroke="#FA961E" stroke-width="2"/>
<text x="70" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#FA961E">дразнител</text>
<text x="70" y="134" text-anchor="middle" font-size="15" font-weight="400" fill="#444">горещо</text>
<line x1="124" y1="115" x2="138" y2="115" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="142" y="80" width="104" height="70" rx="12" fill="#FFFFFF" stroke="#28AAE1" stroke-width="2"/>
<text x="194" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#28AAE1">рецептор</text>
<text x="194" y="134" text-anchor="middle" font-size="15" font-weight="400" fill="#444">кожа</text>
<line x1="248" y1="115" x2="262" y2="115" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="266" y="80" width="104" height="70" rx="12" fill="#FFFFFF" stroke="#E0B400" stroke-width="2"/>
<text x="318" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#8A6D00">нерв</text>
<text x="318" y="134" text-anchor="middle" font-size="15" font-weight="400" fill="#444">сигнал</text>
<line x1="372" y1="115" x2="386" y2="115" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="390" y="80" width="104" height="70" rx="12" fill="#FFFFFF" stroke="#0A2A66" stroke-width="2"/>
<text x="442" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#0A2A66">мозък</text>
<text x="442" y="134" text-anchor="middle" font-size="15" font-weight="400" fill="#444">решение</text>
<line x1="496" y1="115" x2="510" y2="115" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="514" y="80" width="104" height="70" rx="12" fill="#FFFFFF" stroke="#D9363E" stroke-width="2"/>
<text x="566" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#D9363E">мускул</text>
<text x="566" y="134" text-anchor="middle" font-size="15" font-weight="400" fill="#444">свиване</text>
<text x="320" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2A66">Дразнимост – реакция на дразнители. При животните: нервна система + мускули.</text>
<text x="320" y="198" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Резултат: движение (напр. дърпаме ръката от горещото).</text>
<line x1="20" y1="215" x2="620" y2="215" stroke="#DDD" stroke-width="2"/>
<circle cx="70" cy="265" r="22" fill="#FFD23F"/>
<line x1="98.0" y1="265.0" x2="106.0" y2="265.0" stroke="#FFD23F" stroke-width="3"/>
<line x1="89.8" y1="284.8" x2="95.5" y2="290.5" stroke="#FFD23F" stroke-width="3"/>
<line x1="70.0" y1="293.0" x2="70.0" y2="301.0" stroke="#FFD23F" stroke-width="3"/>
<line x1="50.2" y1="284.8" x2="44.5" y2="290.5" stroke="#FFD23F" stroke-width="3"/>
<line x1="42.0" y1="265.0" x2="34.0" y2="265.0" stroke="#FFD23F" stroke-width="3"/>
<line x1="50.2" y1="245.2" x2="44.5" y2="239.5" stroke="#FFD23F" stroke-width="3"/>
<line x1="70.0" y1="237.0" x2="70.0" y2="229.0" stroke="#FFD23F" stroke-width="3"/>
<line x1="89.8" y1="245.2" x2="95.5" y2="239.5" stroke="#FFD23F" stroke-width="3"/>
<path d="M230,375 C230,320 210,290 170,270" fill="none" stroke="#3CB44B" stroke-width="6"/>
<ellipse cx="160" cy="265" rx="16" ry="11" fill="#3CB44B"/><ellipse cx="205" cy="315" rx="18" ry="8" fill="#3CB44B"/>
<rect x="205" y="370" width="50" height="22" fill="#B07A45"/>
<text x="265" y="262" text-anchor="start" font-size="15" font-weight="700" fill="#3CB44B">Растенията се движат бавно –</text>
<text x="265" y="282" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">стъблото се обръща към светлината.</text>
<text x="265" y="322" text-anchor="start" font-size="15" font-weight="700" fill="#D9363E">Животните се движат бързо –</text>
<text x="265" y="342" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">с мускули, кости и нерви.</text>
<text x="265" y="375" text-anchor="start" font-size="15" font-weight="700" fill="#0A2A66">Общо: и двете реагират на дразнители.</text>
</svg>
