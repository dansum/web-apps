<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Атоми, молекули и йони</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Градивни частици на веществата</text>
<rect x="20" y="70" width="190" height="250" rx="12" fill="#F7F7F7" stroke="#28AAE1" stroke-width="2"/>
<text x="115" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#28AAE1">Атом</text>
<rect x="225" y="70" width="190" height="250" rx="12" fill="#F7F7F7" stroke="#3CB44B" stroke-width="2"/>
<text x="320" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#3CB44B">Молекула</text>
<rect x="430" y="70" width="190" height="250" rx="12" fill="#F7F7F7" stroke="#FA961E" stroke-width="2"/>
<text x="525" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#FA961E">Йон</text>
<circle cx="115" cy="175" r="34" fill="#9AA3AE" stroke="#0A2A66" stroke-width="1.5"/><text x="115" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Fe</text>
<text x="115" y="245" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">атом на желязо</text>
<text x="115" y="272" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">неутрална частица:</text>
<text x="115" y="292" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">протони = електрони</text>
<circle cx="320" cy="180" r="30" fill="#E0463C" stroke="#0A2A66" stroke-width="1.5"/><text x="320" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">O</text>
<circle cx="283" cy="150" r="19" fill="#FFFFFF" stroke="#0A2A66" stroke-width="1.5"/><text x="283" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#0A2A66">H</text>
<circle cx="357" cy="150" r="19" fill="#FFFFFF" stroke="#0A2A66" stroke-width="1.5"/><text x="357" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#0A2A66">H</text>
<text x="320" y="245" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">молекула вода H₂O</text>
<text x="320" y="272" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">свързани атоми,</text>
<text x="320" y="292" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">които са едно цяло</text>
<circle cx="487" cy="175" r="24" fill="#8E6CC8" stroke="#0A2A66" stroke-width="1.5"/><text x="487" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Na</text>
<text x="518" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#FA961E">+</text>
<circle cx="572" cy="175" r="32" fill="#3CB44B" stroke="#0A2A66" stroke-width="1.5"/><text x="572" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Cl</text>
<text x="610" y="148" text-anchor="middle" font-size="22" font-weight="700" fill="#FA961E">−</text>
<text x="525" y="245" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">йони Na⁺ и Cl⁻</text>
<text x="525" y="272" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">заредени частици:</text>
<text x="525" y="292" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">дадени/приети електрони</text>
<rect x="20" y="335" width="600" height="50" rx="10" fill="#E8F8F3"/>
<text x="320" y="357" text-anchor="middle" font-size="16" font-weight="700" fill="#0A2A66">Химичен елемент – вид атоми и йони с еднакъв брой</text>
<text x="320" y="377" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">протони в ядрото (напр. всички атоми и йони на кислорода имат 8 протона).</text>
</svg>
