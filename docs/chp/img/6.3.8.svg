<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Единство на живата и неживата природа и ролята на човека</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Човекът – част от природата</text>
<circle cx="160" cy="175" r="100" fill="#E6F5FC" stroke="#28AAE1" stroke-width="3"/>
<circle cx="480" cy="175" r="100" fill="#E8F6E9" stroke="#3CB44B" stroke-width="3"/>
<text x="160" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#28AAE1">Нежива природа</text>
<text x="480" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#3CB44B">Жива природа</text>
<text x="160" y="160" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Слънце, вода,</text>
<text x="160" y="182" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">въздух, почва,</text>
<text x="160" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">скали</text>
<text x="480" y="160" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">растения, гъби,</text>
<text x="480" y="182" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">животни,</text>
<text x="480" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">човекът</text>
<circle cx="120" cy="240" r="12" fill="#FFD23F"/><path d="M175,248 q10,-14 20,0 q10,-14 20,0" stroke="#28AAE1" stroke-width="3" fill="none"/>
<path d="M455,248 l0,-22" stroke="#3CB44B" stroke-width="4"/><ellipse cx="447" cy="228" rx="9" ry="5" fill="#3CB44B"/><ellipse cx="463" cy="224" rx="9" ry="5" fill="#3CB44B"/>
<circle cx="505" cy="228" r="7" fill="#F2C9A0"/><rect x="498" y="236" width="14" height="16" rx="4" fill="#FA961E"/>
<path d="M262,150 Q320,120 378,150" fill="none" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<path d="M378,200 Q320,230 262,200" fill="none" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<text x="320" y="117" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">енергия и вещества</text>
<text x="320" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2A66">кръговрат</text>
<text x="320" y="245" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">CO₂ и минерални соли</text>
<rect x="20" y="290" width="290" height="100" rx="12" fill="#FDECEC" stroke="#D9363E" stroke-width="2"/>
<text x="165" y="315" text-anchor="middle" font-size="16" font-weight="700" fill="#D9363E">Вредно за природата</text>
<text x="165" y="340" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">замърсяване, сеч на гори,</text>
<text x="165" y="362" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">отпадъци, бракониерство</text>
<rect x="330" y="290" width="290" height="100" rx="12" fill="#E8F6E9" stroke="#3CB44B" stroke-width="2"/>
<text x="475" y="315" text-anchor="middle" font-size="16" font-weight="700" fill="#1E7A3A">Полезно за природата</text>
<text x="475" y="340" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">залесяване, рециклиране,</text>
<text x="475" y="362" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">пестене на вода и енергия</text>
</svg>
