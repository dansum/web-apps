<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Приспособления към средата на живот</title>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Всеки организъм е приспособен към средата си</text>
<g>
<rect x="20" y="52" width="292" height="248" rx="18" fill="#D6EEF9"/>
<path d="M20 100 q36 -12 73 0 t73 0 t73 0 t73 0" stroke="#28AAE1" stroke-width="3" fill="none"/>
<text x="166" y="82" text-anchor="middle" font-size="22" font-weight="bold" fill="#28AAE1">Във водата</text>
<path d="M70 170 q40 -40 90 0 q-50 40 -90 0 z" fill="#FA961E"/>
<path d="M160 170 l26 -20 v40 z" fill="#FA961E"/>
<circle cx="88" cy="164" r="4" fill="#0A2A66"/>
<path d="M104 156 q-6 14 0 28" stroke="#0A2A66" stroke-width="2" fill="none"/>
<path d="M120 144 l10 -14 l10 16" fill="#FA961E"/>
<text x="40" y="226" font-size="16" fill="#0A2A66">Рибата: перки за плуване</text>
<text x="40" y="248" font-size="16" fill="#0A2A66">и хриле за дишане във</text>
<text x="40" y="270" font-size="16" fill="#0A2A66">водата, тяло като вретено.</text>
<ellipse cx="250" cy="130" rx="34" ry="9" fill="#3CB44B"/>
<path d="M250 130 v80" stroke="#3CB44B" stroke-width="3"/>
<circle cx="256" cy="120" r="9" fill="#fff" stroke="#E07BB0" stroke-width="3"/>
</g>
<g>
<rect x="328" y="52" width="292" height="248" rx="18" fill="#FCEBD3"/>
<text x="474" y="82" text-anchor="middle" font-size="22" font-weight="bold" fill="#FA961E">На сушата</text>
<path d="M410 200 v-90 a14 14 0 0 1 28 0 v90 z" fill="#3CB44B"/>
<path d="M410 160 h-14 a10 10 0 0 1 -10 -10 v-20 M438 150 h14 a10 10 0 0 0 10 -10 v-16" stroke="#3CB44B" stroke-width="14" fill="none" stroke-linecap="round"/>
<path d="M418 120 l-6 -4 M430 140 l6 -4 M418 170 l-6 -4 M430 186 l6 -4 M386 132 l-6 -2 M462 128 l6 -2" stroke="#0A2A66" stroke-width="2" stroke-linecap="round"/>
<path d="M360 200 h120" stroke="#D9A866" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="548" cy="176" rx="30" ry="20" fill="#fff" stroke="#9AA5B1" stroke-width="2"/>
<ellipse cx="566" cy="124" rx="5" ry="18" fill="#fff" stroke="#9AA5B1" stroke-width="2" transform="rotate(-12 566 124)"/>
<ellipse cx="578" cy="124" rx="5" ry="18" fill="#fff" stroke="#9AA5B1" stroke-width="2" transform="rotate(10 578 124)"/>
<circle cx="519" cy="172" r="7" fill="#fff" stroke="#9AA5B1" stroke-width="2"/>
<circle cx="574" cy="154" r="14" fill="#fff" stroke="#9AA5B1" stroke-width="2"/>
<circle cx="578" cy="152" r="2.5" fill="#0A2A66"/>
<path d="M532 194 v8 M562 194 v8" stroke="#9AA5B1" stroke-width="6" stroke-linecap="round"/>
<text x="348" y="226" font-size="16" fill="#0A2A66">Кактусът: бодли вместо</text>
<text x="348" y="248" font-size="16" fill="#0A2A66">листа, пази вода в стъблото.</text>
<text x="348" y="270" font-size="16" fill="#0A2A66">Белият заек: гъста козина.</text>
</g>
<rect x="20" y="314" width="600" height="70" rx="18" fill="#E7F7EC" stroke="#3CB44B" stroke-width="3"/>
<text x="320" y="342" text-anchor="middle" font-size="18" font-weight="bold" fill="#3CB44B">Да опазим разнообразието:</text>
<text x="320" y="368" text-anchor="middle" font-size="16" fill="#0A2A66">не берем защитени растения, пазим горите и реките чисти.</text>
</svg>
