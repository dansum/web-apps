<g font-size="18" fill="#0A2A66">
<rect x="20" y="212" width="600" height="52" rx="12" fill="#F7F7F7"/>
<text x="36" y="244">Храни се</text>
<rect x="20" y="272" width="600" height="52" rx="12" fill="#F7F7F7"/>
<text x="36" y="304">Расте</text>
<rect x="20" y="332" width="600" height="52" rx="12" fill="#F7F7F7"/>
<text x="36" y="364">Размножава се</text>
</g>
