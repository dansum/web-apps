<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Скелет, мускули и първа помощ</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Скелетът и мускулите ни помагат да се движим</text>
<rect x="20" y="50" width="330" height="334" rx="18" fill="#fff" stroke="#28AAE1" stroke-width="3"/>
<g fill="#F3EEE4" stroke="#0A2A66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="110" cy="92" rx="22" ry="26"/>
<path d="M110 120 v120" fill="none" stroke-width="8"/>
<path d="M110 120 v120" fill="none" stroke="#F3EEE4" stroke-width="4" stroke-dasharray="6 3"/>
<path d="M86 132 q24 -8 48 0 M82 148 q28 -8 56 0 M82 164 q28 -8 56 0 M86 180 q24 -8 48 0" fill="none" stroke-width="5"/>
<path d="M84 240 q26 -16 52 0 q-4 14 -26 16 q-22 -2 -26 -16 z"/>
<path d="M86 128 l-18 50 l-6 54 M134 128 l18 50 l6 54" fill="none" stroke-width="6"/>
<path d="M96 254 l-6 60 l-4 54 M124 254 l6 60 l4 54" fill="none" stroke-width="7"/>
</g>
<circle cx="102" cy="90" r="5" fill="#0A2A66"/><circle cx="118" cy="90" r="5" fill="#0A2A66"/>
<g font-size="16" fill="#0A2A66">
<path d="M134 88 h46 M140 156 h40 M114 200 h66 M132 252 h48 M132 330 h48" stroke="#28AAE1" stroke-width="2"/>
<text x="186" y="93">череп</text>
<text x="186" y="161">гръден кош</text>
<text x="186" y="198">гръбначен</text>
<text x="186" y="218">стълб</text>
<text x="186" y="257">таз</text>
<text x="186" y="335">кости на крака</text>
</g>
<text x="186" y="290" font-size="16" fill="#0A2A66" font-weight="bold">Скелетът е опора</text>
<text x="186" y="310" font-size="16" fill="#0A2A66" font-weight="bold">на тялото.</text>
<rect x="364" y="50" width="256" height="150" rx="18" fill="#fff" stroke="#FA961E" stroke-width="3"/>
<path d="M384 166 h58 l26 -62" stroke="#0A2A66" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M384 166 h58 l26 -62" stroke="#F3EEE4" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M390 160 q26 -40 50 -2 z" fill="#E86A5A" stroke="#0A2A66" stroke-width="2" stroke-linejoin="round"/>
<path d="M392 174 q24 12 48 0" fill="none" stroke="#E86A5A" stroke-width="6" stroke-linecap="round"/>
<text x="482" y="130" font-size="16" fill="#0A2A66">Мускулите</text>
<text x="482" y="150" font-size="16" fill="#0A2A66">се свиват и</text>
<text x="482" y="170" font-size="16" fill="#0A2A66">движат костите.</text>
<text x="380" y="78" font-size="18" font-weight="bold" fill="#FA961E">Мускули</text>
<rect x="364" y="212" width="256" height="172" rx="18" fill="#fff" stroke="#3CB44B" stroke-width="3"/>
<rect x="380" y="226" width="34" height="34" rx="6" fill="#3CB44B"/>
<path d="M397 232 v22 M386 243 h22" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
<text x="424" y="250" font-size="18" font-weight="bold" fill="#3CB44B">Първа помощ</text>
<g font-size="16" fill="#0A2A66">
<text x="380" y="284">• Удар: сложи нещо</text>
<text x="394" y="304">студено.</text>
<text x="380" y="328">• Рана: измий и сложи</text>
<text x="394" y="348">лепенка или превръзка.</text>
<text x="380" y="372" font-weight="bold">• Кажи на възрастен! 112</text>
</g>
</svg>
