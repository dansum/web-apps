<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Съобщества и равновесие в природата</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FA961E"/></marker></defs>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0A2A66">Съобщества и хранителни вериги</text>
<rect x="16" y="50" width="300" height="210" rx="16" fill="#fff" stroke="#3CB44B" stroke-width="2"/>
<text x="166" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#3CB44B">Естествено: гора</text>
<g><rect x="44" y="120" width="10" height="34" fill="#8D6E63"/><path d="M49 88 l-22 36 h44 z" fill="#2E7D32"/>
<rect x="94" y="126" width="10" height="28" fill="#8D6E63"/><circle cx="99" cy="112" r="20" fill="#3CB44B"/>
<rect x="250" y="120" width="10" height="34" fill="#8D6E63"/><path d="M255 88 l-22 36 h44 z" fill="#2E7D32"/></g>
<text x="166" y="128" text-anchor="middle" font-size="16" fill="#0A2A66">създадено</text>
<text x="166" y="146" text-anchor="middle" font-size="16" fill="#0A2A66">от природата</text>
<g font-size="16" fill="#0A2A66" text-anchor="middle">
<path d="M40 210 q6 -26 10 0 q4 -30 10 0 q4 -22 8 0 z" fill="#3CB44B"/><text x="54" y="236">трева</text>
<line x1="76" y1="200" x2="112" y2="200" stroke="#FA961E" stroke-width="3" marker-end="url(#a)"/>
<ellipse cx="144" cy="202" rx="20" ry="12" fill="#A1887F"/><circle cx="160" cy="192" r="8" fill="#A1887F"/><path d="M158 186 l-2 -14 l6 12" fill="#A1887F"/><text x="144" y="236">заек</text>
<line x1="180" y1="200" x2="216" y2="200" stroke="#FA961E" stroke-width="3" marker-end="url(#a)"/>
<ellipse cx="256" cy="202" rx="24" ry="12" fill="#FA961E"/><path d="M276 194 l12 -12 l2 16 z" fill="#FA961E"/><path d="M232 200 q-14 -2 -16 -14" stroke="#FA961E" stroke-width="7" fill="none" stroke-linecap="round"/><text x="256" y="236">лисица</text>
</g>
<rect x="324" y="50" width="300" height="210" rx="16" fill="#fff" stroke="#FA961E" stroke-width="2"/>
<text x="474" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#FA961E">Изкуствено: нива</text>
<g stroke="#C8A165" stroke-width="3"><line x1="340" y1="158" x2="608" y2="158"/></g>
<g fill="#FFC107"><ellipse cx="360" cy="112" rx="5" ry="12"/><ellipse cx="380" cy="112" rx="5" ry="12"/><ellipse cx="568" cy="112" rx="5" ry="12"/><ellipse cx="588" cy="112" rx="5" ry="12"/></g>
<g stroke="#3CB44B" stroke-width="2"><line x1="360" y1="124" x2="360" y2="158"/><line x1="380" y1="124" x2="380" y2="158"/><line x1="568" y1="124" x2="568" y2="158"/><line x1="588" y1="124" x2="588" y2="158"/></g>
<text x="474" y="128" text-anchor="middle" font-size="16" fill="#0A2A66">създадено</text>
<text x="474" y="146" text-anchor="middle" font-size="16" fill="#0A2A66">от човека</text>
<g font-size="16" fill="#0A2A66" text-anchor="middle">
<ellipse cx="364" cy="202" rx="5" ry="14" fill="#FFC107"/><text x="364" y="236">жито</text>
<line x1="384" y1="200" x2="420" y2="200" stroke="#FA961E" stroke-width="3" marker-end="url(#a)"/>
<ellipse cx="452" cy="204" rx="16" ry="9" fill="#9E9E9E"/><circle cx="466" cy="198" r="6" fill="#9E9E9E"/><path d="M436 206 q-12 4 -16 -6" stroke="#9E9E9E" stroke-width="2" fill="none"/><text x="452" y="236">мишка</text>
<line x1="484" y1="200" x2="520" y2="200" stroke="#FA961E" stroke-width="3" marker-end="url(#a)"/>
<ellipse cx="562" cy="200" rx="18" ry="24" fill="#8D6E63"/><circle cx="555" cy="190" r="4" fill="#FFD54F"/><circle cx="569" cy="190" r="4" fill="#FFD54F"/><path d="M558 198 l4 6 l4 -6 z" fill="#FA961E"/><text x="562" y="242">сова</text>
</g>
<rect x="16" y="270" width="300" height="118" rx="16" fill="#FFEBEE" stroke="#E53935" stroke-width="2"/>
<text x="166" y="296" text-anchor="middle" font-size="17" font-weight="bold" fill="#E53935">Нарушават равновесието:</text>
<text x="34" y="324" font-size="16" fill="#0A2A66">• сеч и горски пожари</text>
<text x="34" y="348" font-size="16" fill="#0A2A66">• замърсяване</text>
<text x="34" y="372" font-size="16" fill="#0A2A66">• бракониерски лов</text>
<rect x="324" y="270" width="300" height="118" rx="16" fill="#E6F8F2" stroke="#14BF96" stroke-width="2"/>
<text x="474" y="296" text-anchor="middle" font-size="17" font-weight="bold" fill="#14BF96">Как опазваме природата:</text>
<text x="342" y="324" font-size="16" fill="#0A2A66">• защитени местности и паркове</text>
<text x="342" y="348" font-size="16" fill="#0A2A66">• засаждане на дървета</text>
<text x="342" y="372" font-size="16" fill="#0A2A66">• пазим редките видове</text>
</svg>
