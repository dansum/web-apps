<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img"><title>Състав на въздуха</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker><marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="640" height="400" fill="#F7F7F7"/><text x="320" y="34" font-size="22" text-anchor="middle" font-weight="bold" fill="#0A2A66">Въздухът: състав и свойства</text><path d="M170,220 L170.0,90.0 A130,130 0 1 1 42.3,195.6 z" fill="#28AAE1" stroke="#fff" stroke-width="2"/><path d="M170,220 L42.3,195.6 A130,130 0 0 1 161.8,90.3 z" fill="#14BF96" stroke="#fff" stroke-width="2"/><path d="M170,220 L161.8,90.3 A130,130 0 0 1 170.0,90.0 z" fill="#FA961E" stroke="#fff" stroke-width="2"/><text x="150" y="250" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">азот</text><text x="150" y="276" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">78 %</text><text x="118" y="132" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">кислород</text><text x="118" y="152" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">21 %</text><line x1="172" y1="92" x2="210" y2="70" stroke="#FA961E" stroke-width="2"/><text x="214" y="72" font-size="15" text-anchor="start" font-weight="bold" fill="#FA961E">други газове 1 %</text><rect x="330" y="80" width="295" height="60" rx="8" fill="#fff" stroke="#14BF96" stroke-width="2"/><rect x="330" y="80" width="10" height="60" rx="3" fill="#14BF96" stroke="#14BF96" stroke-width="0"/><text x="352" y="104" font-size="16" text-anchor="start" font-weight="bold" fill="#0A2A66">Кислород</text><text x="352" y="126" font-size="15" text-anchor="start" font-weight="normal" fill="#0A2A66">поддържа горенето и дишането</text><rect x="330" y="152" width="295" height="60" rx="8" fill="#fff" stroke="#28AAE1" stroke-width="2"/><rect x="330" y="152" width="10" height="60" rx="3" fill="#28AAE1" stroke="#28AAE1" stroke-width="0"/><text x="352" y="176" font-size="16" text-anchor="start" font-weight="bold" fill="#0A2A66">Азот</text><text x="352" y="198" font-size="15" text-anchor="start" font-weight="normal" fill="#0A2A66">не поддържа горенето</text><rect x="330" y="224" width="295" height="60" rx="8" fill="#fff" stroke="#FA961E" stroke-width="2"/><rect x="330" y="224" width="10" height="60" rx="3" fill="#FA961E" stroke="#FA961E" stroke-width="0"/><text x="352" y="248" font-size="16" text-anchor="start" font-weight="bold" fill="#0A2A66">Въглероден диоксид</text><text x="352" y="270" font-size="15" text-anchor="start" font-weight="normal" fill="#0A2A66">храна за растенията; задържа топлина</text><rect x="330" y="296" width="295" height="60" rx="8" fill="#fff" stroke="#5A6478" stroke-width="2"/><rect x="330" y="296" width="10" height="60" rx="3" fill="#5A6478" stroke="#5A6478" stroke-width="0"/><text x="352" y="320" font-size="16" text-anchor="start" font-weight="bold" fill="#0A2A66">Водни пари</text><text x="352" y="342" font-size="15" text-anchor="start" font-weight="normal" fill="#0A2A66">образуват облаци и дъжд</text><text x="170" y="380" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">Въздухът е смес от газове.</text></svg>