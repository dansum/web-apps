<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img"><title>Дишане при растения и при човека</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker><marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="640" height="400" fill="#F7F7F7"/><text x="320" y="34" font-size="22" text-anchor="middle" font-weight="bold" fill="#0A2A66">Дишане</text><text x="160" y="70" font-size="17" text-anchor="middle" font-weight="bold" fill="#1E7B34">Растение</text><path d="M160,280 L160,115.0" fill="none" stroke="#3CB44B" stroke-width="5"/><ellipse cx="127.0" cy="235.0" rx="33.0" ry="13.5" fill="#3CB44B" transform="rotate(30 127.0 235.0)"/><ellipse cx="193.0" cy="197.5" rx="33.0" ry="13.5" fill="#3CB44B" transform="rotate(-30 193.0 197.5)"/><ellipse cx="127.0" cy="160.0" rx="33.0" ry="13.5" fill="#3CB44B" transform="rotate(30 127.0 160.0)"/><ellipse cx="193.0" cy="130.0" rx="33.0" ry="13.5" fill="#3CB44B" transform="rotate(-30 193.0 130.0)"/><line x1="100" y1="280" x2="220" y2="280" stroke="#8D6E63" stroke-width="6"/><line x1="40" y1="170" x2="125" y2="200" stroke="#14BF96" stroke-width="3" marker-end="url(#t)"/><text x="30" y="160" font-size="15" text-anchor="start" font-weight="normal" fill="#0E8A6B">кислород</text><line x1="200" y1="190" x2="290" y2="160" stroke="#FA961E" stroke-width="3" marker-end="url(#o)"/><text x="300" y="150" font-size="16" text-anchor="end" font-weight="bold" fill="#B86A00">CO₂</text><text x="160" y="306" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">диша през устицата</text><text x="160" y="324" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">на листата – денем и нощем</text><text x="480" y="70" font-size="17" text-anchor="middle" font-weight="bold" fill="#0A2A66">Човек и животни</text><circle cx="480" cy="120" r="30" fill="#F3C9A5" stroke="#0A2A66" stroke-width="2"/><path d="M470,150 L470,175 L490,175 L490,150" fill="#F3C9A5" stroke="#0A2A66" stroke-width="2"/><path d="M420,300 L420,200 Q420,175 450,175 L510,175 Q540,175 540,200 L540,300 z" fill="#E8F0FA" stroke="#0A2A66" stroke-width="2"/><line x1="480" y1="150" x2="480" y2="205" stroke="#C0392B" stroke-width="5"/><path d="M478,205 C440,200 432,240 440,280 C448,295 470,290 474,270 L476,210 z" fill="#F28B82" stroke="#0A2A66" stroke-width="2"/><path d="M482,205 C520,200 528,240 520,280 C512,295 490,290 486,270 L484,210 z" fill="#F28B82" stroke="#0A2A66" stroke-width="2"/><line x1="590" y1="105" x2="515" y2="118" stroke="#14BF96" stroke-width="3" marker-end="url(#t)"/><text x="632" y="94" font-size="15" text-anchor="end" font-weight="normal" fill="#0E8A6B">кислород</text><line x1="450" y1="128" x2="385" y2="118" stroke="#FA961E" stroke-width="3" marker-end="url(#o)"/><text x="380" y="108" font-size="16" text-anchor="end" font-weight="bold" fill="#B86A00">CO₂</text><text x="560" y="240" font-size="15" text-anchor="start" font-weight="normal" fill="#0A2A66">бели</text><text x="560" y="258" font-size="15" text-anchor="start" font-weight="normal" fill="#0A2A66">дробове</text><line x1="522" y1="248" x2="556" y2="248" stroke="#0A2A66" stroke-width="1.5"/><rect x="40" y="345" width="560" height="46" rx="10" fill="#fff" stroke="#14BF96" stroke-width="2"/><text x="320" y="366" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">В клетките: хранителни вещества + кислород →</text><text x="320" y="385" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A2A66">енергия + въглероден диоксид + вода</text></svg>