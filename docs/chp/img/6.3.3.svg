<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Безполово и полово размножаване</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Размножаване</text>
<rect x="15" y="68" width="295" height="285" rx="12" fill="#F7F7F7" stroke="#28AAE1" stroke-width="2"/>
<rect x="330" y="68" width="295" height="285" rx="12" fill="#FFF4E6" stroke="#FA961E" stroke-width="2"/>
<text x="162" y="96" text-anchor="middle" font-size="19" font-weight="700" fill="#28AAE1">Безполово</text>
<text x="162" y="118" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">1 родител, без полови клетки</text>
<text x="477" y="96" text-anchor="middle" font-size="19" font-weight="700" fill="#FA961E">Полово</text>
<text x="477" y="118" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">2 родителя, полови клетки</text>
<rect x="30" y="215" width="265" height="10" fill="#E9D8BE"/>
<path d="M80,215 l0,-42.0" stroke="#3CB44B" stroke-width="4"/><ellipse cx="63.2" cy="170.2" rx="19.599999999999998" ry="11.2" fill="#3CB44B"/><ellipse cx="96.8" cy="170.2" rx="19.599999999999998" ry="11.2" fill="#3CB44B"/><ellipse cx="80" cy="156.2" rx="11.2" ry="16.799999999999997" fill="#3CB44B"/>
<path d="M85,212 Q160,175 230,212" fill="none" stroke="#3CB44B" stroke-width="3" stroke-dasharray="1 0"/>
<path d="M230,215 l0,-27.0" stroke="#3CB44B" stroke-width="4"/><ellipse cx="219.2" cy="186.2" rx="12.6" ry="7.2" fill="#3CB44B"/><ellipse cx="240.8" cy="186.2" rx="12.6" ry="7.2" fill="#3CB44B"/><ellipse cx="230" cy="177.2" rx="7.2" ry="10.8" fill="#3CB44B"/>
<text x="80" y="248" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">майчино</text>
<text x="230" y="248" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">ново</text>
<text x="162" y="285" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Пример: ягода с вкоренени</text>
<text x="162" y="305" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">издънки (вусове); хидра.</text>
<text x="162" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2A66">Потомството е като родителя.</text>
<circle cx="390" cy="185" r="30" fill="#FFD9E0" stroke="#D9363E" stroke-width="2"/><circle cx="390" cy="185" r="10" fill="#D9363E" opacity="0.6"/>
<text x="390" y="238" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">яйцеклетка</text>
<ellipse cx="470" cy="185" rx="10" ry="7" fill="#28AAE1"/><path d="M460,185 q-10,-8 -20,0 t-20,0" fill="none" stroke="#28AAE1" stroke-width="2.5"/>
<text x="458" y="160" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">сперматозоид</text>
<line x1="495" y1="185" x2="525" y2="185" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<circle cx="565" cy="185" r="30" fill="#FFE6C2" stroke="#FA961E" stroke-width="2"/><circle cx="565" cy="185" r="11" fill="#FA961E"/>
<text x="565" y="238" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">зигота</text>
<text x="477" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2A66">Оплождане – сливане на</text>
<text x="477" y="295" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">мъжка и женска полова клетка.</text>
<text x="477" y="325" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">При растенията – в цвета.</text>
<text x="320" y="385" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2A66">Размножаването осигурява продължаването на живота на Земята.</text>
</svg>
