<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>От какво се нуждаят растенията</title>
<rect width="640" height="400" fill="#EAF6FC"/>
<rect x="0" y="290" width="640" height="110" fill="#A8754A"/>
<rect x="0" y="282" width="640" height="14" rx="6" fill="#3CB44B"/>
<text x="320" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Какво е нужно на растението, за да си</text>
<text x="320" y="64" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">изработи хранителни вещества?</text>
