<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Всяко тяло има вещество, обем и маса</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Всяко тяло има вещество, обем и маса</text>
<g>
<rect x="20" y="64" width="190" height="316" rx="18" fill="#fff" stroke="#14BF96" stroke-width="3"/>
<text x="115" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#14BF96">Вещество</text>
<path d="M75 140 h80 l-10 110 a8 8 0 0 1 -8 7 h-44 a8 8 0 0 1 -8 -7 z" fill="#28AAE1" fill-opacity="0.25" stroke="#0A2A66" stroke-width="3" stroke-linejoin="round"/>
<path d="M80 180 h70 l-6 68 a6 6 0 0 1 -6 5 h-46 a6 6 0 0 1 -6 -5 z" fill="#28AAE1" fill-opacity="0.5"/>
<text x="115" y="290" text-anchor="middle" font-size="16" fill="#0A2A66">Чашата е</text>
<text x="115" y="312" text-anchor="middle" font-size="16" fill="#0A2A66">от стъкло,</text>
<text x="115" y="334" text-anchor="middle" font-size="16" fill="#0A2A66">водата – от вода.</text>
</g>
<g>
<rect x="225" y="64" width="190" height="316" rx="18" fill="#fff" stroke="#28AAE1" stroke-width="3"/>
<text x="320" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#28AAE1">Обем</text>
<rect x="282" y="170" width="76" height="90" rx="6" fill="#28AAE1" fill-opacity="0.45"/>
<path d="M280 120 v136 a8 8 0 0 0 8 8 h64 a8 8 0 0 0 8 -8 v-136" fill="none" stroke="#0A2A66" stroke-width="3"/>
<path d="M282 200 h12 M282 170 h12 M282 230 h12" stroke="#0A2A66" stroke-width="2"/>
<ellipse cx="320" cy="242" rx="22" ry="15" fill="#8A7F72"/>
<path d="M366 200 l18 -30" stroke="#FA961E" stroke-width="3" stroke-linecap="round"/>
<path d="M366 200 l3 -11 M366 200 l10 -5" stroke="#FA961E" stroke-width="3" stroke-linecap="round"/>
<text x="320" y="290" text-anchor="middle" font-size="16" fill="#0A2A66">Камъкът заема</text>
<text x="320" y="312" text-anchor="middle" font-size="16" fill="#0A2A66">място и водата</text>
<text x="320" y="334" text-anchor="middle" font-size="16" fill="#0A2A66">се покачва.</text>
</g>
<g>
<rect x="430" y="64" width="190" height="316" rx="18" fill="#fff" stroke="#FA961E" stroke-width="3"/>
<text x="525" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#FA961E">Маса</text>
<path d="M525 140 v110" stroke="#0A2A66" stroke-width="5" stroke-linecap="round"/>
<path d="M495 250 h60" stroke="#0A2A66" stroke-width="6" stroke-linecap="round"/>
<path d="M465 150 h120" stroke="#0A2A66" stroke-width="5" stroke-linecap="round"/>
<circle cx="525" cy="148" r="7" fill="#FA961E"/>
<path d="M470 150 l-15 45 h30 z M580 150 l-15 45 h30 z" fill="none" stroke="#0A2A66" stroke-width="2"/>
<path d="M448 195 h44 a22 10 0 0 1 -44 0 z M558 195 h44 a22 10 0 0 1 -44 0 z" fill="#0A2A66"/>
<circle cx="470" cy="178" r="16" fill="#3CB44B"/>
<path d="M470 162 q4 -8 10 -8" stroke="#8A5A2B" stroke-width="3" fill="none"/>
<path d="M556 166 h48 l5 28 h-58 z" fill="#0A2A66" fill-opacity="0.85"/>
<text x="580" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">200 г</text>
<text x="525" y="290" text-anchor="middle" font-size="16" fill="#0A2A66">Везната показва</text>
<text x="525" y="312" text-anchor="middle" font-size="16" fill="#0A2A66">колко тежи</text>
<text x="525" y="334" text-anchor="middle" font-size="16" fill="#0A2A66">ябълката.</text>
</g>
</svg>
