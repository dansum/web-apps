<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img"><title>Пречистване на водата</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker><marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker><marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="640" height="400" fill="#F7F7F7"/><text x="320" y="34" font-size="22" text-anchor="middle" font-weight="bold" fill="#0A2A66">Опазване чистотата на водата</text><text x="320" y="68" font-size="15" text-anchor="middle" font-weight="normal" fill="#C0392B">Замърсители: отпадъчни води, торове, нефт, отпадъци</text><rect x="20" y="100" width="100" height="130" rx="6" fill="#fff" stroke="#0A2A66" stroke-width="2"/><rect x="23" y="140" width="94" height="87" fill="#8D7B5A" opacity="0.8"/><circle cx="35" cy="160" r="4" fill="#5D4037" stroke="none" stroke-width="2"/><circle cx="49" cy="180" r="4" fill="#5D4037" stroke="none" stroke-width="2"/><circle cx="63" cy="200" r="4" fill="#5D4037" stroke="none" stroke-width="2"/><circle cx="77" cy="160" r="4" fill="#5D4037" stroke="none" stroke-width="2"/><circle cx="91" cy="180" r="4" fill="#5D4037" stroke="none" stroke-width="2"/><circle cx="105" cy="200" r="4" fill="#5D4037" stroke="none" stroke-width="2"/><rect x="80" y="150" width="18" height="10" rx="2" fill="#E94B3C" stroke="none" stroke-width="0"/><text x="70" y="254" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">замърсена</text><text x="70" y="274" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">вода</text><line x1="122" y1="165" x2="163" y2="165" stroke="#FA961E" stroke-width="3" marker-end="url(#o)"/><rect x="145" y="100" width="100" height="130" rx="6" fill="#fff" stroke="#0A2A66" stroke-width="2"/><rect x="148" y="140" width="94" height="87" fill="#A8987A" opacity="0.8"/><rect x="148" y="205" width="94" height="22" fill="#6D5A3E"/><text x="195" y="254" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">утаяване</text><line x1="247" y1="165" x2="288" y2="165" stroke="#FA961E" stroke-width="3" marker-end="url(#o)"/><rect x="270" y="100" width="100" height="130" rx="6" fill="#fff" stroke="#0A2A66" stroke-width="2"/><rect x="273" y="140" width="94" height="87" fill="#B9D9E6" opacity="0.8"/><rect x="273" y="175" width="94" height="17" fill="#F2E3B3"/><rect x="273" y="192" width="94" height="17" fill="#D9C28E"/><rect x="273" y="209" width="94" height="17" fill="#7D7D7D"/><text x="320" y="167" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">пясък, чакъл</text><text x="320" y="254" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">филтруване</text><line x1="372" y1="165" x2="413" y2="165" stroke="#FA961E" stroke-width="3" marker-end="url(#o)"/><rect x="395" y="100" width="100" height="130" rx="6" fill="#fff" stroke="#0A2A66" stroke-width="2"/><rect x="398" y="140" width="94" height="87" fill="#8FD3EC" opacity="0.8"/><text x="445" y="190" font-size="15" text-anchor="middle" font-weight="normal" fill="#0A2A66">хлор / озон</text><text x="445" y="254" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">обеззаразяване</text><line x1="497" y1="165" x2="538" y2="165" stroke="#FA961E" stroke-width="3" marker-end="url(#o)"/><rect x="520" y="100" width="100" height="130" rx="6" fill="#fff" stroke="#0A2A66" stroke-width="2"/><rect x="523" y="140" width="94" height="87" fill="#28AAE1" opacity="0.8"/><path d="M570,150 q-14,18 -14,26 a14,14 0 0 0 28,0 q0,-8 -14,-26 z" fill="#fff" stroke="none" stroke-width="2"/><text x="570" y="254" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">питейна</text><text x="570" y="274" font-size="16" text-anchor="middle" font-weight="bold" fill="#0A2A66">вода</text><rect x="20" y="300" width="600" height="86" rx="10" fill="#fff" stroke="#14BF96" stroke-width="2"/><text x="40" y="328" font-size="16" text-anchor="start" font-weight="bold" fill="#14BF96">Как пазим водата чиста:</text><text x="40" y="352" font-size="15" text-anchor="start" font-weight="normal" fill="#0A2A66">• пестим водата и не изхвърляме боклук в реките</text><text x="40" y="374" font-size="15" text-anchor="start" font-weight="normal" fill="#0A2A66">• пречистваме отпадъчните води и ползваме по-малко торове</text></svg>