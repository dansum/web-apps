<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Замърсители на въздуха, водата и почвата</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Какво замърсява природата?</text>
<g>
<rect x="16" y="56" width="196" height="226" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="114" y="84" text-anchor="middle" font-size="20" font-weight="bold" fill="#28AAE1">Въздух</text>
<rect x="40" y="150" width="26" height="40" fill="#8D6E63"/><rect x="34" y="190" width="70" height="40" rx="4" fill="#A1887F"/>
<circle cx="60" cy="138" r="12" fill="#9E9E9E"/><circle cx="78" cy="124" r="15" fill="#B0B0B0"/><circle cx="100" cy="114" r="12" fill="#C4C4C4"/>
<rect x="120" y="198" width="70" height="26" rx="10" fill="#E53935"/><circle cx="136" cy="228" r="8" fill="#333"/><circle cx="174" cy="228" r="8" fill="#333"/>
<circle cx="112" cy="210" r="6" fill="#9E9E9E"/>
<text x="114" y="252" text-anchor="middle" font-size="16" fill="#0A2A66">дим от комини</text>
<text x="114" y="270" text-anchor="middle" font-size="16" fill="#0A2A66">и от коли</text>
</g>
<g>
<rect x="222" y="56" width="196" height="226" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="320" y="84" text-anchor="middle" font-size="20" font-weight="bold" fill="#28AAE1">Вода</text>
<path d="M232 170 q22 -10 44 0 t44 0 t44 0 t44 0 v60 h-176 z" fill="#BDE7F7"/>
<rect x="250" y="120" width="22" height="50" rx="6" fill="#81C784" opacity="0.9"/><rect x="254" y="112" width="14" height="10" fill="#3CB44B"/>
<path d="M330 130 h50 v20 h-10 v24" stroke="#78909C" stroke-width="8" fill="none"/>
<ellipse cx="370" cy="190" rx="30" ry="8" fill="#6D4C41" opacity="0.7"/>
<rect x="290" y="188" width="30" height="16" rx="4" fill="#FA961E" transform="rotate(-15 305 196)"/>
<text x="320" y="252" text-anchor="middle" font-size="16" fill="#0A2A66">отпадъци и</text>
<text x="320" y="270" text-anchor="middle" font-size="16" fill="#0A2A66">мръсни отточни води</text>
</g>
<g>
<rect x="428" y="56" width="196" height="226" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="526" y="84" text-anchor="middle" font-size="20" font-weight="bold" fill="#28AAE1">Почва</text>
<rect x="438" y="190" width="176" height="40" rx="6" fill="#8D6E63"/>
<rect x="470" y="150" width="34" height="44" rx="4" fill="#B0BEC5"/><text x="487" y="178" text-anchor="middle" font-size="16" fill="#E53935" font-weight="bold">!</text>
<path d="M540 186 l20 -40 l20 40 z" fill="#FA961E"/><rect x="520" y="176" width="24" height="14" rx="3" fill="#90CAF9"/>
<text x="526" y="252" text-anchor="middle" font-size="16" fill="#0A2A66">боклуци и</text>
<text x="526" y="270" text-anchor="middle" font-size="16" fill="#0A2A66">препарати (химикали)</text>
</g>
<rect x="16" y="292" width="608" height="98" rx="16" fill="#E6F8F2" stroke="#14BF96" stroke-width="2"/>
<text x="320" y="320" text-anchor="middle" font-size="19" font-weight="bold" fill="#0A2A66">Как да опазим природата?</text>
<text x="40" y="349" font-size="16" fill="#0A2A66">• събирам отпадъците разделно</text>
<text x="40" y="375" font-size="16" fill="#0A2A66">• засаждам дървета</text>
<text x="330" y="349" font-size="16" fill="#0A2A66">• пестя вода и електричество</text>
<text x="330" y="375" font-size="16" fill="#0A2A66">• ходя пеша и с велосипед</text>
</svg>
