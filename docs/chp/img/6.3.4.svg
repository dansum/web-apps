<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Растеж и развитие</text>
<text x="20" y="88" text-anchor="start" font-size="17" font-weight="700" fill="#3CB44B">Растение:</text>
<text x="150" y="175" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">семе</text>
