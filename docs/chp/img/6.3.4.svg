<path d="M370,158 L370,105" stroke="#3CB44B" stroke-width="4"/><ellipse cx="355" cy="128" rx="15" ry="7" fill="#3CB44B"/><ellipse cx="385" cy="115" rx="15" ry="7" fill="#3CB44B"/>
<path d="M480,158 L480,128" stroke="#3CB44B" stroke-width="4"/>
