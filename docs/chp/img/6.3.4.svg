<ellipse cx="530" cy="282" rx="26" ry="16" fill="#3CB44B"/><circle cx="518" cy="266" r="6" fill="#3CB44B"/><circle cx="542" cy="266" r="6" fill="#3CB44B"/><circle cx="518" cy="265" r="2.5" fill="#0A2A66"/><circle cx="542" cy="265" r="2.5" fill="#0A2A66"/><path d="M506,294 l-12,8 M554,294 l12,8" stroke="#3CB44B" stroke-width="4"/>
<rect x="20" y="340" width="600" height="50" rx="10" fill="#F7F7F7"/>
<text x="320" y="361" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2A66">Растеж – увеличаване на размерите. Развитие – промени в строежа.</text>
<text x="320" y="381" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Пряко развитие (пиле, човек): малкото прилича на възрастния.</text>
</svg>
