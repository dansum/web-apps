<text x="20" y="222" text-anchor="start" font-size="17" font-weight="700" fill="#28AAE1">Жаба – непряко развитие (с превръщане):</text>
<text x="110" y="320" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">яйца</text>
<line x1="155" y1="280" x2="205" y2="280" stroke="#28AAE1" stroke-width="2.5" marker-end="url(#ac)"/>
<text x="250" y="320" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">попова лъжичка</text>
<line x1="295" y1="280" x2="345" y2="280" stroke="#28AAE1" stroke-width="2.5" marker-end="url(#ac)"/>
<text x="390" y="320" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">жабче</text>
<line x1="435" y1="280" x2="485" y2="280" stroke="#28AAE1" stroke-width="2.5" marker-end="url(#ac)"/>
<text x="530" y="320" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">жаба</text>
