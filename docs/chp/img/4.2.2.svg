<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Звук и шум</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Звукът идва от трептящи тела</text>
<g>
<rect x="20" y="56" width="292" height="200" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<path d="M60 110 h60 v40 a30 30 0 0 1 -60 0 z" fill="#FA961E" transform="translate(0 0)"/>
<ellipse cx="90" cy="110" rx="30" ry="8" fill="#FBC57E"/>
<path d="M78 98 l-14 -30 M102 98 l14 -30" stroke="#C8A165" stroke-width="4" stroke-linecap="round"/>
<path d="M135 95 q10 15 0 30 M150 88 q16 22 0 44" stroke="#28AAE1" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="95" y="210" text-anchor="middle" font-size="16" fill="#0A2A66">барабан –</text>
<text x="95" y="230" text-anchor="middle" font-size="16" fill="#0A2A66">трепти кожата</text>
<rect x="188" y="80" width="80" height="100" rx="40" fill="#C8A165"/><circle cx="228" cy="130" r="14" fill="#5D4037"/>
<path d="M216 84 v90 M224 84 v90 M232 84 v90 M240 84 v90" stroke="#fff" stroke-width="1.5"/>
<text x="228" y="210" text-anchor="middle" font-size="16" fill="#0A2A66">китара –</text>
<text x="228" y="230" text-anchor="middle" font-size="16" fill="#0A2A66">трептят струните</text>
</g>
<g>
<rect x="328" y="56" width="292" height="200" rx="16" fill="#FFF4E6" stroke="#FA961E" stroke-width="2"/>
<text x="474" y="84" text-anchor="middle" font-size="19" font-weight="bold" fill="#FA961E">Силният шум вреди!</text>
<circle cx="400" cy="150" r="34" fill="#FFD7A8"/>
<path d="M386 150 q-8 -14 4 -18" stroke="#0A2A66" stroke-width="3" fill="none"/>
<rect x="364" y="146" width="14" height="22" rx="6" fill="#FFD7A8" stroke="#0A2A66" stroke-width="2"/>
<rect x="414" y="146" width="14" height="22" rx="6" fill="#FFD7A8" stroke="#0A2A66" stroke-width="2"/>
<path d="M388 166 q12 -8 24 0" stroke="#0A2A66" stroke-width="3" fill="none"/>
<circle cx="389" cy="142" r="3" fill="#0A2A66"/><circle cx="411" cy="142" r="3" fill="#0A2A66"/>
<text x="540" y="128" text-anchor="middle" font-size="16" fill="#0A2A66">главоболие</text>
<text x="540" y="152" text-anchor="middle" font-size="16" fill="#0A2A66">умора</text>
<text x="540" y="176" text-anchor="middle" font-size="16" fill="#0A2A66">увреден слух</text>
<text x="474" y="226" text-anchor="middle" font-size="16" fill="#0A2A66">Пазя ушите си: намалявам</text>
<text x="474" y="246" text-anchor="middle" font-size="16" fill="#0A2A66">звука и почивам в тишина.</text>
</g>
<rect x="20" y="270" width="600" height="118" rx="16" fill="#fff" stroke="#14BF96" stroke-width="2"/>
<text x="320" y="296" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Колко силен е звукът?</text>
<rect x="50" y="314" width="540" height="22" rx="11" fill="#3CB44B"/>
<rect x="230" y="314" width="180" height="22" fill="#FA961E"/>
<path d="M410 314 h169 a11 11 0 0 1 0 22 h-169 z" fill="#E53935"/>
<text x="140" y="362" text-anchor="middle" font-size="16" fill="#0A2A66">шепот, листа</text>
<text x="320" y="362" text-anchor="middle" font-size="16" fill="#0A2A66">разговор, улица</text>
<text x="500" y="362" text-anchor="middle" font-size="16" fill="#0A2A66">самолет, бормашина</text>
<text x="140" y="382" text-anchor="middle" font-size="16" fill="#3CB44B">тихо</text>
<text x="500" y="382" text-anchor="middle" font-size="16" fill="#E53935">вредно</text>
</svg>
