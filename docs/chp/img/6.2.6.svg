<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Триъгълник на горенето и горива</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Горене и горива</text>
<polygon points="190,90 60,320 320,320" fill="#FFF4E6" stroke="#0A2A66" stroke-width="3"/>
<path d="M190,175 C220,215 232,245 222,272 C214,292 166,292 158,272 C150,248 168,232 175,212 C180,230 186,232 190,220 C196,205 192,190 190,175 z" fill="#FA961E"/>
<path d="M190,228 C205,248 208,262 202,276 C196,288 184,288 178,276 C173,264 182,250 190,228 z" fill="#FFD23F"/>
<text x="110" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#0A2A66" transform="rotate(-60 110 200)">гориво</text>
<text x="272" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#0A2A66" transform="rotate(60 272 200)">кислород</text>
<text x="190" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#0A2A66">топлина (запалване)</text>
<text x="190" y="378" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Без едно от трите огънят угасва.</text>
<rect x="350" y="70" width="270" height="120" rx="12" fill="#FFF4E6" stroke="#FA961E" stroke-width="2"/>
<text x="365" y="95" text-anchor="start" font-size="17" font-weight="700" fill="#FA961E">Горене</text>
<text x="365" y="118" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">взаимодействие на вещество</text>
<text x="365" y="138" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">с кислорода, при което се</text>
<text x="365" y="158" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">отделят топлина и светлина</text>
<text x="365" y="178" text-anchor="start" font-size="15" font-weight="700" fill="#0A2A66">въглерод + кислород → CO₂</text>
<rect x="350" y="202" width="270" height="180" rx="12" fill="#F7F7F7" stroke="#28AAE1" stroke-width="2"/>
<text x="365" y="227" text-anchor="start" font-size="17" font-weight="700" fill="#28AAE1">Горива</text>
<text x="365" y="252" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• въглища</text>
<text x="365" y="274" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• нефт (бензин, дизел)</text>
<text x="365" y="296" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• природен газ</text>
<text x="365" y="318" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• водород – при горене</text>
<text x="377.0" y="340" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">дава само вода</text>
<text x="365" y="368" text-anchor="start" font-size="15" font-weight="400" fill="#D9363E">Изкопаемите горива замърсяват.</text>
</svg>
