<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Силите, които действат на тяло върху маса</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Сили, които действат на тялото</text>
<rect x="60" y="270" width="520" height="16" fill="#B07A45"/>
<rect x="230" y="190" width="160" height="80" rx="6" fill="#28AAE1" opacity="0.85"/>
<text x="355" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">тяло</text>
<circle cx="310" cy="230" r="5" fill="#0A2A66"/>
<line x1="310" y1="230" x2="310" y2="345" stroke="#D9363E" stroke-width="4" marker-end="url(#ar)"/>
<text x="320" y="340" text-anchor="start" font-size="16" font-weight="700" fill="#D9363E">сила на тежестта</text>
<text x="320" y="360" text-anchor="start" font-size="15" font-weight="400" fill="#D9363E">(към центъра на Земята)</text>
<line x1="290" y1="270" x2="290" y2="120" stroke="#3CB44B" stroke-width="4" marker-end="url(#ag)"/>
<text x="282" y="128" text-anchor="end" font-size="16" font-weight="700" fill="#3CB44B">сила на опората</text>
<line x1="390" y1="215" x2="540" y2="215" stroke="#FA961E" stroke-width="4" marker-end="url(#ao)"/>
<text x="470" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#FA961E">дърпаща сила</text>
<line x1="230" y1="262" x2="110" y2="262" stroke="#0A2A66" stroke-width="4" marker-end="url(#an)"/>
<text x="160" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#0A2A66">сила на триене</text>
<rect x="420" y="70" width="200" height="104" rx="10" fill="#F7F7F7"/>
<text x="430" y="94" text-anchor="start" font-size="16" font-weight="700" fill="#0A2A66">Всяка сила има:</text>
<text x="430" y="118" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• големина (N)</text>
<text x="430" y="140" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• посока</text>
<text x="430" y="162" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• приложна точка</text>
<text x="30" y="80" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">Тежест и опора са равни и</text>
<text x="30" y="100" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">противоположни – уравновесяват се.</text>
<text x="320" y="388" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Ако дърпащата сила е по-голяма от триенето, тялото започва да се движи.</text>
</svg>
