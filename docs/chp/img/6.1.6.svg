<ellipse cx="185" cy="238" rx="128" ry="50" fill="none" stroke="#0A2A66" stroke-width="1.8" transform="rotate(-60 185 238)"/>
<circle cx="176" cy="230" r="10" fill="#FA961E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="176" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">+</text>
<circle cx="194" cy="230" r="10" fill="#9AA3AE" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="185" cy="244" r="10" fill="#FA961E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="185" y="249" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">+</text>
<circle cx="173" cy="248" r="10" fill="#9AA3AE" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="197" cy="248" r="10" fill="#FA961E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="197" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">+</text>
<circle cx="185" cy="220" r="10" fill="#9AA3AE" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="313.0" cy="238.0" r="10" fill="#28AAE1" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="313.0" y="243.0" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">−</text>
<circle cx="121.0" cy="127.1" r="10" fill="#28AAE1" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="121.0" y="132.1" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">−</text>
<circle cx="228.3" cy="263.0" r="10" fill="#28AAE1" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="228.3" y="268.0" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">−</text>
<text x="185" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#0A2A66">Модел на атом</text>
<rect x="385" y="70" width="245" height="130" rx="10" fill="#F7F7F7"/>
<circle cx="405" cy="96" r="10" fill="#FA961E"/>
<text x="405" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">+</text>
<text x="425" y="101" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">протон (положителен)</text>
<circle cx="405" cy="128" r="10" fill="#9AA3AE"/>
<text x="425" y="133" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">неутрон (без заряд)</text>
<circle cx="405" cy="160" r="10" fill="#28AAE1"/>
<text x="405" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">−</text>
<text x="425" y="165" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">електрон (отрицателен)</text>
<text x="397" y="190" text-anchor="start" font-size="15" font-weight="700" fill="#0A2A66">ядро = протони + неутрони</text>
<circle cx="410" cy="250" r="16" fill="#FA961E"/><text x="410" y="256" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">+</text>
<circle cx="470" cy="250" r="16" fill="#FA961E"/><text x="470" y="256" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">+</text>
<line x1="390" y1="250" x2="370" y2="250" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="490" y1="250" x2="510" y2="250" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<text x="522" y="256" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">отблъскване</text>
<circle cx="410" cy="315" r="16" fill="#FA961E"/><text x="410" y="321" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">+</text>
<circle cx="470" cy="315" r="16" fill="#28AAE1"/><text x="470" y="321" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">−</text>
<line x1="428" y1="315" x2="438" y2="315" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="452" y1="315" x2="442" y2="315" stroke="#0A2A66" stroke-width="2.5" marker-end="url(#an)"/>
<text x="522" y="321" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">привличане</text>
<text x="320" y="375" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Едноименните заряди се отблъскват, а разноименните се привличат.</text>
