<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Атом и електрични заряди</text>
<ellipse cx="185" cy="238" rx="128" ry="50" fill="none" stroke="#0A2A66" stroke-width="1.8"/>
