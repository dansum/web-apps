<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Движение на веществата в растение и в животно</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Движение на веществата в организмите</text>
<text x="160" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#3CB44B">В растението</text>
<rect x="0" y="300" width="320" height="100" fill="#E9D8BE"/>
<rect x="150" y="120" width="20" height="185" fill="#3CB44B"/>
<ellipse cx="105" cy="150" rx="45" ry="18" fill="#3CB44B" transform="rotate(-20 105 150)"/>
<ellipse cx="215" cy="195" rx="45" ry="18" fill="#3CB44B" transform="rotate(20 215 195)"/>
<path d="M160,305 L120,350" stroke="#7A5230" stroke-width="4" fill="none"/>
<path d="M160,305 L160,365" stroke="#7A5230" stroke-width="4" fill="none"/>
<path d="M160,305 L200,350" stroke="#7A5230" stroke-width="4" fill="none"/>
<path d="M140,330 L110,330" stroke="#7A5230" stroke-width="4" fill="none"/>
<path d="M180,330 L215,325" stroke="#7A5230" stroke-width="4" fill="none"/>
<line x1="155" y1="345" x2="155" y2="130" stroke="#28AAE1" stroke-width="4" marker-end="url(#ac)"/>
<line x1="165" y1="165" x2="165" y2="340" stroke="#FA961E" stroke-width="4" marker-end="url(#ao)"/>
<text x="140" y="260" text-anchor="end" font-size="15" font-weight="700" fill="#28AAE1">вода и</text>
<text x="140" y="278" text-anchor="end" font-size="15" font-weight="700" fill="#28AAE1">мин. соли</text>
<text x="140" y="296" text-anchor="end" font-size="15" font-weight="400" fill="#28AAE1">(нагоре)</text>
<text x="180" y="260" text-anchor="start" font-size="15" font-weight="700" fill="#FA961E">органични</text>
<text x="180" y="278" text-anchor="start" font-size="15" font-weight="700" fill="#FA961E">вещества</text>
<text x="180" y="296" text-anchor="start" font-size="15" font-weight="400" fill="#FA961E">от листата</text>
<text x="30" y="385" text-anchor="start" font-size="15" font-weight="700" fill="#0A2A66">корен → стъбло → листа</text>
<line x1="320" y1="65" x2="320" y2="395" stroke="#DDD" stroke-width="2"/>
<text x="480" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#D9363E">В животното</text>
<rect x="420" y="105" width="120" height="44" rx="12" fill="#E6F5FC" stroke="#28AAE1" stroke-width="2"/>
<text x="480" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2A66">бели дробове</text>
<path d="M480,225 C455,205 445,185 462,175 C472,170 480,178 480,185 C480,178 488,170 498,175 C515,185 505,205 480,225 z" fill="#D9363E"/>
<text x="530" y="205" text-anchor="start" font-size="15" font-weight="700" fill="#D9363E">сърце</text>
<rect x="420" y="280" width="120" height="44" rx="12" fill="#FFF4E6" stroke="#FA961E" stroke-width="2"/>
<text x="480" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2A66">органи</text>
<line x1="465" y1="175" x2="465" y2="155" stroke="#28AAE1" stroke-width="3" marker-end="url(#ac)"/>
<line x1="495" y1="152" x2="495" y2="172" stroke="#D9363E" stroke-width="3" marker-end="url(#ar)"/>
<line x1="495" y1="222" x2="495" y2="276" stroke="#D9363E" stroke-width="3" marker-end="url(#ar)"/>
<line x1="465" y1="278" x2="465" y2="224" stroke="#28AAE1" stroke-width="3" marker-end="url(#ac)"/>
<text x="400" y="245" text-anchor="end" font-size="15" font-weight="700" fill="#28AAE1">вени</text>
<text x="505" y="255" text-anchor="start" font-size="15" font-weight="700" fill="#D9363E">артерии</text>
<text x="480" y="352" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Кръвта носи кислород и храна</text>
<text x="480" y="372" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">до клетките и отнася</text>
<text x="480" y="392" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">отпадъчните вещества.</text>
</svg>
