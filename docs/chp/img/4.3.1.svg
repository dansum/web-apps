<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Как се хранят и размножават растенията</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0A2A66">Как се хранят и размножават растенията</text>
<rect x="16" y="50" width="330" height="338" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="181" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Листото прави храна</text>
<circle cx="56" cy="114" r="20" fill="#FFD54F"/>
<line x1="80" y1="126" x2="140" y2="166" stroke="#FFC107" stroke-width="4" marker-end="url(#a)"/>
<text x="62" y="156" text-anchor="middle" font-size="16" fill="#0A2A66">светлина</text>
<rect x="176" y="190" width="10" height="130" fill="#3CB44B"/>
<path d="M181 200 q-70 -60 -30 -100 q50 20 30 100 z" fill="#3CB44B"/>
<path d="M181 230 q70 -40 110 -10 q-50 50 -110 10 z" fill="#3CB44B"/>
<rect x="30" y="320" width="302" height="54" rx="8" fill="#8D6E63"/>
<path d="M181 320 v20 M181 330 l-20 20 M181 330 l20 22" stroke="#E8D5B5" stroke-width="3"/>
<line x1="230" y1="350" x2="230" y2="290" stroke="#28AAE1" stroke-width="4" marker-end="url(#a)"/>
<text x="290" y="350" text-anchor="middle" font-size="16" fill="#fff">вода</text>
<line x1="320" y1="120" x2="240" y2="150" stroke="#90A4AE" stroke-width="4" marker-end="url(#a)"/>
<text x="290" y="106" text-anchor="middle" font-size="16" fill="#0A2A66">въглероден</text>
<text x="290" y="124" text-anchor="middle" font-size="16" fill="#0A2A66">диоксид</text>
<line x1="120" y1="200" x2="60" y2="230" stroke="#14BF96" stroke-width="4" marker-end="url(#a)"/>
<text x="64" y="256" text-anchor="middle" font-size="16" fill="#14BF96" font-weight="bold">кислород</text>
<text x="270" y="270" text-anchor="middle" font-size="16" fill="#0A2A66">храна</text>
<text x="270" y="288" text-anchor="middle" font-size="16" fill="#0A2A66">(захар)</text>
<rect x="356" y="50" width="268" height="338" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="490" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Жизнен цикъл</text>
<path d="M490 118 A110 110 0 0 1 590 220" stroke="#FA961E" stroke-width="3" fill="none" marker-end="url(#a)" opacity="0"/>
<g>
<ellipse cx="490" cy="112" rx="12" ry="8" fill="#8D6E63"/>
<text x="490" y="140" text-anchor="middle" font-size="16" fill="#0A2A66">семе</text>
<rect x="573" y="188" width="4" height="30" fill="#3CB44B"/><ellipse cx="567" cy="190" rx="9" ry="5" fill="#3CB44B"/><ellipse cx="583" cy="186" rx="9" ry="5" fill="#3CB44B"/>
<text x="575" y="240" text-anchor="middle" font-size="16" fill="#0A2A66">кълн</text>
<rect x="488" y="292" width="4" height="36" fill="#3CB44B"/>
<g fill="#FA961E"><circle cx="490" cy="282" r="8"/><circle cx="480" cy="290" r="8"/><circle cx="500" cy="290" r="8"/><circle cx="484" cy="300" r="8"/><circle cx="496" cy="300" r="8"/></g><circle cx="490" cy="292" r="6" fill="#FFD54F"/>
<text x="490" y="350" text-anchor="middle" font-size="16" fill="#0A2A66">цвят – опрашване</text>
<path d="M398 200 q8 -18 16 0 q-8 18 -16 0 z" fill="#3CB44B"/><ellipse cx="406" cy="200" rx="10" ry="14" fill="#E53935"/>
<text x="406" y="240" text-anchor="middle" font-size="16" fill="#0A2A66">плод</text>
<text x="406" y="258" text-anchor="middle" font-size="16" fill="#0A2A66">със семена</text>
</g>
<g stroke="#FA961E" stroke-width="3" fill="none">
<path d="M512 114 Q560 130 570 172" marker-end="url(#a)"/>
<path d="M570 258 Q560 290 514 296" marker-end="url(#a)"/>
<path d="M466 300 Q420 296 410 274" marker-end="url(#a)"/>
<path d="M404 180 Q420 120 470 112" marker-end="url(#a)"/>
</g>
<text x="490" y="376" text-anchor="middle" font-size="16" fill="#0A2A66">Пчелите пренасят прашеца.</text>
</svg>
