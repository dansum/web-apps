<text x="470" y="125" text-anchor="middle" font-size="15" font-weight="400" fill="#FA961E">намотка от проводник</text>
<text x="485" y="362" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Когато тече ток, железният пирон</text>
<text x="485" y="382" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">става магнит и привлича кламери.</text>
