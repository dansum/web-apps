<text x="160" y="335" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Едноименните полюси се отблъскват,</text>
<text x="160" y="355" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">разноименните – се привличат.</text>
