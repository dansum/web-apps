<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Кислород и водород – свойства и реакции</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Кислород и водород</text>
<rect x="20" y="68" width="290" height="230" rx="12" fill="#F7F7F7" stroke="#28AAE1" stroke-width="2"/>
<rect x="330" y="68" width="290" height="230" rx="12" fill="#F7F7F7" stroke="#3CB44B" stroke-width="2"/>
<circle cx="55" cy="100" r="16" fill="#E0463C" stroke="#0A2A66" stroke-width="1.5"/><text x="55" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">O</text>
<circle cx="83" cy="100" r="16" fill="#E0463C" stroke="#0A2A66" stroke-width="1.5"/><text x="83" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">O</text>
<text x="110" y="107" text-anchor="start" font-size="20" font-weight="700" fill="#28AAE1">Кислород O₂</text>
<text x="38" y="145" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• безцветен газ без мирис</text>
<text x="38" y="167" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• слабо разтворим във вода</text>
<text x="38" y="189" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• поддържа горенето:</text>
<text x="50.0" y="211" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">тлееща треска се разпалва</text>
<text x="38" y="240" text-anchor="start" font-size="15" font-weight="700" fill="#0A2A66">Получаване: от въздух, вода,</text>
<text x="38" y="260" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">водороден пероксид,</text>
<text x="38" y="280" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">калиев перманганат</text>
<circle cx="365" cy="100" r="14" fill="#FFFFFF" stroke="#0A2A66" stroke-width="1.5"/><text x="365" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#0A2A66">H</text>
<circle cx="389" cy="100" r="14" fill="#FFFFFF" stroke="#0A2A66" stroke-width="1.5"/><text x="389" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#0A2A66">H</text>
<text x="414" y="107" text-anchor="start" font-size="20" font-weight="700" fill="#3CB44B">Водород H₂</text>
<text x="348" y="145" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• безцветен газ без мирис</text>
<text x="348" y="167" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• най-лекият газ</text>
<text x="348" y="189" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• почти не се разтваря</text>
<text x="348" y="211" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">• гори; с кислород – вода</text>
<text x="348" y="240" text-anchor="start" font-size="15" font-weight="700" fill="#0A2A66">Получаване: от вода;</text>
<text x="348" y="260" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">метал + киселина</text>
<text x="348" y="280" text-anchor="start" font-size="15" font-weight="400" fill="#0A2A66">(цинк + солна киселина)</text>
<rect x="20" y="310" width="600" height="80" rx="10" fill="#FFF4E6"/>
<text x="36" y="337" text-anchor="start" font-size="16" font-weight="700" fill="#FA961E">Съединяване:</text>
<text x="160" y="337" text-anchor="start" font-size="16" font-weight="400" fill="#0A2A66">водород + кислород → вода</text>
<text x="410" y="337" text-anchor="start" font-size="15" font-weight="400" fill="#555">(от две – едно)</text>
<text x="36" y="372" text-anchor="start" font-size="16" font-weight="700" fill="#FA961E">Разлагане:</text>
<text x="160" y="372" text-anchor="start" font-size="16" font-weight="400" fill="#0A2A66">вода → водород + кислород</text>
<text x="410" y="372" text-anchor="start" font-size="15" font-weight="400" fill="#555">(от едно – две)</text>
</svg>
