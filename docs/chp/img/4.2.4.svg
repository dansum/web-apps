<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Сили около нас</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FA961E"/></marker></defs>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Силите движат и променят телата</text>
<g>
<rect x="16" y="56" width="196" height="250" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="114" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">мускулна сила</text>
<circle cx="60" cy="140" r="14" fill="#FFD7A8"/><rect x="50" y="156" width="20" height="50" rx="8" fill="#3CB44B"/>
<line x1="68" y1="170" x2="100" y2="176" stroke="#FFD7A8" stroke-width="8" stroke-linecap="round"/>
<line x1="56" y1="204" x2="48" y2="236" stroke="#0A2A66" stroke-width="7" stroke-linecap="round"/><line x1="64" y1="204" x2="74" y2="236" stroke="#0A2A66" stroke-width="7" stroke-linecap="round"/>
<rect x="104" y="160" width="70" height="76" rx="6" fill="#C8A165"/>
<line x1="110" y1="132" x2="180" y2="132" stroke="#FA961E" stroke-width="5" marker-end="url(#a)"/>
<line x1="26" y1="238" x2="202" y2="238" stroke="#90A4AE" stroke-width="3"/>
<text x="114" y="268" text-anchor="middle" font-size="16" fill="#0A2A66">бутаме и дърпаме –</text>
<text x="114" y="288" text-anchor="middle" font-size="16" fill="#0A2A66">тялото тръгва</text>
</g>
<g>
<rect x="222" y="56" width="196" height="250" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="320" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">земно притегляне</text>
<path d="M250 236 a70 30 0 0 1 140 0 z" fill="#3CB44B"/>
<circle cx="340" cy="126" r="16" fill="#E53935"/><path d="M340 110 q4 -10 10 -12" stroke="#5D4037" stroke-width="3" fill="none"/>
<line x1="340" y1="150" x2="340" y2="205" stroke="#FA961E" stroke-width="5" marker-end="url(#a)"/>
<text x="320" y="268" text-anchor="middle" font-size="16" fill="#0A2A66">Земята дърпа</text>
<text x="320" y="288" text-anchor="middle" font-size="16" fill="#0A2A66">всичко надолу</text>
</g>
<g>
<rect x="428" y="56" width="196" height="250" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<text x="526" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">триене</text>
<rect x="444" y="200" width="164" height="16" rx="4" fill="#8D6E63"/>
<path d="M448 208 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6" stroke="#5D4037" stroke-width="2" fill="none"/>
<rect x="490" y="158" width="70" height="42" rx="6" fill="#28AAE1"/>
<line x1="530" y1="140" x2="590" y2="140" stroke="#90A4AE" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="520" y1="226" x2="470" y2="226" stroke="#FA961E" stroke-width="5" marker-end="url(#a)"/>
<text x="526" y="268" text-anchor="middle" font-size="16" fill="#0A2A66">спира движението</text>
<text x="526" y="288" text-anchor="middle" font-size="16" fill="#0A2A66">по грапава повърхност</text>
</g>
<rect x="16" y="318" width="608" height="70" rx="16" fill="#E6F8F2" stroke="#14BF96" stroke-width="2"/>
<ellipse cx="70" cy="353" rx="22" ry="22" fill="#FA961E"/>
<ellipse cx="130" cy="353" rx="32" ry="13" fill="#FA961E"/>
<line x1="94" y1="353" x2="102" y2="353" stroke="#0A2A66" stroke-width="3"/>
<text x="180" y="348" font-size="16" fill="#0A2A66">Силата може и да промени формата:</text>
<text x="180" y="370" font-size="16" fill="#0A2A66">смачканата топка от пластилин става плоска.</text>
</svg>
