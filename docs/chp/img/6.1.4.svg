<text x="235" y="140" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">малка площ</text>
<text x="100" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#3CB44B">малко налягане</text>
