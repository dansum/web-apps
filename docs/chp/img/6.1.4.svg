<text x="355" y="240" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66" transform="rotate(-90 355 240)">дълбочина</text>
<text x="480" y="370" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">По-дълбоко – по-голямо налягане.</text>
<text x="480" y="390" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Нагоре атмосферното налягане намалява.</text>
