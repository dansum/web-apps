<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Видове енергия</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Видове енергия</text>
<g>
<rect x="16" y="56" width="145" height="180" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<circle cx="88" cy="120" r="28" fill="#FFD54F"/>
<g stroke="#FFD54F" stroke-width="4" stroke-linecap="round"><line x1="88" y1="76" x2="88" y2="84"/><line x1="88" y1="156" x2="88" y2="164"/><line x1="44" y1="120" x2="52" y2="120"/><line x1="124" y1="120" x2="132" y2="120"/></g>
<text x="88" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#0A2A66">слънчева</text>
<text x="88" y="214" text-anchor="middle" font-size="16" fill="#0A2A66">от Слънцето</text>
</g>
<g>
<rect x="169" y="56" width="145" height="180" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<path d="M242 150 c-30 0 -34 -30 -16 -50 c0 16 10 18 12 8 c4 -16 -4 -28 6 -40 c4 20 26 30 26 54 c0 18 -12 28 -28 28 z" fill="#FA961E"/>
<path d="M242 150 c-12 0 -16 -14 -6 -24 c2 8 8 6 8 0 c8 6 12 12 10 16 c-2 6 -6 8 -12 8 z" fill="#FFD54F"/>
<rect x="212" y="150" width="60" height="10" rx="4" fill="#8D6E63"/>
<text x="242" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#0A2A66">топлинна</text>
<text x="242" y="214" text-anchor="middle" font-size="16" fill="#0A2A66">огън, печка</text>
</g>
<g>
<rect x="322" y="56" width="145" height="180" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<rect x="356" y="104" width="76" height="34" rx="12" fill="#28AAE1"/>
<circle cx="374" cy="142" r="11" fill="#0A2A66"/><circle cx="414" cy="142" r="11" fill="#0A2A66"/>
<path d="M334 110 h16 M330 122 h20 M336 134 h14" stroke="#90A4AE" stroke-width="3" stroke-linecap="round"/>
<text x="394" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#0A2A66">на движението</text>
<text x="394" y="214" text-anchor="middle" font-size="16" fill="#0A2A66">движеща се кола</text>
</g>
<g>
<rect x="475" y="56" width="149" height="180" rx="16" fill="#fff" stroke="#28AAE1" stroke-width="2"/>
<circle cx="520" cy="122" r="20" fill="#E53935"/><path d="M520 102 q4 -10 10 -10" stroke="#5D4037" stroke-width="3" fill="none"/>
<rect x="552" y="96" width="34" height="50" rx="6" fill="#455A64"/><rect x="562" y="88" width="14" height="10" fill="#455A64"/>
<path d="M569 108 q-10 14 -10 22 a10 10 0 0 0 20 0 q0 -8 -10 -22 z" fill="#FA961E"/>
<text x="549" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#0A2A66">от храни</text>
<text x="549" y="214" text-anchor="middle" font-size="16" fill="#0A2A66">и от горива</text>
</g>
<rect x="16" y="248" width="296" height="140" rx="16" fill="#E6F8F2" stroke="#14BF96" stroke-width="2"/>
<text x="164" y="276" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2A66">Използваме енергия:</text>
<text x="34" y="306" font-size="16" fill="#0A2A66">• у дома – за светлина и готвене</text>
<text x="34" y="332" font-size="16" fill="#0A2A66">• в транспорта – коли, влакове</text>
<text x="34" y="358" font-size="16" fill="#0A2A66">• живите организми – от храната</text>
<rect x="328" y="248" width="296" height="140" rx="16" fill="#FFF4E6" stroke="#FA961E" stroke-width="2"/>
<rect x="350" y="300" width="40" height="60" fill="#8D6E63"/>
<circle cx="370" cy="290" r="12" fill="#9E9E9E"/><circle cx="386" cy="274" r="14" fill="#B0B0B0"/>
<text x="500" y="282" text-anchor="middle" font-size="16" fill="#0A2A66">При изгаряне на</text>
<text x="500" y="304" text-anchor="middle" font-size="16" fill="#0A2A66">въглища, нефт и газ</text>
<text x="500" y="326" text-anchor="middle" font-size="16" fill="#0A2A66">се получава дим,</text>
<text x="500" y="348" text-anchor="middle" font-size="16" fill="#0A2A66">който замърсява</text>
<text x="500" y="370" text-anchor="middle" font-size="16" fill="#0A2A66">въздуха.</text>
</svg>
