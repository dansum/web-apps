<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lato, Arial, sans-serif">
<title>Въздухът и водата: свойства и опазване</title>
<rect width="640" height="400" fill="#F7F7F7"/>
<text x="320" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#0A2A66">Въздухът и водата са нужни за живота</text>
<g>
<rect x="20" y="54" width="292" height="214" rx="18" fill="#EAF6FC" stroke="#28AAE1" stroke-width="3"/>
<text x="166" y="84" text-anchor="middle" font-size="22" font-weight="bold" fill="#28AAE1">Въздух</text>
<path d="M44 112 q16 -12 32 0 t32 0 M44 132 q16 -12 32 0 t32 0" stroke="#28AAE1" stroke-width="3" fill="none" stroke-linecap="round"/>
<rect x="62" y="196" width="24" height="52" rx="4" fill="#fff" stroke="#0A2A66" stroke-width="2"/>
<path d="M74 196 v-6" stroke="#0A2A66" stroke-width="2"/>
<path d="M74 160 q12 16 0 30 q-12 -14 0 -30 z" fill="#FA961E"/>
<text x="124" y="118" font-size="16" fill="#0A2A66">• прозрачен газ</text>
<text x="124" y="142" font-size="16" fill="#0A2A66">• без цвят и мирис</text>
<text x="124" y="166" font-size="16" fill="#0A2A66">• прониква навсякъде</text>
<text x="124" y="190" font-size="16" fill="#0A2A66">• поддържа</text>
<text x="136" y="212" font-size="16" fill="#0A2A66">дишането</text>
<text x="136" y="234" font-size="16" fill="#0A2A66">и горенето</text>
</g>
<g>
<rect x="328" y="54" width="292" height="214" rx="18" fill="#E8F7F2" stroke="#14BF96" stroke-width="3"/>
<text x="474" y="84" text-anchor="middle" font-size="22" font-weight="bold" fill="#14BF96">Вода</text>
<path d="M376 104 q22 30 22 46 a22 22 0 0 1 -44 0 q0 -16 22 -46 z" fill="#28AAE1"/>
<path d="M366 150 a10 10 0 0 0 8 10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M352 200 h48 l-5 46 h-38 z" fill="#28AAE1" fill-opacity="0.35" stroke="#0A2A66" stroke-width="2"/>
<rect x="364" y="226" width="7" height="7" fill="#fff" stroke="#0A2A66" stroke-width="1"/>
<rect x="378" y="232" width="6" height="6" fill="#fff" stroke="#0A2A66" stroke-width="1"/>
<text x="424" y="118" font-size="16" fill="#0A2A66">• прозрачна</text>
<text x="436" y="140" font-size="16" fill="#0A2A66">течност</text>
<text x="424" y="166" font-size="16" fill="#0A2A66">• гаси огъня –</text>
<text x="436" y="188" font-size="16" fill="#0A2A66">не поддържа</text>
<text x="436" y="210" font-size="16" fill="#0A2A66">горенето</text>
<text x="424" y="236" font-size="16" fill="#0A2A66">• разтваря захар</text>
<text x="436" y="258" font-size="16" fill="#0A2A66">и сол</text>
</g>
<rect x="20" y="282" width="600" height="100" rx="18" fill="#fff" stroke="#3CB44B" stroke-width="3"/>
<text x="320" y="308" text-anchor="middle" font-size="20" font-weight="bold" fill="#3CB44B">Да ги пазим чисти!</text>
<g>
<path d="M66 370 v-26" stroke="#8A5A2B" stroke-width="5" stroke-linecap="round"/>
<circle cx="66" cy="336" r="16" fill="#3CB44B"/>
<text x="92" y="350" font-size="16" fill="#0A2A66">Садим</text>
<text x="92" y="370" font-size="16" fill="#0A2A66">дървета</text>
</g>
<g>
<circle cx="230" cy="362" r="10" fill="none" stroke="#0A2A66" stroke-width="3"/>
<circle cx="262" cy="362" r="10" fill="none" stroke="#0A2A66" stroke-width="3"/>
<path d="M230 362 l12 -20 h14 l6 20 M242 342 l6 20" stroke="#FA961E" stroke-width="3" fill="none" stroke-linejoin="round"/>
<text x="282" y="350" font-size="16" fill="#0A2A66">Караме</text>
<text x="282" y="370" font-size="16" fill="#0A2A66">колело</text>
</g>
<g>
<path d="M410 334 h28 l-4 38 h-20 z" fill="#14BF96" stroke="#0A2A66" stroke-width="2" stroke-linejoin="round"/>
<path d="M406 334 h36" stroke="#0A2A66" stroke-width="3" stroke-linecap="round"/>
<text x="454" y="350" font-size="16" fill="#0A2A66">Не хвърляме боклук</text>
<text x="454" y="370" font-size="16" fill="#0A2A66">в реките и морето</text>
</g>
</svg>
