<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Lato, Arial, sans-serif" role="img">
<title>Скорост, път и време при равномерно движение</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A66"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA961E"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#28AAE1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CB44B"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14BF96"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9363E"/></marker>
</defs>
<rect width="640" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="640" height="52" fill="#F7F7F7"/>
<rect x="0" y="52" width="640" height="3" fill="#14BF96"/>
<text x="320" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0A2A66">Скорост = път : време</text>
<rect x="30" y="150" width="580" height="44" fill="#8A8F98"/>
<line x1="30" y1="172" x2="610" y2="172" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="18 14"/>
<g opacity="0.35"><rect x="50" y="148" width="70" height="22" rx="6" fill="#FA961E"/><path d="M64,148 L72,134 L100,134 L110,148 z" fill="#FA961E"/><rect x="75" y="137" width="11" height="10" fill="#DFF4FB"/><rect x="89" y="137" width="13" height="10" fill="#DFF4FB"/><circle cx="66" cy="170" r="7" fill="#0A2A66"/><circle cx="104" cy="170" r="7" fill="#0A2A66"/></g>
<g opacity="1"><rect x="500" y="148" width="70" height="22" rx="6" fill="#FA961E"/><path d="M514,148 L522,134 L550,134 L560,148 z" fill="#FA961E"/><rect x="525" y="137" width="11" height="10" fill="#DFF4FB"/><rect x="539" y="137" width="13" height="10" fill="#DFF4FB"/><circle cx="516" cy="170" r="7" fill="#0A2A66"/><circle cx="554" cy="170" r="7" fill="#0A2A66"/></g>
<text x="85" y="220" text-anchor="middle" font-size="15" font-weight="400" fill="#555">старт</text>
<text x="535" y="220" text-anchor="middle" font-size="15" font-weight="400" fill="#555">финал</text>
<line x1="85" y1="108" x2="535" y2="108" stroke="#0A2A66" stroke-width="2.5" marker-start="url(#an)" marker-end="url(#an)"/>
<text x="310" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#0A2A66">изминат път  s = 120 km</text>
<circle cx="40" cy="80" r="16" fill="#FFFFFF" stroke="#0A2A66" stroke-width="2.5"/><line x1="40" y1="80" x2="40" y2="69" stroke="#0A2A66" stroke-width="2.5"/><line x1="40" y1="80" x2="48" y2="80" stroke="#FA961E" stroke-width="2.5"/>
<text x="40" y="125" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">10:00</text>
<circle cx="600" cy="80" r="16" fill="#FFFFFF" stroke="#0A2A66" stroke-width="2.5"/><line x1="600" y1="80" x2="600" y2="69" stroke="#0A2A66" stroke-width="2.5"/><line x1="600" y1="80" x2="600" y2="90" stroke="#FA961E" stroke-width="2.5"/>
<text x="600" y="125" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">12:00</text>
<rect x="30" y="248" width="180" height="92" rx="12" fill="#F7F7F7" stroke="#28AAE1" stroke-width="2"/>
<text x="120" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#28AAE1">път (s)</text>
<text x="120" y="306" text-anchor="middle" font-size="20" font-weight="700" fill="#0A2A66">120 km</text>
<text x="120" y="330" text-anchor="middle" font-size="15" font-weight="400" fill="#444">колко е изминато</text>
<rect x="230" y="248" width="180" height="92" rx="12" fill="#F7F7F7" stroke="#3CB44B" stroke-width="2"/>
<text x="320" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#3CB44B">време (t)</text>
<text x="320" y="306" text-anchor="middle" font-size="20" font-weight="700" fill="#0A2A66">2 h</text>
<text x="320" y="330" text-anchor="middle" font-size="15" font-weight="400" fill="#444">за колко време</text>
<rect x="430" y="248" width="180" height="92" rx="12" fill="#FFF4E6" stroke="#FA961E" stroke-width="2"/>
<text x="520" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#FA961E">скорост (v)</text>
<text x="520" y="306" text-anchor="middle" font-size="20" font-weight="700" fill="#0A2A66">v = s : t</text>
<text x="520" y="330" text-anchor="middle" font-size="15" font-weight="400" fill="#444">120 : 2 = 60 km/h</text>
<text x="320" y="375" text-anchor="middle" font-size="15" font-weight="400" fill="#0A2A66">Равномерно движение: за равни интервали от време тялото изминава равни пътища.</text>
</svg>
