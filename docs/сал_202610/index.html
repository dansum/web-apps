window.dash = (function () {
  const DATA = { studies: [{"id": "ka_up", "type": "study", "order": 1, "category": "Technology", "group": "Khan Academy", "program": "Khan Academy", "study": "Uttar Pradesh, India", "short": "Uttar Pradesh", "low": 0.44, "high": 0.47, "style": "range", "value_label": "0.44–0.47", "effect_label": "0.44–0.47 SD", "note": "Independent RCT. Measures dedicated staff support; control schools also had Khan Academy.", "quote": "Uttar Pradesh, India: 0.44–0.47 SD with dedicated staff support.\n\nIndia's effect is for implementation support. The control schools also had Khan Academy access. The 0.44–0.47 SD measures the value of dedicated staff who made sure students practiced regularly, not Khan Academy versus nothing.", "program_bg": "Кан Академия", "study_bg": "Утар Прадеш, Индия", "short_bg": "Утар Прадеш", "effect_label_bg": "0,44–0,47 стандартни отклонения", "note_bg": "Независим експеримент с жребий. Измерва ползата от отделен персонал за подкрепа; училищата в групата за сравнение също имат достъп до Кан Академия.", "quote_bg": "Утар Прадеш, Индия: 0,44–0,47 стандартни отклонения при подкрепа от отделен персонал.\n\nЕфектът в Индия е от подкрепата при използването в училище. Училищата в групата за сравнение също имаха достъп до Кан Академия. Стойността 0,44–0,47 стандартни отклонения измерва ползата от отделен персонал, който се грижи учениците да се упражняват редовно, а не Кан Академия срещу нищо.", "category_bg": "Технологии", "group_bg": "Кан Академия", "value_label_bg": "0,44–0,47", "link_url": "https://www.povertyactionlab.org/evaluation/strengthening-implementation-computer-assisted-learning-cal-improve-student-math", "link_title": "J-PAL: Oreopoulos et al., Uttar Pradesh RCT", "link_title_bg": "J-PAL: Oreopoulos и съавт., експеримент в Утар Прадеш", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ka_arlington", "type": "study", "order": 2, "category": "Technology", "group": "Khan Academy", "program": "Khan Academy", "study": "Arlington, TX", "short": "Arlington, TX", "low": 0.12, "high": 0.12, "style": "measured", "value_label": "0.12", "effect_label": "0.12 SD", "note": "Independent RCT.", "quote": "Arlington, TX, at .12 SD and tutoring in Toronto at 0.06 SD.", "program_bg": "Кан Академия", "study_bg": "Арлингтън, Тексас", "short_bg": "Арлингтън", "effect_label_bg": "0,12 стандартни отклонения", "note_bg": "Независим експеримент с жребий.", "quote_bg": "Арлингтън, Тексас, с 0,12 стандартни отклонения и допълнителни занимания в Торонто с 0,06 стандартни отклонения.", "category_bg": "Технологии", "group_bg": "Кан Академия", "value_label_bg": "0,12", "link_url": "https://edworkingpapers.com/ai24-1036", "link_title": "Oreopoulos, Gibbs, Jensen & Price, EdWorkingPaper ai24-1036", "link_title_bg": "Oreopoulos, Gibbs, Jensen & Price, EdWorkingPaper ai24-1036", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ka_toronto", "type": "study", "order": 3, "category": "Technology", "group": "Khan Academy", "program": "Khan Academy", "study": "Tutoring in Toronto", "short": "Toronto tutoring", "low": 0.06, "high": 0.06, "style": "measured", "value_label": "0.06", "effect_label": "0.06 SD", "note": "Independent RCT.", "quote": "Arlington, TX, at .12 SD and tutoring in Toronto at 0.06 SD.", "program_bg": "Кан Академия", "study_bg": "Допълнителни занимания в Торонто", "short_bg": "Торонто", "effect_label_bg": "0,06 стандартни отклонения", "note_bg": "Независим експеримент с жребий (допълнителни занимания).", "quote_bg": "Арлингтън, Тексас, с 0,12 стандартни отклонения и допълнителни занимания в Торонто с 0,06 стандартни отклонения.", "category_bg": "Технологии", "group_bg": "Кан Академия", "value_label_bg": "0,06", "link_url": "https://www.nber.org/papers/w35622", "link_title": "Oreopoulos, Dong & Low (2026), NBER w35622", "link_title_bg": "Oreopoulos, Dong & Low (2026), NBER w35622", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ka_es", "type": "study", "order": 4, "category": "Technology", "group": "Khan Academy", "program": "Khan Academy", "study": "El Salvador", "short": "El Salvador", "low": 0.11, "high": 0.25, "style": "range", "value_label": "0.11–0.25", "effect_label": "0.11–0.25 SD", "note": "Independent RCT against traditional teaching, with the same extra instructional time.", "quote": "El Salvador: 0.11–0.25 SD versus traditional teaching, in schools with underqualified teachers.\n\nEl Salvador tested Khan Academy against the realistic alternative, not against nothing. All three groups got the same additional instructional time. One got Khan Academy lessons led by a teacher, one got the same software with a non-teaching supervisor, and one got traditional teacher-led lessons with no software. Khan Academy outperformed traditional teaching in both versions, in a setting where many teachers themselves had weak math content knowledge. Attendance in the extra lessons was only about 60 percent, which likely held the measured effect below what full attendance would have produced.", "program_bg": "Кан Академия", "study_bg": "Ел Салвадор", "short_bg": "Ел Салвадор", "effect_label_bg": "0,11–0,25 стандартни отклонения", "note_bg": "Независим експеримент с жребий, сравнен с обичайното преподаване при еднакво допълнително учебно време.", "quote_bg": "Ел Салвадор: 0,11–0,25 стандартни отклонения спрямо обичайното преподаване, в училища с недостатъчно квалифицирани учители.\n\nВ Ел Салвадор Кан Академия е сравнена с реалистичната алтернатива, а не с нищо. И трите групи получиха едно и също допълнително учебно време. Едната имаше уроци с Кан Академия, водени от учител, другата – същата платформа с надзорник, който не преподава, а третата – обичайни уроци с учител, без компютри. Кан Академия се представи по-добре от обичайното преподаване и в двата варианта, в среда, където много от самите учители имаха слаби познания по математика. Посещаемостта на допълнителните уроци беше само около 60 процента, което вероятно е задържало измерения ефект под този, който би се получил при пълна посещаемост.", "category_bg": "Технологии", "group_bg": "Кан Академия", "value_label_bg": "0,11–0,25", "link_url": "https://doi.org/10.1086/717727", "link_title": "Büchel et al. (2022), Journal of Labor Economics", "link_title_bg": "Büchel et al. (2022), Journal of Labor Economics", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ka_sv", "type": "study", "order": 5, "category": "Technology", "group": "Khan Academy", "program": "Khan Academy", "study": "Silicon Valley summer program", "short": "Silicon Valley summer", "low": 0.7, "high": 0.7, "style": "measured", "value_label": "0.7", "effect_label": "0.7 SD", "note": "Independent RCT of a 19-day intensive summer program; algebra readiness.", "quote": "Silicon Valley summer program: 0.7 SD on algebra readiness (though most students still weren't ready for algebra after).\n\nThe Silicon Valley summer program showed a large effect on a narrow, short intervention. 0.7 standard deviations is a big number, but it measures 19 days of intensive instruction, not a typical school year. Most participants were still not ready for algebra I afterward.", "program_bg": "Кан Академия", "study_bg": "Лятна програма в Силициевата долина", "short_bg": "Силициева долина", "effect_label_bg": "0,7 стандартни отклонения", "note_bg": "Независим експеримент с жребий; 19-дневна интензивна лятна програма; готовност за алгебра.", "quote_bg": "Лятна програма в Силициевата долина: 0,7 стандартни отклонения в готовността за алгебра (въпреки че след това повечето ученици все още не бяха готови за алгебра).\n\nЛятната програма в Силициевата долина показа голям ефект при кратка програма с тясна цел. 0,7 стандартни отклонения е голямо число, но то измерва 19 дни интензивно обучение, а не обичайна учебна година. Повечето участници след това все още не бяха готови за началния курс по алгебра.", "category_bg": "Технологии", "group_bg": "Кан Академия", "value_label_bg": "0,7", "link_url": "https://ies.ed.gov/use-work/resource-library/report/impact-study/effects-elevate-math-summer-program-math-achievement-and-algebra-readiness", "link_title": "Snipes et al. (2015), REL West / IES", "link_title_bg": "Snipes et al. (2015), REL West / IES", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ka_tn", "type": "study", "order": 6, "category": "Technology", "group": "Khan Academy", "program": "Khan Academy", "study": "Hamilton County, TN (two years)", "short": "Hamilton Co., TN", "low": 0.06, "high": 0.08, "style": "range", "value_label": "0.06–0.08", "effect_label": "0.06–0.08 SD", "note": "Independent RCT, everyone assigned counted; compared with the district's existing interventions.", "quote": "Hamilton County, TN: about 0.06–0.08 SD over two years, 0.14 SD in a subgroup.\n\nTennessee's 0.06–0.08 is the headline, and it measures Khanmigo usage within the Khan Academy platform, not Khan Academy's core practice tools alone. The study, by Philip Oreopoulos (University of Toronto) and Nina Low (Charles River Associates), counts every student assigned to the program, whether or not they used it. The comparison was against the interventions the district was already running, which in most schools included other edtech products. More than a quarter of the study sample had a special education designation, and all students were below grade level in a daily math intervention block. That's a group ed tech often struggles to move, which makes the result more notable, not less.", "program_bg": "Кан Академия", "study_bg": "Окръг Хамилтън, Тенеси (две години)", "short_bg": "Окр. Хамилтън", "effect_label_bg": "0,06–0,08 стандартни отклонения", "note_bg": "Независим експеримент с жребий, който отчита всички разпределени ученици; сравнение с допълнителните програми, които районът вече прилага.", "quote_bg": "Окръг Хамилтън, Тенеси: около 0,06–0,08 стандартни отклонения за две години, 0,14 стандартни отклонения за част от учениците.\n\nСтойността 0,06–0,08 за Тенеси е основният резултат и тя измерва използването на Канмиго (асистентът с изкуствен интелект на Кан Академия) в платформата, а не само основните упражнения. Изследването на Филип Ореопулос (Университет на Торонто) и Нина Лоу (Charles River Associates) отчита всеки ученик, разпределен в програмата, независимо дали я е използвал. Сравнението е с допълнителните програми, които училищният район вече прилагаше, а в повечето училища те включваха други образователни технологии. Над една четвърт от учениците в изследването бяха със специални образователни потребности и всички бяха под нивото за класа си, в ежедневен час за допълнителна работа по математика. На такива ученици технологиите често трудно помагат, и затова резултатът е по-показателен, а не по-малко показателен.", "category_bg": "Технологии", "group_bg": "Кан Академия", "value_label_bg": "0,06–0,08", "link_url": "https://www.nber.org/papers/w35620", "link_title": "NBER Working Paper w35620", "link_title_bg": "NBER Working Paper w35620", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ka_tn_sub", "type": "study", "order": 7, "category": "Technology", "group": "Khan Academy", "program": "Khan Academy", "study": "Hamilton County, TN (subgroup)", "short": "Hamilton Co. subgroup", "low": 0.14, "high": 0.14, "style": "subgroup", "value_label": "0.14", "effect_label": "0.14 SD", "note": "Subgroup: students who stayed in the program for the full second year.", "quote": "Hamilton County, TN: about 0.06–0.08 SD over two years, 0.14 SD in a subgroup.\n\nTennessee's 0.14 is a subgroup result. It covers students who stayed in the program for the full second year. About two in five students left the program early because they had progressed enough to graduate out, and they were still counted in the main analysis even after leaving. I've argued elsewhere that the true effect for engaged students may be understated by this subgroup calculation, since the students who left were the ones gaining the most, and we don't know what they would have gained had they stayed. That's my own interpretation, not something the data proves, and I want to be upfront about that distinction.", "program_bg": "Кан Академия", "study_bg": "Окръг Хамилтън, Тенеси (част от учениците)", "short_bg": "Хамилтън, част от учениците", "effect_label_bg": "0,14 стандартни отклонения", "note_bg": "Част от учениците (подгрупа): тези, които останаха в програмата през цялата втора година.", "quote_bg": "Окръг Хамилтън, Тенеси: около 0,06–0,08 стандартни отклонения за две години, 0,14 стандартни отклонения за част от учениците.\n\nСтойността 0,14 за Тенеси е резултат само за част от учениците (подгрупа). Тя обхваща учениците, останали в програмата през цялата втора година. Около двама от всеки петима ученици напуснаха програмата по-рано, защото бяха напреднали достатъчно, за да излязат от нея, и въпреки това бяха отчетени в основния анализ и след напускането. На друго място съм изтъквал, че истинският ефект за ангажираните ученици може да е подценен от това изчисление, защото напусналите бяха тези с най-голям напредък, а не знаем какво биха постигнали, ако бяха останали. Това е моя интерпретация, а не нещо, което данните доказват, и искам да съм открит за тази разлика.", "category_bg": "Технологии", "group_bg": "Кан Академия", "value_label_bg": "0,14", "link_url": "https://www.nber.org/papers/w35620", "link_title": "NBER Working Paper w35620", "link_title_bg": "NBER Working Paper w35620", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ka_br", "type": "study", "order": 8, "category": "Technology", "group": "Khan Academy", "program": "Khan Academy", "study": "Brazil (overall)", "short": "Brazil overall", "low": 0, "high": 0, "style": "null", "value_label": "n.s.", "effect_label": "No significant overall effect", "note": "Independent RCT, 2017 school year; students shared devices.", "quote": "Brazil (Ferman, Finamor, and Lima, 2017 school year): no significant overall effect; students shared devices without individual practice sessions, and a later look at participant districts found 0.08 SD for students with consistent, individual practice.\n\nBrazil is a null tied to a specific implementation, not a verdict on the tool. This early randomized evaluation, conducted during the 2017 school year by Ferman, Finamor, and Lima, found no significant overall effect on math performance. The likely driver: students shared devices without dedicated individual practice sessions. Schools with better implementation saw gains; schools with worse implementation saw losses.", "program_bg": "Кан Академия", "study_bg": "Бразилия (общо)", "short_bg": "Бразилия, общо", "effect_label_bg": "Няма доказан общ ефект", "note_bg": "Независим експеримент с жребий, учебната 2017 г.; учениците споделяха устройства.", "quote_bg": "Бразилия (Ferman, Finamor и Lima, учебната 2017 г.): няма доказан общ ефект; учениците споделяха устройства без отделно време за индивидуални упражнения, а по-късен преглед на участващите райони установи 0,08 стандартни отклонения за учениците с редовна индивидуална практика.\n\nБразилия е нулев резултат, свързан с конкретен начин на използване, а не присъда за платформата. Тази ранна оценка с жребий, проведена през учебната 2017 г. от Ferman, Finamor и Lima, не установи доказан общ ефект върху резултатите по математика. Вероятната причина: учениците споделяха устройства без отделно време за индивидуални упражнения. Училищата, които я използваха по-добре, отчетоха напредък, а тези с по-слабо използване – спад.", "category_bg": "Технологии", "group_bg": "Кан Академия", "value_label_bg": "—", "link_url": "https://www.povertyactionlab.org/evaluation/impact-online-math-learning-platform-test-scores-and-attitudes-towards-math-brazil", "link_title": "J-PAL: Ferman, Finamor & Lima, Brazil evaluation", "link_title_bg": "J-PAL: Ferman, Finamor & Lima, Brazil evaluation", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ka_br_ind", "type": "study", "order": 9, "category": "Technology", "group": "Khan Academy", "program": "Khan Academy", "study": "Brazil (consistent individual practice)", "short": "Brazil, individual practice", "low": 0.08, "high": 0.08, "style": "subgroup", "value_label": "0.08", "effect_label": "0.08 SD", "note": "Later look at participant districts: students with consistent, individual practice.", "quote": "Brazil (Ferman, Finamor, and Lima, 2017 school year): no significant overall effect; students shared devices without individual practice sessions, and a later look at participant districts found 0.08 SD for students with consistent, individual practice.\n\nA later look at participant districts found a measurable effect (0.08 SD) for students with consistent, individual practice. The lesson isn't \"Khan Academy didn't work in Brazil\" — it's that shared-device, low-individual-practice implementations are the ones to watch for.", "program_bg": "Кан Академия", "study_bg": "Бразилия (редовна индивидуална практика)", "short_bg": "Бразилия, инд. практика", "effect_label_bg": "0,08 стандартни отклонения", "note_bg": "По-късен преглед на участващите райони: ученици с редовна индивидуална практика.", "quote_bg": "Бразилия (Ferman, Finamor и Lima, учебната 2017 г.): няма доказан общ ефект; учениците споделяха устройства без отделно време за индивидуални упражнения, а по-късен преглед на участващите райони установи 0,08 стандартни отклонения за учениците с редовна индивидуална практика.\n\nПо-късен преглед на участващите райони установи измерим ефект (0,08 стандартни отклонения) за учениците с редовна индивидуална практика. Изводът не е „Кан Академия не проработи в Бразилия“, а че внимание изискват именно случаите със споделени устройства и малко индивидуална практика.", "category_bg": "Технологии", "group_bg": "Кан Академия", "value_label_bg": "0,08", "link_url": "https://www.povertyactionlab.org/evaluation/impact-online-math-learning-platform-test-scores-and-attitudes-towards-math-brazil", "link_title": "J-PAL: Ferman, Finamor & Lima, Brazil evaluation", "link_title_bg": "J-PAL: Ferman, Finamor & Lima, Brazil evaluation", "link_note": "Links to the original Brazil evaluation.", "link_note_bg": "Връзката води към първоначалната оценка в Бразилия.", "range_label": "", "range_label_bg": ""}, {"id": "as_me", "type": "study", "order": 10, "category": "Technology", "group": "ASSISTments", "program": "ASSISTments", "study": "Maine (SRI International)", "short": "Maine", "low": 0.18, "high": 0.18, "style": "measured", "value_label": "0.18", "effect_label": "0.18 SD", "note": "Independent RCT, p = 0.007.", "quote": "An SRI International trial in Maine found a 0.18 standard deviation gain (p = 0.007), roughly a 60% improvement over the math growth a seventh grader would otherwise be expected to make in a year, with the largest gains among students who started behind.", "program_bg": "ASSISTments", "study_bg": "Мейн (SRI International)", "short_bg": "Мейн", "effect_label_bg": "0,18 стандартни отклонения", "note_bg": "Независим експеримент с жребий (SRI International), p = 0,007.", "quote_bg": "Експеримент на SRI International в Мейн установи напредък от 0,18 стандартни отклонения (p = 0,007) – около 60% повече от напредъка по математика, който един седмокласник иначе би постигнал за година, като най-голям е напредъкът при учениците, които са започнали изоставащи.", "category_bg": "Технологии", "group_bg": "ASSISTments", "value_label_bg": "0,18", "link_url": "https://doi.org/10.1177/2332858416673968", "link_title": "Roschelle et al. (2016), AERA Open", "link_title_bg": "Roschelle et al. (2016), AERA Open", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "as_nc", "type": "study", "order": 11, "category": "Technology", "group": "ASSISTments", "program": "ASSISTments", "study": "North Carolina (WestEd)", "short": "North Carolina", "low": 0.1, "high": 0.1, "style": "measured", "value_label": "0.10", "effect_label": "0.10 SD", "note": "Independent replication in 63 schools, p = 0.01; measured a year after the program ended.", "quote": "A WestEd replication in 63 North Carolina schools found a smaller but still significant 0.10 SD effect (p = 0.01), measured a full year after the program ended — one of the few ed tech trials to show a persisting effect after the intervention stopped.", "program_bg": "ASSISTments", "study_bg": "Северна Каролина (WestEd)", "short_bg": "Северна Каролина", "effect_label_bg": "0,10 стандартни отклонения", "note_bg": "Независимо повторение на експеримента в 63 училища, p = 0,01; измерено година след края на програмата.", "quote_bg": "Повторение на експеримента от WestEd в 63 училища в Северна Каролина установи по-малък, но все пак статистически значим ефект от 0,10 стандартни отклонения (p = 0,01), измерен цяла година след края на програмата – един от малкото експерименти с образователни технологии, показали траен ефект след спиране на програмата.", "category_bg": "Технологии", "group_bg": "ASSISTments", "value_label_bg": "0,10", "link_url": "https://www.wested.org/support/efficacy-of-assistments-online-homework-support-for-middle-school-mathematics-learning/", "link_title": "WestEd: ASSISTments replication study", "link_title_bg": "WestEd: ASSISTments replication study", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ms_math", "type": "study", "order": 12, "category": "Technology", "group": "Mindspark", "program": "Mindspark (India)", "study": "Math, under five months", "short": "Math", "low": 0.37, "high": 0.37, "style": "measured", "value_label": "0.37", "effect_label": "0.37 SD", "note": "Independent RCT (lottery), after-school program.", "quote": "Published in the American Economic Review. A lottery-assigned after-school program gained 0.37 SD in math and 0.23 SD in Hindi in under five months, extrapolated to roughly 0.6 SD and 0.39 SD at full attendance.", "program_bg": "Mindspark (Индия)", "study_bg": "Математика, под пет месеца", "short_bg": "Математика", "effect_label_bg": "0,37 стандартни отклонения", "note_bg": "Независим експеримент с жребий, извънкласна програма.", "quote_bg": "Публикувано в American Economic Review. Извънкласна програма, в която учениците са избрани чрез жребий, постигна 0,37 стандартни отклонения по математика и 0,23 стандартни отклонения по хинди за по-малко от пет месеца. При пълна посещаемост това се изчислява на около 0,6 и 0,39 стандартни отклонения.", "category_bg": "Технологии", "group_bg": "Mindspark", "value_label_bg": "0,37", "link_url": "https://doi.org/10.1257/aer.20171112", "link_title": "Muralidharan, Singh & Ganimian (2019), American Economic Review", "link_title_bg": "Muralidharan, Singh & Ganimian (2019), American Economic Review", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ms_hindi", "type": "study", "order": 13, "category": "Technology", "group": "Mindspark", "program": "Mindspark (India)", "study": "Hindi, under five months", "short": "Hindi", "low": 0.23, "high": 0.23, "style": "measured", "value_label": "0.23", "effect_label": "0.23 SD", "note": "Independent RCT (lottery), after-school program.", "quote": "Published in the American Economic Review. A lottery-assigned after-school program gained 0.37 SD in math and 0.23 SD in Hindi in under five months, extrapolated to roughly 0.6 SD and 0.39 SD at full attendance.", "program_bg": "Mindspark (Индия)", "study_bg": "Хинди, под пет месеца", "short_bg": "Хинди", "effect_label_bg": "0,23 стандартни отклонения", "note_bg": "Независим експеримент с жребий, извънкласна програма.", "quote_bg": "Публикувано в American Economic Review. Извънкласна програма, в която учениците са избрани чрез жребий, постигна 0,37 стандартни отклонения по математика и 0,23 стандартни отклонения по хинди за по-малко от пет месеца. При пълна посещаемост това се изчислява на около 0,6 и 0,39 стандартни отклонения.", "category_bg": "Технологии", "group_bg": "Mindspark", "value_label_bg": "0,23", "link_url": "https://doi.org/10.1257/aer.20171112", "link_title": "Muralidharan, Singh & Ganimian (2019), American Economic Review", "link_title_bg": "Muralidharan, Singh & Ganimian (2019), American Economic Review", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ms_math_x", "type": "study", "order": 14, "category": "Technology", "group": "Mindspark", "program": "Mindspark (India)", "study": "Math, extrapolated to full attendance", "short": "Math, full attendance", "low": 0.6, "high": 0.6, "style": "extrapolated", "value_label": "0.6", "effect_label": "≈0.6 SD", "note": "Extrapolated to full attendance, not measured directly.", "quote": "Published in the American Economic Review. A lottery-assigned after-school program gained 0.37 SD in math and 0.23 SD in Hindi in under five months, extrapolated to roughly 0.6 SD and 0.39 SD at full attendance.", "program_bg": "Mindspark (Индия)", "study_bg": "Математика, екстраполирано за пълна посещаемост", "short_bg": "Математика, пълна посещ.", "effect_label_bg": "≈0,6 стандартни отклонения", "note_bg": "Изчислено за пълна посещаемост, не е измерено.", "quote_bg": "Публикувано в American Economic Review. Извънкласна програма, в която учениците са избрани чрез жребий, постигна 0,37 стандартни отклонения по математика и 0,23 стандартни отклонения по хинди за по-малко от пет месеца. При пълна посещаемост това се изчислява на около 0,6 и 0,39 стандартни отклонения.", "category_bg": "Технологии", "group_bg": "Mindspark", "value_label_bg": "0,6", "link_url": "https://doi.org/10.1257/aer.20171112", "link_title": "Muralidharan, Singh & Ganimian (2019), American Economic Review", "link_title_bg": "Muralidharan, Singh & Ganimian (2019), American Economic Review", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "ms_hindi_x", "type": "study", "order": 15, "category": "Technology", "group": "Mindspark", "program": "Mindspark (India)", "study": "Hindi, extrapolated to full attendance", "short": "Hindi, full attendance", "low": 0.39, "high": 0.39, "style": "extrapolated", "value_label": "0.39", "effect_label": "≈0.39 SD", "note": "Extrapolated to full attendance, not measured directly.", "quote": "Published in the American Economic Review. A lottery-assigned after-school program gained 0.37 SD in math and 0.23 SD in Hindi in under five months, extrapolated to roughly 0.6 SD and 0.39 SD at full attendance.", "program_bg": "Mindspark (Индия)", "study_bg": "Хинди, екстраполирано за пълна посещаемост", "short_bg": "Хинди, пълна посещ.", "effect_label_bg": "≈0,39 стандартни отклонения", "note_bg": "Изчислено за пълна посещаемост, не е измерено.", "quote_bg": "Публикувано в American Economic Review. Извънкласна програма, в която учениците са избрани чрез жребий, постигна 0,37 стандартни отклонения по математика и 0,23 стандартни отклонения по хинди за по-малко от пет месеца. При пълна посещаемост това се изчислява на около 0,6 и 0,39 стандартни отклонения.", "category_bg": "Технологии", "group_bg": "Mindspark", "value_label_bg": "0,39", "link_url": "https://doi.org/10.1257/aer.20171112", "link_title": "Muralidharan, Singh & Ganimian (2019), American Economic Review", "link_title_bg": "Muralidharan, Singh & Ganimian (2019), American Economic Review", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "cl_hs", "type": "study", "order": 16, "category": "Technology", "group": "Carnegie", "program": "Carnegie Learning", "study": "High school (147 schools, 7 states)", "short": "High school", "low": 0.04, "high": 0.04, "style": "measured", "value_label": "+0.04", "effect_label": "+0.04 SD", "note": "Department of Education-funded RCT; effect size as listed on Evidence for ESSA.", "quote": "A Department of Education-funded RCT across 147 schools in 7 states. High school effect size of +0.04 on Evidence for ESSA.", "program_bg": "Carnegie Learning", "study_bg": "Гимназиален етап (147 училища, 7 щата)", "short_bg": "Гимназия", "effect_label_bg": "+0,04 стандартни отклонения", "note_bg": "Експеримент с жребий, финансиран от Министерството на образованието на САЩ; размер на ефекта според „Доказателства за ESSA“.", "quote_bg": "Експеримент с жребий, финансиран от Министерството на образованието на САЩ, в 147 училища в 7 щата. Размер на ефекта за гимназиален етап +0,04 според „Доказателства за ESSA“.", "category_bg": "Технологии", "group_bg": "Carnegie", "value_label_bg": "+0,04", "link_url": "https://eric.ed.gov/?id=EJ1024233", "link_title": "Pane et al. (2014), Educational Evaluation and Policy Analysis", "link_title_bg": "Pane et al. (2014), Educational Evaluation and Policy Analysis", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "edtech_strong", "type": "study", "order": 17, "category": "Technology", "group": "Summary", "program": "Edtech overall", "study": "Supplemental edtech under strong implementation", "short": "Strong implementation", "low": 0.1, "high": 0.2, "style": "summary", "value_label": "0.1–0.2", "effect_label": "0.1–0.2 SD", "note": "Sal's summary across the studies above, not a single trial.", "quote": "But consider the scale of the incremental investment. Some of the strongest edtech results listed above come from supplemental interventions involving roughly 30–60 minutes per student per week, with software costs typically measured in tens of dollars per student per year rather than thousands. Yet under strong implementation, we are seeing randomized effects in the 0.1–0.2 SD range and, in some studies, substantially higher.", "program_bg": "Технологии като цяло", "study_bg": "Допълнителни образователни технологии при добро използване", "short_bg": "Добро използване", "effect_label_bg": "0,1–0,2 стандартни отклонения", "note_bg": "Обобщение на Сал за изследванията по-горе, а не един експеримент.", "quote_bg": "Но помислете за мащаба на допълнителната инвестиция. Някои от най-силните резултати на образователните технологии по-горе идват от допълнителни програми с около 30–60 минути на ученик седмично, а разходите за софтуер обикновено са десетки долари на ученик годишно, а не хиляди. И въпреки това при добро използване експериментите с жребий показват ефекти от 0,1 до 0,2 стандартни отклонения, а в някои изследвания и значително по-високи.", "category_bg": "Технологии", "group_bg": "Общо", "value_label_bg": "0,1–0,2", "link_url": "https://www.linkedin.com/pulse/edtech-can-work-decision-makers-have-check-evidence-first-sal-khan-ospte", "link_title": "Sal Khan's article", "link_title_bg": "Sal Khan's article", "link_note": "A summary across studies, so the link goes to the article itself.", "link_note_bg": "Обобщение на няколко изследвания, затова връзката води към самата статия.", "range_label": "", "range_label_bg": ""}, {"id": "kraft_median", "type": "study", "order": 18, "category": "Other intervention", "group": "Other interventions", "program": "All education RCTs", "study": "Median effect across 747 randomized trials (Kraft)", "short": "Median RCT (Kraft)", "low": 0.1, "high": 0.1, "style": "measured", "value_label": "0.10", "effect_label": "≈0.10 SD", "note": "Median of nearly 2,000 effects from 747 randomized trials.", "quote": "Numbers like 0.08 or 0.20 standard deviations can sound small without context. In education, they’re not. Researcher Matthew Kraft analyzed nearly 2,000 effects from 747 randomized trials and found a median effect of about 0.10 SD. He suggests that, for real-world education interventions, effects below 0.05 can be considered small, 0.05–0.20 medium, and 0.20+ large.", "program_bg": "Всички образователни експерименти", "study_bg": "Обичаен ефект в 747 експеримента с жребий (медиана, по Крафт)", "short_bg": "Обичаен ефект (Крафт)", "effect_label_bg": "≈0,10 стандартни отклонения", "note_bg": "Медианата на близо 2000 ефекта от 747 експеримента с жребий.", "quote_bg": "Числа като 0,08 или 0,20 стандартни отклонения може да звучат малки без контекст. В образованието не са. Изследователят Матю Крафт анализира близо 2000 ефекта от 747 експеримента с жребий и установи, че обичайният (медианният) ефект е около 0,10 стандартни отклонения. Той предлага за реални образователни програми ефектите под 0,05 да се смятат за малки, от 0,05 до 0,20 – за средни, а 0,20 и повече – за големи.", "category_bg": "Друг подход", "group_bg": "Други подходи", "value_label_bg": "0,10", "link_url": "https://doi.org/10.3102/0013189X20912798", "link_title": "Kraft (2020), Educational Researcher", "link_title_bg": "Kraft (2020), Educational Researcher", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "tutoring", "type": "study", "order": 19, "category": "Other intervention", "group": "Other interventions", "program": "High-dosage tutoring", "study": "High-dosage tutoring", "short": "High-dosage tutoring", "low": 0.2, "high": 0.4, "style": "range", "value_label": "0.2–0.4", "effect_label": "0.2–0.4 SD", "note": "Typical range, sometimes higher; several hours a week, thousands of dollars per student a year.", "quote": "High-dosage tutoring, one of the most powerful interventions available, often produces effects in the 0.2–0.4 SD range, sometimes higher.\n\nHigh-dosage tutoring can require several hours of additional human instruction every week and can cost thousands of dollars per student per year.", "program_bg": "Интензивни допълнителни занимания", "study_bg": "Интензивни допълнителни занимания (индивидуални или в малка група)", "short_bg": "Допълнителни занимания", "effect_label_bg": "0,2–0,4 стандартни отклонения", "note_bg": "Типичен диапазон, понякога по-висок; няколко часа седмично и хиляди долари на ученик годишно.", "quote_bg": "Интензивните допълнителни занимания (индивидуални или в малка група), един от най-силните налични подходи, често дават ефекти от 0,2 до 0,4 стандартни отклонения, понякога и по-високи.\n\nТакива занимания може да изискват няколко часа допълнително обучение с учител всяка седмица и да струват хиляди долари на ученик годишно.", "category_bg": "Друг подход", "group_bg": "Други подходи", "value_label_bg": "0,2–0,4", "link_url": "https://www.nber.org/papers/w27476", "link_title": "Nickow, Oreopoulos & Quan (2020), NBER w27476", "link_title_bg": "Nickow, Oreopoulos & Quan (2020), NBER w27476", "link_note": "Sal doesn't cite a specific study here; this is a widely cited representative source.", "link_note_bg": "Сал не цитира конкретно изследване тук; това е често цитиран представителен източник.", "range_label": "", "range_label_bg": ""}, {"id": "class_size", "type": "study", "order": 20, "category": "Other intervention", "group": "Other interventions", "program": "Class-size reduction", "study": "Tennessee class-size experiment", "short": "Smaller classes (TN)", "low": 0.15, "high": 0.35, "style": "range", "value_label": "0.15–0.35", "effect_label": "0.15–0.35 SD", "note": "Landmark randomized experiment in Tennessee.", "quote": "Tennessee’s landmark randomized class-size reduction experiment, which gave students substantially more teacher attention throughout the school day, produced meaningful gains generally in the 0.15–0.35 SD range.\n\nMeaningfully reducing class sizes requires hiring substantially more teachers and changes the experience of essentially the entire school day.", "program_bg": "По-малки класове", "study_bg": "Експериментът с размера на класовете в Тенеси", "short_bg": "По-малки класове (Тенеси)", "effect_label_bg": "0,15–0,35 стандартни отклонения", "note_bg": "Знаков експеримент с жребий в Тенеси.", "quote_bg": "Знаковият експеримент с жребий в Тенеси за намаляване на броя ученици в клас, който даде на учениците значително повече внимание от учителя през целия учебен ден, доведе до осезаем напредък, обикновено от 0,15 до 0,35 стандартни отклонения.\n\nСъщественото намаляване на размера на класовете изисква наемане на значително повече учители и променя практически целия учебен ден.", "category_bg": "Друг подход", "group_bg": "Други подходи", "value_label_bg": "0,15–0,35", "link_url": "https://www.nber.org/papers/w6051", "link_title": "Krueger (1999), Project STAR", "link_title_bg": "Krueger (1999), Project STAR", "link_note": "Sal doesn't cite a specific study here; this is a widely cited representative source.", "link_note_bg": "Сал не цитира конкретно изследване тук; това е често цитиран представителен източник.", "range_label": "", "range_label_bg": ""}, {"id": "curricula", "type": "study", "order": 21, "category": "Other intervention", "group": "Other interventions", "program": "Math curricula", "study": "Randomized comparisons of math curricula", "short": "Math curricula", "low": 0.1, "high": 0.17, "style": "range", "value_label": "0.1–0.17", "effect_label": "0.1–0.17 SD", "note": "Differences between curricula in large randomized comparisons.", "quote": "And large randomized comparisons of different math curricula have found differences on the order of 0.1–0.17 SD.\n\nReplacing a core curriculum affects hundreds of hours of instruction and can require substantial spending, professional development, materials, and organizational change.", "program_bg": "Учебни програми по математика", "study_bg": "Рандомизирани сравнения на учебни програми по математика", "short_bg": "Учебни програми", "effect_label_bg": "0,1–0,17 стандартни отклонения", "note_bg": "Разлики между учебни програми в големи сравнения с жребий.", "quote_bg": "А големи сравнения с жребий на различни учебни програми по математика са установили разлики от порядъка на 0,1–0,17 стандартни отклонения.\n\nСмяната на основната учебна програма засяга стотици часове обучение и може да изисква значителни разходи, обучение на учителите, материали и организационни промени.", "category_bg": "Друг подход", "group_bg": "Други подходи", "value_label_bg": pendent RCT (Johns Hopkins CRRE, Michigan)", "short": "IXL", "low": null, "high": null, "style": "nosd", "value_label": "", "effect_label": "10-point gain on Star Math", "note": "Reported in test points, not SD.", "quote": "IXL — 1 independent RCT A Johns Hopkins CRRE trial in Michigan. 10-point gain on Star Math.", "program_bg": "IXL", "study_bg": "1 независим експеримент с жребий (Johns Hopkins CRRE, Мичиган)", "short_bg": "IXL", "effect_label_bg": "10 точки напредък на теста Star Math", "note_bg": "Отчетено в точки от теста, а не в стандартни отклонения.", "quote_bg": "IXL — 1 независим експеримент с жребий. Експеримент на Johns Hopkins CRRE в Мичиган. 10 точки напредък на теста Star Math.", "category_bg": "Технологии", "group_bg": "", "value_label_bg": "", "link_url": "https://evidenceforessa.org/program/ixl-math/", "link_title": "Evidence for ESSA: IXL Math", "link_title_bg": "Доказателства за ESSA: IXL Math", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "iready", "type": "nosd", "order": 227, "category": "Technology", "group": "", "program": "i-Ready", "study": "No independent RCT identified", "short": "i-Ready", "low": null, "high": null, "style": "nosd", "value_label": "", "effect_label": "No SD figure given", "note": "Quasi-experimental or vendor-affiliated evaluations.", "quote": "i-Ready — none identified Most evaluations are quasi-experimental or affiliated with Curriculum Associates.", "program_bg": "i-Ready", "study_bg": "Не е открит независим експеримент с жребий", "short_bg": "i-Ready", "effect_label_bg": "Няма стойност в стандартни отклонения", "note_bg": "Изследвания без жребий или проведени или платени от компанията, която продава продукта.", "quote_bg": "i-Ready — не са открити. Повечето оценки са изследвания без жребий (по-слаби доказателства) или са проведени или платени от компанията, която продава продукта (Curriculum Associates).", "category_bg": "Технологии", "group_bg": "", "value_label_bg": "", "link_url": null, "link_title": null, "link_title_bg": null, "link_note": "Sal found no independent RCT, so there is no study to link.", "link_note_bg": "Сал не е открил независим експеримент с жребий, затова няма изследване, към което да има връзка.", "range_label": "", "range_label_bg": ""}, {"id": "def_mean", "type": "definition", "order": 300, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Mean (average)", "program_bg": "Средна стойност", "study": "Mean (average)", "study_bg": "Средна стойност", "short": "Mean (average)", "short_bg": "Средна стойност", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "The sum of all values divided by how many there are.", "note_bg": "Сборът на всички стойности, разделен на броя им.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/10-klas/x3076d29e95acc119:statistika-i-obrabotka-na-danni/x3076d29e95acc119:tsentralni-tendentsii/v/mean-median-and-mode", "link_title": "Средна стойност, медиана и мода (пример)", "link_title_bg": "Средна стойност, медиана и мода (пример)", "link_note": "Grade 10", "link_note_bg": "10. клас", "range_label": "", "range_label_bg": ""}, {"id": "def_median", "type": "definition", "order": 301, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Median", "program_bg": "Медиана", "study": "Median", "study_bg": "Медиана", "short": "Median", "short_bg": "Медиана", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "The middle value when results are put in order of size. Half are below it, half above.", "note_bg": "Стойността по средата, когато резултатите са подредени по големина. Половината са под нея, половината – над нея.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/10-klas/x3076d29e95acc119:statistika-i-obrabotka-na-danni/x3076d29e95acc119:tsentralni-tendentsii/v/statistics-intro-mean-median-and-mode", "link_title": "Въведение в статистиката: Средна стойност, медиана и мода", "link_title_bg": "Въведение в статистиката: Средна стойност, медиана и мода", "link_note": "Grade 10", "link_note_bg": "10. клас", "range_label": "", "range_label_bg": ""}, {"id": "def_sd", "type": "definition", "order": 302, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Standard deviation (SD)", "program_bg": "Стандартно отклонение", "study": "Standard deviation (SD)", "study_bg": "Стандартно отклонение", "short": "Standard deviation (SD)", "short_bg": "Стандартно отклонение", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "How far, on average, results sit from the mean. A large standard deviation means results are spread out; a small one means they are close together.", "note_bg": "Колко средно се отдалечават резултатите от средната стойност. Голямо стандартно отклонение значи, че резултатите са разпръснати; малко – че са близо един до друг.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/12-klas-profil-modul-4/x2e854140bd6d705b:sluchaina-velichina/x2e854140bd6d705b:dispersiya-i-standartno-otklonenie/a/calculating-standard-deviation-step-by-step", "link_title": "Изчисляване на стандартното отклонение стъпка по стъпка", "link_title_bg": "Изчисляване на стандартното отклонение стъпка по стъпка", "link_note": "Grade 12, module 4", "link_note_bg": "12. клас, модул 4", "range_label": "", "range_label_bg": ""}, {"id": "def_effect", "type": "definition", "order": 303, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Effect size", "program_bg": "Размер на ефекта", "study": "Effect size", "study_bg": "Размер на ефекта", "short": "Effect size", "short_bg": "Размер на ефекта", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "The difference between the programme group and the comparison group, expressed in standard deviations. It lets studies that used different tests be compared.", "note_bg": "Разликата между групата в програмата и групата за сравнение, изразена в стандартни отклонения. Така могат да се сравняват изследвания с различни тестове.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/probability/xa88397b6:analyze-quantitative/xa88397b6:percentiles-z-scores/v/calculating-percentile", "link_title": "Изчисляване на персентили (процентили)", "link_title_bg": "Изчисляване на персентили (процентили)", "link_note": "no lesson on effect size itself; this is the closest", "link_note_bg": "няма отделен урок за размер на ефекта; това е най-близкият", "range_label": "", "range_label_bg": ""}, {"id": "def_percentile", "type": "definition", "order": 304, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Percentile", "program_bg": "Процентил", "study": "Percentile", "study_bg": "Процентил", "short": "Percentile", "short_bg": "Процентил", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "The share of students with a lower result. The 54th percentile means a better result than 54% of students.", "note_bg": "Каква част от учениците имат по-нисък резултат. 54-ият процентил значи по-добър резултат от 54% от учениците.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/probability/xa88397b6:analyze-quantitative/xa88397b6:percentiles-z-scores/v/calculating-percentile", "link_title": "Изчисляване на персентили (процентили)", "link_title_bg": "Изчисляване на персентили (процентили)", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "def_normal", "type": "definition", "order": 305, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Normal distribution", "program_bg": "Нормално разпределение", "study": "Normal distribution", "study_bg": "Нормално разпределение", "short": "Normal distribution", "short_bg": "Нормално разпределение", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "The usual bell shape of test results: most are near the middle, few at the edges. It is what lets an effect size be turned into percentiles.", "note_bg": "Обичайната форма на резултатите от тест, като камбана: повечето са около средата, малко са в краищата. Благодарение на нея размерът на ефекта може да се превърне в процентили.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/12-klas-profil-modul-4/x2e854140bd6d705b:normalno-razpredelenie", "link_title": "Нормално разпределение (раздел)", "link_title_bg": "Нормално разпределение (раздел)", "link_note": "Grade 12, module 4", "link_note_bg": "12. клас, модул 4", "range_label": "", "range_label_bg": ""}, {"id": "def_rct", "type": "definition", "order": 306, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Randomized experiment", "program_bg": "Експеримент с жребий", "study": "Randomized experiment", "study_bg": "Експеримент с жребий", "short": "Randomized experiment", "short_bg": "Експеримент с жребий", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "Students or schools are put into groups by lottery. The groups are then alike, so a difference between them comes from the programme.", "note_bg": "Учениците или училищата се разпределят в групите чрез жребий. Така групите са сравними и разликата между тях идва от програмата.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/science/biology/intro-to-biology/science-of-biology/a/experiments-and-observations", "link_title": "Контролирани експерименти", "link_title_bg": "Контролирани експерименти", "link_note": "biology article", "link_note_bg": "статия по биология", "range_label": "", "range_label_bg": ""}, {"id": "def_control", "type": "definition", "order": 307, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Comparison group", "program_bg": "Група за сравнение", "study": "Comparison group", "study_bg": "Група за сравнение", "short": "Comparison group", "short_bg": "Група за сравнение", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "The students who do not get the programme, or carry on as before. Their results show what would have happened without it.", "note_bg": "Учениците, които не участват в програмата или продължават по стария начин. Техните резултати показват какво би станало без нея.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/science/biology/intro-to-biology/science-of-biology/a/experiments-and-observations", "link_title": "Контролирани експерименти", "link_title_bg": "Контролирани експерименти", "link_note": "biology article", "link_note_bg": "статия по биология", "range_label": "", "range_label_bg": ""}, {"id": "def_causation", "type": "definition", "order": 308, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Correlation and causation", "program_bg": "Корелация и причинно-следствена връзка", "study": "Correlation and causation", "study_bg": "Корелация и причинно-следствена връзка", "short": "Correlation and causation", "short_bg": "Корелация и причинно-следствена връзка", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "Two things moving together does not mean one causes the other. Students who use a tool a lot may simply be more motivated.", "note_bg": "Това, че две неща вървят заедно, не значи, че едното причинява другото. Учениците, които ползват дадена платформа много, може просто да са по-мотивирани.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/12-klas-profil-modul-4/x2e854140bd6d705b:veroyatnost/x2e854140bd6d705b:formula-na-beis/v/critical-thinking-fundamentals-correlation-and-causation", "link_title": "Корелация и причинно-следствена връзка", "link_title_bg": "Корелация и причинно-следствена връзка", "link_note": "Grade 12, module 4", "link_note_bg": "12. клас, модул 4", "range_label": "", "range_label_bg": ""}, {"id": "def_significance", "type": "definition", "order": 309, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Statistically significant", "program_bg": "Статистически значим резултат", "study": "Statistically significant", "study_bg": "Статистически значим резултат", "short": "Statistically significant", "short_bg": "Статистически значим резултат", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "The difference is too large to be easily explained by chance. When it is not significant, the study has not shown an effect.", "note_bg": "Разликата е твърде голяма, за да се обясни лесно със случайност. Когато резултатът не е статистически значим, изследването не е доказало ефект.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/probability/xa88397b6:study-design/xa88397b6:inference-experiments/v/statistical-significance-experiment", "link_title": "Статистическа значимост на експеримент", "link_title_bg": "Статистическа значимост на експеримент", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "def_pvalue", "type": "definition", "order": 310, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "p-value (p)", "program_bg": "p-стойност (p)", "study": "p-value (p)", "study_bg": "p-стойност (p)", "short": "p-value (p)", "short_bg": "p-стойност (p)", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "How likely a difference at least this large would be by chance alone if the programme actually had no effect. The smaller p is, the harder the difference is to explain by chance. The usual cut-off is 0.05: below it, a result counts as statistically significant. For example, p = 0.007 means a difference this large would arise by chance alone in fewer than 1 in 100 such experiments.", "note_bg": "Показва колко вероятно е да се получи разлика поне толкова голяма само по случайност, ако програмата всъщност няма ефект. Колкото по-малко е p, толкова по-трудно е разликата да се обясни със случайност. Обичайната граница е 0,05: под нея резултатът се смята за статистически значим. Например p = 0,007 значи, че разлика като тази би се получила само по случайност в по-малко от 1 на 100 такива експеримента.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/statistics-probability/significance-tests-one-sample/idea-of-significance-tests/v/p-values-and-significance-tests", "link_title": "P-стойности и тестове за значимост", "link_title_bg": "P-стойности и тестове за значимост", "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "def_independent", "type": "definition", "order": 311, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Independent study", "program_bg": "Независимо изследване", "study": "Independent study", "study_bg": "Независимо изследване", "short": "Independent study", "short_bg": "Независимо изследване", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "Run, analysed and published by outside researchers, not by the company that sells the product, and published whether the result is good or bad.", "note_bg": "Проведено, анализирано и публикувано от външни изследователи, а не от компанията, която продава продукта, и публикувано независимо дали резултатът е добър или лош.", "quote": "", "quote_bg": "", "link_url": null, "link_title": null, "link_title_bg": null, "link_note": "", "link_note_bg": "", "range_label": "", "range_label_bg": ""}, {"id": "def_nonrandom", "type": "definition", "order": 312, "category": "Definition", "category_bg": "Дефиниция", "group": "", "group_bg": "", "program": "Study without random assignment", "program_bg": "Изследване без жребий", "study": "Study without random assignment", "study_bg": "Изследване без жребий", "short": "Study without random assignment", "short_bg": "Изследване без жребий", "low": null, "high": null, "style": "definition", "value_label": "", "value_label_bg": "", "effect_label": "", "effect_label_bg": "", "note": "The groups were not formed by lottery, so a difference may come from other causes, such as which students or teachers chose to take part. This is weaker evidence.", "note_bg": "Групите не са разпределени чрез жребий, затова разликата може да идва от други причини, например кои ученици или учители са избрали да участват. Това е по-слабо доказателство.", "quote": "", "quote_bg": "", "link_url": "https://bg.khanacademy.org/math/12-klas-profil-modul-4/x2e854140bd6d705b:veroyatnost/x2e854140bd6d705b:formula-na-beis/v/critical-thinking-fundamentals-correlation-and-causation", "link_title": "Корелация и причинно-следствена връзка", "link_title_bg": "Корелация и причинно-следствена връзка", "link_note": "Grade 12, module 4", "link_note_bg": "12. клас, модул 4", "range_label": "", "range_label_bg": ""}] };
  const calcs = {};
  const listeners = [];
  const get = (id) => {
    if (DATA[id]) return { status: 'ok', data: DATA[id], refreshing: false, meta: [] };
    if (calcs[id]) {
      const c = calcs[id];
      if (!c.value) c.value = c.fn.apply(null, c.inputs.map((i) => get(i).data));
      return { status: 'ok', data: c.value, refreshing: false, meta: [] };
    }
    return { status: 'missing', data: [], refreshing: false, meta: [] };
  };
  let timer = null;
  window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(() => listeners.forEach((fn) => fn()), 150); });
  return {
    colors: ['var(--series-1)', 'var(--series-2)'],
    data: get,
    calc: (id, spec) => { calcs[id] = { inputs: spec.inputs, fn: spec.fn, value: null }; },
    onData: (fn) => { listeners.push(fn); if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn); else fn(); },
    setLink: () => {}, params: () => ({}), setParams: () => {}, resetParams: () => {}, refresh: () => {}, loader: () => {}
  };
})();

#dash-root .ek-head { display: grid; gap: var(--cds-gap-xs); flex: 1 1 24rem; min-width: 0; }
#dash-root .ek-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; }
#dash-root .ek-takeaway { margin: 0; font-size: var(--cds-font-size-body); max-width: 70ch; }
#dash-root .ek-source { margin: 0; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
#dash-root .ek-source a, #dash-root .ek-more, #dash-root .ek-foot a.ek-site { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
#dash-root .ek-lang { display: inline-flex; border: 1px solid var(--color-border-line); border-radius: 999px; padding: 2px; background: var(--color-panel); flex: 0 0 auto; }
#dash-root .ek-lang button { font: inherit; font-size: var(--cds-font-size-caption); display: inline-flex; align-items: center; gap: var(--cds-gap-xs); border: 0; border-radius: 999px; background: transparent; color: var(--color-fg-muted); padding: var(--cds-pad-xs) var(--cds-pad-sm); cursor: pointer; }
#dash-root .ek-lang button[aria-pressed="true"] { background: var(--color-bg); color: var(--color-fg); box-shadow: 0 0 0 1px var(--color-border-line); }
#dash-root .ek-flag { width: 1.35rem; height: auto; aspect-ratio: 5 / 3; border-radius: 2px; box-shadow: 0 0 0 1px var(--color-border-line); display: block; }
#dash-root .ek-card { position: relative; background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); display: grid; gap: var(--cds-gap-sm); min-width: 0; }
#dash-root .ek-card h2 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
#dash-root .ek-note { margin: 0; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
#dash-root .ek-legend { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs) var(--cds-gap-md); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
#dash-root .ek-legend span { display: inline-flex; align-items: center; gap: var(--cds-gap-xs); }
#dash-root .ek-sw { width: 0.75rem; height: 0.75rem; border-radius: 3px; display: inline-block; box-sizing: border-box; }
#dash-root .ek-scroll { overflow-x: auto; min-width: 0; }
#dash-root .ek-chart { min-height: 30rem; }
#dash-root .ek-chart svg { display: block; overflow: visible; }
#dash-root .ek-col { cursor: pointer; outline: none; }
#dash-root .ek-col:focus-visible .ek-hit { stroke: var(--color-fg); stroke-width: 1.5; }
#dash-root .ek-col .ek-hit { fill: transparent; }
#dash-root .ek-col:hover .ek-hit { fill: var(--color-fg); fill-opacity: 0.04; }
#dash-root .ek-col.is-sel .ek-hit { fill: var(--color-fg); fill-opacity: 0.07; }
#dash-root .ek-col.is-sel .ek-xl { fill: var(--color-fg); font-weight: 600; }
#dash-root .ek-xl, #dash-root .ek-tick, #dash-root .ek-band-l, #dash-root .ek-grp { font-size: var(--cds-font-size-caption); fill: var(--color-fg-muted); font-family: var(--font-anthropic-sans); }
#dash-root .ek-vl { font-size: var(--cds-font-size-caption); fill: var(--color-fg); font-variant-numeric: tabular-nums; font-family: var(--font-anthropic-sans); }
#dash-root .ek-grp { fill: var(--color-fg); font-weight: 500; }
#dash-root .ek-band-n { font-size: var(--cds-font-size-caption); fill: var(--color-fg); font-weight: 600; font-family: var(--font-anthropic-sans); }
#dash-root .ek-band-n tspan.ek-band-l { font-weight: 400; }
#dash-root .ek-tip { position: absolute; z-index: 2; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); pointer-events: none; max-width: 16rem; }
#dash-root .ek-tip .t1 { color: var(--cds-text-secondary); }
#dash-root .ek-tip .t2 { font-variant-numeric: tabular-nums; font-weight: 500; }
#dash-root .ek-tag { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); display: flex; align-items: center; gap: var(--cds-gap-xs); }
#dash-root .ek-dtitle { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
#dash-root .ek-effect { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; }
#dash-root .ek-qlabel { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-top: var(--cds-gap-xs); }
#dash-root .ek-quote { margin: 0; padding-left: var(--cds-pad-md); border-left: 3px solid var(--color-border-line); white-space: pre-line; font-size: var(--cds-font-size-body); line-height: 1.55; max-width: 75ch; }
#dash-root .ek-chips { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); }
#dash-root .ek-chip { font: inherit; font-size: var(--cds-font-size-caption); padding: var(--cds-pad-xs) var(--cds-pad-sm); border-radius: 999px; border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); cursor: pointer; }
#dash-root .ek-chip[aria-pressed="true"] { border-color: var(--color-fg); }
#dash-root .ek-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--cds-gap-md); padding-top: var(--cds-pad-md); border-top: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
#dash-root .ek-logo-link { display: inline-block; line-height: 0; }
