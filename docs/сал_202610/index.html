      exH4: 'Как да четем числата внимателно',
      exC1: "Ефектите от различни изследвания не са пряко сравними: учениците, тестовете, продължителността, групите за сравнение и начинът на използване се различават.",
      exC2: 'Продължителността има значение: напредък след няколко месеца не е същото като същия напредък след няколко години.',
      exC3: "Гледайте ефекта спрямо вложените време, хора и пари, а не само неговия размер.",
      exC4: "Само [[rct|експериментите с жребий]], в идеалния случай [[independent|независими]], показват [[causation|причинно-следствена връзка]]; това, че учениците с по-активно използване имат по-високи резултати, не я доказва.",
      exH5: 'Как да четем графиката',
      exP5: "Плътните колони са измерени ефекти. По-бледата горна част показва горния край на диапазон. Пунктирните контури отбелязват стойности, изчислени за пълна посещаемост (не са измерени), или обобщението на Сал. „—“ означава, че [[significance|няма доказан ефект]]."
    }
  };
  let lang = 'bg';
  const t = (k) => I18N[lang][k];
  const sfx = () => (lang === 'bg' ? '_bg' : '');
  const f = (r, key) => r[key + sfx()];
  const fmtTick = (v) => { const s = d3.format('.1f')(v); return lang === 'bg' ? s.replace('.', ',') : s; };

  dash.calc('median_percentile', {
    inputs: ['studies'],
    title: 'Median effect as a percentile',
    description: 'Where the median RCT effect would place an average student, using the normal distribution.',
    fn: (studies) => {
      const z = Number(studies.find((r) => r.id === 'kraft_median').high);
      const t = 1 / (1 + 0.2316419 * Math.abs(z));
      const tail = 0.3989423 * Math.exp(-z * z / 2) * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      return [{ percentile: Math.round(100 * (z >= 0 ? 1 - tail : tail)) }];
    }
  });
  const ordinal = (n) => {
    if (lang === 'bg') return '-ия';
    const v = n % 100;
    if (v >= 11 && v <= 13) return 'th';
    return ({ 1: 'st', 2: 'nd', 3: 'rd' })[n % 10] || 'th';
  };

  const tip = document.getElementById('ek-tip');
  const card = document.getElementById('effect-chart-card');
  const colorOf = (r) => r.category === 'Technology' ? dash.colors[0] : dash.colors[1];
  let selected = null;
  let allRows = [];
  let animated = false;

  function renderRich(el, str) {
    el.textContent = '';
    const re = /\[\[([a-z]+)\|([^\]]+)\]\]/g;
    let last = 0, m;
    while ((m = re.exec(str))) {
      if (m.index > last) el.append(document.createTextNode(str.slice(last, m.index)));
      const key = m[1];
      const a = document.createElement('a');
      a.className = 'ek-term'; a.href = '#def-' + key; a.textContent = m[2];
      a.addEventListener('click', (e) => {
        const target = document.getElementById('def-' + key);
        if (!target) return;
        e.preventDefault();
        const box = target.closest('details');
        if (box && !box.open) box.open = true;
        target.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
        target.classList.add('is-flash');
        setTimeout(() => target.classList.remove('is-flash'), 1600);
      });
      el.append(a);
      last = re.lastIndex;
    }
    if (last < str.length) el.append(document.createTextNode(str.slice(last)));
  }

  function applyText() {
    document.getElementById('ek').setAttribute('lang', lang);
    document.querySelectorAll('#ek [data-i18n]').forEach((el) => { renderRich(el, t(el.dataset.i18n)); });
    document.getElementById('ek-src').textContent = t('sourceLink');
    document.getElementById('ek-logo').setAttribute('aria-label', t('logoAlt'));
    document.getElementById('ek-logo-link').setAttribute('href', t('siteUrl'));
    document.getElementById('ek-site').setAttribute('href', t('siteUrl'));
    const group = document.getElementById('ek-lang');
    group.setAttribute('aria-label', t('langGroup'));
    group.querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
      b.setAttribute('aria-label', b.dataset.lang === 'en' ? t('langEn') : t('langBg'));
      b.title = b.dataset.lang === 'en' ? t('langEn') : t('langBg');
    });
    const legend = document.getElementById('ek-legend');
    legend.textContent = '';
    const addLeg = (label, style) => { const s = document.createElement('span'); const sw = document.createElement('i'); sw.className = 'ek-sw'; Object.assign(sw.style, style); s.append(sw, document.createTextNode(label)); legend.append(s); };
    addLeg(t('legTech'), { background: dash.colors[0] });
    addLeg(t('legOther'), { background: dash.colors[1] });
    addLeg(t('legRange'), { background: dash.colors[0], opacity: 0.4 });
    addLeg(t('legDashed'), { border: '1.5px dashed ' + dash.colors[0], background: 'transparent' });
  }

  function select(id) {
    const r = allRows.find((x) => x.id === id);
    if (!r) return;
    selected = id;
    const set = (elId, key) => {
      const el = document.getElementById(elId);
      el.classList.remove('dash-skeleton');
      el.textContent = f(r, key);
      el.setAttribute('data-field', key + sfx());
      el.setAttribute('data-where', 'id=' + encodeURIComponent(id));
    };
    set('ek-dcat', 'category');
    set('ek-dprog', 'program');
    set('ek-dstudy', 'study');
    set('ek-deffect', 'effect_label');
    set('ek-dnote', 'note');
    set('ek-dquote', 'quote');
    document.getElementById('ek-dsw').style.background = colorOf(r);
    const link = document.getElementById('ek-dlink');
    const linkTitle = document.getElementById('ek-dlinktitle');
    if (r.link_url) {
      link.hidden = false;
      link.setAttribute('href', r.link_url);
      set('ek-dlinktitle', 'link_title');
    } else {
      link.hidden = true;
      link.removeAttribute('href');
      linkTitle.removeAttribute('data-where');
    }
    const note = document.getElementById('ek-dlinknote');
    const noteText = r.link_url ? f(r, 'link_note') : (f(r, 'link_note') || t('noLink'));
    note.textContent = noteText;
    note.hidden = !noteText;
    note.setAttribute('data-field', 'link_note' + sfx());
    note.setAttribute('data-where', 'id=' + encodeURIComponent(id));
    document.querySelectorAll('#effect-chart .ek-col').forEach((g) => g.classList.toggle('is-sel', g.dataset.id === id));
    document.querySelectorAll('#ek-chips .ek-chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  }

  function showTip(evt, r) {
    tip.hidden = false;
    tip.textContent = '';
    const a = document.createElement('div'); a.className = 't1'; a.textContent = f(r, 'program') + ' · ' + f(r, 'study');
    const b = document.createElement('div'); b.className = 't2'; b.textContent = f(r, 'effect_label');
    tip.append(a, b);
    const box = card.getBoundingClientRect();
    let x = evt.clientX - box.left + 12, y = evt.clientY - box.top + 12;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > box.width - 4) x = evt.clientX - box.left - tw - 12;
    if (y + th > box.height - 4) y = evt.clientY - box.top - th - 12;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  }
  const hideTip = () => { tip.hidden = true; };

  const el = (name, attrs, parent) => { const n = document.createElementNS(SVGNS, name); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };

  function draw() {
    applyText();
    const res = dash.data('studies');
    const chart = document.getElementById('effect-chart');
    const chips = document.getElementById('ek-chips');
    chart.textContent = '';
    chips.textContent = '';
    hideTip();
    if (res.status !== 'ok') {
      if (res.status === 'loading') { chart.classList.add('dash-skeleton'); }
      else { chart.classList.remove('dash-skeleton'); const fl = document.createElement('div'); fl.className = 'ek-fail'; fl.textContent = 'Failed to load'; chart.append(fl); }
      return;
    }
    chart.classList.remove('dash-skeleton');

    const num = (v) => (v === null || v === undefined || v === '') ? null : Number(v);
    allRows = res.data.map((r) => Object.assign({}, r, { low: num(r.low), high: num(r.high), order: Number(r.order) }));
    const studies = allRows.filter((r) => r.type === 'study').sort((a, b) => a.order - b.order);
    const scale = allRows.filter((r) => r.type === 'scale').sort((a, b) => a.order - b.order);
    const nosd = allRows.filter((r) => r.type === 'nosd').sort((a, b) => a.order - b.order);
    const median = studies.find((r) => r.id === 'kraft_median');

    const exMed = document.getElementById('ek-ex-median');
    exMed.textContent = median ? f(median, 'value_label') : '—';
    exMed.setAttribute('data-field', 'value_label' + sfx());
    const pctRes = dash.data('median_percentile');
    const pct = pctRes.status === 'ok' && pctRes.data.length ? pctRes.data[0].percentile : null;
    document.getElementById('ek-ex-pct').textContent = pct === null ? '—' : String(pct);
    document.getElementById('ek-ex-pct-sfx').textContent = pct === null ? '' : ordinal(pct);
    const exScale = document.getElementById('ek-ex-scale');
    exScale.textContent = '';
    scale.forEach((s) => {
      const li = document.createElement('li');
      const nm = document.createElement('b');
      nm.textContent = f(s, 'study');
      nm.setAttribute('data-source', 'studies'); nm.setAttribute('data-field', 'study' + sfx()); nm.setAttribute('data-where', 'id=' + s.id);
      const rg = document.createElement('span');
      rg.className = 'ek-num';
      rg.textContent = f(s, 'effect_label');
      rg.setAttribute('data-source', 'studies'); rg.setAttribute('data-field', 'effect_label' + sfx()); rg.setAttribute('data-where', 'id=' + s.id);
      li.append(nm, document.createTextNode(': '), rg);
      exScale.append(li);
    });

    const probe = el('svg', { width: 10, height: 10 }, chart);
    const measure = (txt, cls) => { const tx = el('text', { class: cls }, probe); tx.textContent = txt; const w = tx.getComputedTextLength(); tx.remove(); return w; };
    const maxLabel = d3.max(studies, (r) => measure(f(r, 'short'), 'ek-xl')) || 0;
    const bandNameW = d3.max(scale, (r) => measure(f(r, 'study'), 'ek-band-n')) || 0;
    const bandRangeW = d3.max(scale, (r) => measure(f(r, 'range_label'), 'ek-band-l')) || 0;
    const oneLineW = d3.max(scale, (r) => measure(f(r, 'study'), 'ek-band-n') + measure(' ' + f(r, 'range_label'), 'ek-band-l')) || 0;
    const measureFirst = studies.length ? measure(f(studies[0], 'short'), 'ek-xl') : 0;
    probe.remove();

    const y = d3.scaleLinear([0, d3.max(studies, (r) => r.high) * 1.08], [INNER_H, 0]).nice();
    const ticks = y.ticks(6);

    const groups = [];
    studies.forEach((r) => { const g = groups[groups.length - 1]; if (!g || g.key !== r.group) groups.push({ key: r.group, name: f(r, 'group'), rows: [r] }); else g.rows.push(r); });

    const wrapW = document.getElementById('ek-scroll').clientWidth || 600;
    const firstLabelW = studies.length ? measureFirst : 0;
    const GUT = Math.max(bandNameW, bandRangeW, oneLineW) + 14;
    const margin = { top: 24, left: 36, right: 12 };
    const nGapW = (groups.length - 1) * GROUP_GAP;
    let slot = Math.max(MIN_SLOT, (wrapW - margin.left - margin.right - nGapW - GUT) / studies.length);
    margin.left = Math.max(36, firstLabelW * 1.1 * Math.cos(ANGLE * Math.PI / 180) - slot / 2 + 6 - GUT);
    slot = Math.max(MIN_SLOT, (wrapW - margin.left - margin.right - nGapW - GUT) / studies.length);
    const innerW = GUT + slot * studies.length + nGapW;
    const labelTop = 40;
    const bottom = labelTop + maxLabel * Math.sin(ANGLE * Math.PI / 180) + 16;
    const W = margin.left + innerW + margin.right;
    const H = margin.top + INNER_H + bottom;

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-labelledby': 'effect-chart-title' }, chart);
    svg.setAttribute('width', W > wrapW + 1 ? W : '100%');
    const root = el('g', { transform: `translate(${margin.left},${margin.top})` }, svg);

    const bandLabels = [];
    scale.forEach((s, i) => {
      const y0 = y(s.low), y1 = y(s.high === null ? y.domain()[1] : Math.min(s.high, y.domain()[1]));
      el('rect', { x: 0, y: y1, width: innerW, height: Math.max(0, y0 - y1), style: `fill: var(--color-fg); fill-opacity: ${0.025 + i * 0.03}` }, root);
      if (s.low > 0) el('line', { x1: 0, x2: innerW, y1: y0, y2: y0, style: 'stroke: var(--color-fg); stroke-opacity: 0.25; stroke-width: 1' }, root);
      bandLabels.push({ s, y0, y1 });
    });
    el('line', { x1: GUT - 6, x2: GUT - 6, y1: 0, y2: INNER_H, style: 'stroke: var(--color-fg); stroke-opacity: 0.12; stroke-width: 1' }, root);

    ticks.forEach((tk) => {
      el('line', { x1: 0, x2: innerW, y1: y(tk), y2: y(tk), style: 'stroke: var(--cds-chart-grid); stroke-width: 1' }, root);
      const tt = el('text', { class: 'ek-tick', x: -8, y: y(tk), 'text-anchor': 'end', 'dominant-baseline': 'middle' }, root);
      tt.textContent = fmtTick(tk);
    });

    if (median) {
      el('line', { x1: GUT, x2: innerW, y1: y(median.high), y2: y(median.high), style: 'stroke: var(--cds-chart-reference); stroke-width: 1.5; stroke-dasharray: 5 4' }, root);
    }

    bandLabels.forEach(({ s, y0, y1 }) => {
      const h = y0 - y1;
      const g = el('g', { class: 'ek-band' }, root);
      if (h >= 36) {
        const n = el('text', { class: 'ek-band-n', x: 8, y: y1 + 16 }, g); n.textContent = f(s, 'study');
        const r = el('text', { class: 'ek-band-l', x: 8, y: y1 + 31 }, g); r.textContent = f(s, 'range_label');
      } else {
        const tx = el('text', { class: 'ek-band-n', x: 8, y: (y0 + y1) / 2, 'dominant-baseline': 'middle' }, g);
        tx.textContent = f(s, 'study') + ' ';
        const ts = el('tspan', { class: 'ek-band-l' }, tx); ts.textContent = f(s, 'range_label');
      }
    });

    let x = GUT;
    const barW = Math.min(32, slot * 0.62);
    groups.forEach((g) => {
      const gx0 = x;
      g.rows.forEach((r) => {
        const cx = x + slot / 2;
        const col = el('g', { class: 'ek-col', tabindex: 0, role: 'button', 'aria-label': `${f(r, 'program')}, ${f(r, 'study')}: ${f(r, 'effect_label')}` }, root);
        col.dataset.id = r.id;
        el('rect', { class: 'ek-hit', x: x + 1, y: 0, width: slot - 2, height: INNER_H + labelTop - 4, rx: 4 }, col);
        const c = colorOf(r);
        const dashed = r.style === 'extrapolated' || r.style === 'summary';
        const bx = cx - barW / 2;
        const shapes = el('g', { class: animated ? '' : 'ek-grow' }, col);
        if (r.style === 'null') {
          el('rect', { x: bx, y: y(0) - 2, width: barW, height: 2, rx: 1, style: `fill: ${c}` }, shapes);
        } else {
          el('rect', { x: bx, y: y(r.low), width: barW, height: Math.max(0, y(0) - y(r.low)), rx: 4, style: `fill: ${c}; fill-opacity: ${dashed ? 0.16 : 1}` }, shapes);
          if (r.high > r.low) {
            el('rect', { x: bx, y: y(r.high), width: barW, height: y(r.low) - y(r.high), rx: 4, style: `fill: ${c}; fill-opacity: ${dashed ? 0.08 : 0.4}` }, shapes);
          }
          if (dashed) {
            el('rect', { x: bx, y: y(r.high), width: barW, height: y(0) - y(r.high), rx: 4, style: `fill: none; stroke: ${c}; stroke-width: 1.5; stroke-dasharray: 4 3` }, shapes);
          }
        }
        const vl = el('text', { class: 'ek-vl', x: cx, y: y(r.high) - 6, 'text-anchor': 'middle' }, col);
        vl.textContent = f(r, 'value_label');
        const xl = el('text', { class: 'ek-xl', transform: `translate(${cx + 4},${INNER_H + labelTop}) rotate(-${ANGLE})`, 'text-anchor': 'end' }, col);
        xl.textContent = f(r, 'short');
        col.addEventListener('click', () => select(r.id));
        col.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(r.id); } });
        col.addEventListener('mousemove', (e) => showTip(e, r));
        col.addEventListener('mouseleave', hideTip);
        x += slot;
      });
      el('line', { x1: gx0 + 4, x2: x - 4, y1: INNER_H + 8, y2: INNER_H + 8, style: 'stroke: var(--cds-chart-axis); stroke-width: 1' }, root);
      const gt = el('text', { class: 'ek-grp', x: (gx0 + x) / 2, y: INNER_H + 22, 'text-anchor': 'middle' }, root);
      gt.textContent = g.name;
      x += GROUP_GAP;
    });

    el('line', { x1: 0, x2: innerW, y1: y(0), y2: y(0), style: 'stroke: var(--cds-chart-axis); stroke-width: 1' }, root);
    animated = true;

    nosd.forEach((r) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ek-chip'; b.dataset.id = r.id; b.textContent = f(r, 'program');
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => select(r.id));
      chips.append(b);
    });

    const defs = document.getElementById('ek-defs');
    defs.textContent = '';
    allRows.filter((r) => r.type === 'definition').sort((a, b) => a.order - b.order).forEach((r) => {
      const key = r.id.replace(/^def_/, '');
      const wrap = document.createElement('div');
      const dt = document.createElement('dt');
      dt.id = 'def-' + key;
      dt.textContent = f(r, 'program');
      dt.setAttribute('data-source', 'studies'); dt.setAttribute('data-field', 'program' + sfx()); dt.setAttribute('data-where', 'id=' + r.id);
      const dd = document.createElement('dd');
      const txt = document.createElement('span');
      txt.textContent = f(r, 'note');
      txt.setAttribute('data-source', 'studies'); txt.setAttribute('data-field', 'note' + sfx()); txt.setAttribute('data-where', 'id=' + r.id);
      dd.append(txt);
      if (r.link_url) {
        const ka = document.createElement('span');
        ka.className = 'ek-ka';
        ka.append(document.createTextNode(t('defLesson') + ' '));
        const a = document.createElement('a');
        a.href = r.link_url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = f(r, 'link_title') + ' ↗';
        ka.append(a);
        const where = f(r, 'link_note');
        if (where) ka.append(document.createTextNode(' (' + where + ')'));
        dd.append(ka);
      }
      wrap.append(dt, dd);
      defs.append(wrap);
    });

    select(selected && allRows.some((r) => r.id === selected) ? selected : studies[0].id);
  }

  document.querySelectorAll('#ek-lang button').forEach((b) => b.addEventListener('click', () => {
    if (lang === b.dataset.lang) return;
    lang = b.dataset.lang;
    draw();
  }));

  applyText();
  dash.onData(draw);
})();
</script>

</div>
</body>
</html>
