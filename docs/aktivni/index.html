<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Активни училища и НВО – Образование без раници</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Lato"; src: url("fonts/lato-regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Lato"; src: url("fonts/lato-bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root {
  --navy: #0A2A66;
  --orange: #FA961E;
  --orange-text: #C76A00;
  --text: #333333;
  --muted: #666666;
  --bg: #F7F7F7;
  --card: #FFFFFF;
  --line: #E6E6E6;
  --link: #0B7A60;
  --btn: #267A34;
  --btn-text: #FFFFFF;
  --error: #B3261E;
  --s7: #1F6FB8;
  --s10: #0E9C7A;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: "Lato", system-ui, sans-serif; color: var(--text); background: var(--bg); line-height: 1.55; font-size: 16px; }
a { color: var(--link); }
header.top { background: var(--card); border-bottom: 1px solid var(--line); }
.bar { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand img { height: 34px; width: auto; display: block; }
.donate { background: var(--btn); color: var(--btn-text); text-decoration: none; font-weight: 700; padding: 8px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
.donate:hover, .donate:focus { filter: brightness(1.1); }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { color: var(--navy); font-size: 26px; line-height: 1.25; margin: 4px 0 12px; }
h2 { color: var(--navy); font-size: 20px; margin: 0 0 10px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px; margin: 0 0 16px; }
section.hero { background: transparent; border: 0; padding: 4px 2px 8px; }
.kicker { color: var(--orange-text); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.lead { font-size: 18px; margin: 0; }
.sub { color: var(--muted); margin: 0; font-size: 16px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: transparent; border: 0; padding: 0; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi.accent { border-top: 4px solid var(--orange); }
.kv { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1.1; }
.kl { color: var(--muted); font-size: 14px; }
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--navy); font-weight: 700; background: var(--bg); }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.tot td { font-weight: 700; }
.note { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
ul, ol { padding-left: 22px; margin: 0; }
li { margin: 4px 0; }
.legend { display: flex; gap: 16px; font-size: 14px; color: var(--text); margin: 4px 0 8px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sw.s7, rect.s7 { background: var(--s7); fill: var(--s7); }
.sw.s10, rect.s10 { background: var(--s10); fill: var(--s10); }
.chart { width: 100%; max-width: 460px; height: auto; display: block; }
table.wide { min-width: 640px; }
table.wide td, table.wide th { white-space: nowrap; }
.chart .ax-l { font-size: 13px; fill: var(--text); }
.chart .val { font-size: 12px; fill: var(--muted); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.chart .ref { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .bar:hover rect.s7, .chart .bar:hover rect.s10 { opacity: .8; }
.lock { max-width: 420px; margin: 32px auto; text-align: left; }
.lock p { margin: 0 0 14px; }
.lock label { display: block; font-weight: 700; margin-bottom: 6px; }
.lock input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--muted); border-radius: 8px; }
.lock input:focus { outline: 3px solid var(--orange); outline-offset: 1px; }
.lock button { margin-top: 12px; font: inherit; font-weight: 700; background: var(--btn); color: var(--btn-text); border: 0; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
.lock button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--error); font-size: 14px; min-height: 1.4em; margin-top: 8px; }
.filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 14px; }
.flabel { color: var(--muted); font-size: 14px; margin-right: 2px; }
.filter button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--navy); cursor: pointer; }
.filter button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--btn-text); font-weight: 700; }
.filter button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.fnote { background: var(--card); border-left: 4px solid var(--orange); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 0 0 12px; }
.view .lead { margin: 0 0 14px; }
[hidden] { display: none !important; }
details.fold { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 16px; }
details.fold > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { margin: 0; font-size: 18px; }
details.fold > summary::after { content: ""; flex: none; width: 10px; height: 10px; border-right: 2px solid var(--navy); border-bottom: 2px solid var(--navy); transform: rotate(45deg); margin-top: -4px; transition: transform .15s; }
details.fold[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
details.fold > summary:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: var(--radius); }
details.fold > :not(summary) { margin-left: 18px; margin-right: 18px; }
details.fold > :last-child { margin-bottom: 18px; }
details.fold p { margin-top: 0; }
footer { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; }
@media (min-width: 720px) {
  .kpis { grid-template-columns: repeat(4, 1fr); }
  h1 { font-size: 32px; }
  section { padding: 24px; }
  .brand img { height: 40px; }
}
</style>
</head>

  var app = document.getElementById('app');
  // Филтър: показва изгледа (data-view), чийто бутон е натиснат (data-set)
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-set]');
    if (!b) return;
    var v = b.getAttribute('data-set');
    app.querySelectorAll('[data-set]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    app.querySelectorAll('.view').forEach(function (x) { x.hidden = x.getAttribute('data-view') !== v; });
  });
  var lock = document.getElementById('lock');
  if (!DATA) { lock.remove(); return; }          // преглед без криптиране
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), err = document.getElementById('err');
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function unlock(password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.ct));
    return new TextDecoder().decode(plain);
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = ''; go.disabled = true; go.textContent = 'Отварям…';
    unlock(pw.value).then(function (html) {
      app.innerHTML = html;
      window.scrollTo(0, 0);
    }).catch(function () {
      err.textContent = 'Грешна парола. Опитай отново.';
      go.disabled = false; go.textContent = 'Отвори'; pw.select();
    });
  });
})();
