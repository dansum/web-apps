<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Какво би станало, ако…? — 500 опита с машини</title>
<meta name="description" content="50 индустриални машини и 10 мисловни експеримента: 1000 °C, удар с чук, течен азот, мълния, Луната и още. 500 предсказани резултата с картинки и оценки.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Lato';src:url('fonts/lato-regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Lato';src:url('fonts/lato-bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --navy:#0A2A66;--accent:#FA961E;--teal:#14BF96;--green:#3CB44B;--blue:#28AAE1;
  --text:#333333;--text-2:#666666;--bg:#F7F7F7;--card:#FFFFFF;--line:#E6E6E6;
  --link:#0B7A60;--btn:#267A34;--orange-text:#C76A00;--on-navy:#FFFFFF;--on-navy-2:#C9D4E8;
  --s1:#F1F3F6;--s2:#FDD9A8;--s3:#FA961E;--s4:#C76A00;--s5:#7A3E00;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 'Lato',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{color:var(--navy);line-height:1.15;margin:0;text-wrap:balance}
a{color:var(--link)}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
/* заглавна лента */
.top{background:var(--navy);color:var(--on-navy)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand img{height:34px;width:auto;display:block}
.bar nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lang{display:inline-flex;border:2px solid var(--on-navy-2);border-radius:999px;overflow:hidden}
.lang button{font:700 14px 'Lato',system-ui,sans-serif;min-height:36px;min-width:44px;padding:0 10px;border:0;background:transparent;color:var(--on-navy);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--on-navy);color:var(--navy)}
.home{color:var(--on-navy-2);text-decoration:none;font-size:15px}
.donate{background:var(--accent);color:var(--navy);font-weight:700;text-decoration:none;padding:8px 16px;border-radius:999px;font-size:15px}
.top h1{color:var(--on-navy);font-size:clamp(30px,5vw,48px)}
.lead{max-width:68ch;margin:10px 0 18px;font-size:17px;color:var(--on-navy-2)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ctl button{font:700 15px 'Lato',system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--on-navy-2);background:transparent;color:var(--on-navy);cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--navy)}
button:focus-visible,select:focus-visible,.cell:focus-visible,.thumb:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mx{background:var(--card);border-radius:12px;padding:12px}
.scroll{overflow-x:auto}
.grid{display:grid;grid-template-columns:110px repeat(50,minmax(14px,1fr));gap:2px;min-width:860px}
.ql{font-weight:700;font-size:13px;color:var(--navy);display:flex;align-items:center;white-space:nowrap}
.cell{height:26px;border-radius:3px;border:0;padding:0;cursor:pointer}
.cell.on{outline:3px solid var(--navy);outline-offset:1px}
.mh{height:28px;font:700 11px 'Lato',system-ui,sans-serif;color:var(--text-2);display:flex;align-items:end;justify-content:center;cursor:pointer;border:0;background:none;padding:0}
.mh.on{color:var(--navy);text-decoration:underline}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:10px;color:var(--text-2)}
.legend i{display:inline-block;width:22px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.legend .r{margin-left:auto}
/* избраният опит */
.det{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pics figure{margin:0}.pics img{width:100%;border-radius:10px;display:block;background:var(--line);aspect-ratio:16/10}
.pics figcaption{font-size:13px;color:var(--text-2);margin-top:4px}
.pics .big{grid-column:1/-1}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.nav button,.sel select{min-height:44px;font:700 15px 'Lato',system-ui,sans-serif;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--navy);padding:0 12px;cursor:pointer}
.kick{font-size:14px;color:var(--text-2);margin-bottom:6px}
.det h2{font-size:clamp(24px,3.2vw,34px);margin-bottom:8px}
.cond{font-size:14px;color:var(--text-2);border-left:4px solid var(--accent);padding-left:10px;margin:10px 0 14px}
.res{font-size:16.5px;max-width:70ch}
.bars{display:grid;gap:9px;margin:16px 0}
.bar2{display:grid;grid-template-columns:11.5em 1fr 2em;gap:10px;align-items:center;font-size:14px}
.bar2 b{font-weight:700;color:var(--navy)}
.track{height:12px;border-radius:6px;background:var(--s1);overflow:hidden}.track span{display:block;height:100%}
.bar2 em{font-style:normal;text-align:right;font-weight:700}
.key{font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
/* машината */
.sec{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec h2{font-size:clamp(22px,3vw,30px)}
.sel{font-size:15px;color:var(--text-2);display:flex;gap:8px;align-items:center}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px}
.thumb{flex:none;width:150px;scroll-snap-align:start;border:2px solid transparent;border-radius:10px;background:var(--card);padding:4px;cursor:pointer;color:var(--text);text-align:left;font:13px/1.25 'Lato',system-ui,sans-serif}
.thumb img{width:100%;border-radius:6px;display:block;aspect-ratio:16/10}
.thumb.on{border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--text);font:inherit}
.card img{width:100%;display:block;aspect-ratio:16/10}
.card div{padding:8px 10px 10px;font-size:14px}
.card b{color:var(--navy)}
.card .dots{display:flex;gap:4px;margin-top:6px}.card .dots span{flex:1;height:6px;border-radius:3px}
.card.on{outline:3px solid var(--accent)}
.note{font-size:15px;color:var(--text-2);max-width:80ch}
.note h3{font-size:20px;margin-bottom:6px}
.dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.dl a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--btn);color:#fff;text-decoration:none;font-weight:700;font-size:15px}
footer{border-top:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
footer img{height:30px;width:auto;display:block}
footer .donate2{color:var(--orange-text);font-weight:700}
@media(max-width:760px){.det{grid-template-columns:1fr}.bar2{grid-template-columns:9em 1fr 1.6em}}
@media(max-width:600px){.nav{grid-column:1/-1;grid-template-columns:repeat(4,1fr);gap:6px}.nav button{font-size:14px;padding:0 4px}}
@media(prefers-reduced-motion:no-preference){.pics img{transition:opacity .25s}}
</style>
</head>
<body>
<header class="band top"><div class="wrap">
  <div class="bar">
    <a class="brand" href="https://obr.education/" target="_blank" rel="noopener"><img src="obr-logo-light.svg" alt="Образование без раници"></a>
    <nav><a class="home" href="../" data-t="home">← Всички приложения</a>
      <span class="lang" role="group" aria-label="Език / Language"><button data-lang="bg" lang="bg">БГ</button><button data-lang="en" lang="en">EN</button></span>
      <a class="donate" id="donate" href="https://obr.education/stani-daritel/" target="_blank" rel="noopener" data-t="donate">Стани дарител</a></nav>
  </div>
  <h1 data-t="h1">Какво би станало, ако…?</h1>
  <p class="lead" data-t="lead">50 машини, 10 мисловни опита, 500 резултата. Всяко квадратче е един опит. Цветът показва оценката. Натисни квадратче.</p>
  <div class="ctl" id="metric" role="group"></div>
  <div class="mx scroll"><div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div></div>
</div></header>

<main>
<section class="band"><div class="wrap det" id="det"></div></section>

<section class="band" style="padding-top:0"><div class="wrap">
  <div class="sec"><h2 id="mtitle"></h2>
    <label class="sel"><span data-t="machine">Машина</span> <select id="msel"></select></label></div>
  <div class="strip" id="strip"></div>
  <div class="cards" id="cards"></div>
</div></section>

<section class="band" style="padding-top:0"><div class="wrap note">
  <h3 data-t="howT">Как са направени</h3>
  <p data-t="how1"></p>
  <p data-t="how2" data-html="1"></p>
  <p data-t="how3"></p>
  <div class="dl"><a href="data/experiments.csv" download data-t="csv">Данни (CSV)</a><a href="data/experiments.jsonl" download data-t="jsonl">Данни (JSONL)</a><a href="data/README.md" data-t="readme">Описание</a></div>
</div></section>
</main>

<footer class="band"><div class="wrap" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between;width:100%">
  <a href="https://obr.education/" target="_blank" rel="noopener"><img src="obr-logo.svg" alt="Образование без раници"></a>
  <a class="donate2" id="donate2" href="https://obr.education/stani-daritel/" target="_blank" rel="noopener" data-t="donate2">Подкрепи „Образование без раници“</a>
</div></footer>

<script>
{
const Q=[["q01", "1000 °C", "1000 °C", "Какво би станало, ако загреем машината до 1000 °C?", "What would happen if we heated the machine to 1000 °C?", "Цялата машина (изключена) стои в пещ при 1000 °C, докато се прогрее изцяло, после изстива.", "The whole machine (switched off) sits in a furnace at 1000 °C until it is heated through, then cools down."], ["q02", "Чук 5 кг", "5 kg hammer", "Какво би станало, ако ударим машината с тежък голям чук?", "What would happen if we hit the machine with a big heavy hammer?", "Един силен удар с 5-килограмов ковашки чук (~10 м/с, ~250 J) в най-уязвимата видима част.", "One hard blow with a 5 kg sledgehammer (~10 m/s, ~250 J) on the most vulnerable visible part."], ["q03", "−196 °C", "−196 °C", "Какво би станало, ако охладим машината до −196 °C с течен азот?", "What would happen if we cooled the machine to −196 °C with liquid nitrogen?", "Машината (изключена) е охладена изцяло с течен азот, после се затопля до стайна температура.", "The machine (switched off) is fully cooled with liquid nitrogen, then warms back up to room temperature."], ["q04", "Под вода", "Under water", "Какво би станало, ако потопим машината под вода?", "What would happen if we sank the machine under water?", "Машината е изключена, стои 24 часа изцяло под сладка вода, после се изважда.", "The machine is switched off, stays fully under fresh water for 24 hours, then is pulled out."], ["q05", "Мълния", "Lightning", "Какво би станало, ако мълния удари машината?", "What would happen if lightning struck the machine?", "Машината е на открито; пряк удар на мълния (~30 000 A, десетки микросекунди) в най-високата ѝ точка.", "The machine stands outdoors; a direct lightning strike (~30,000 A, tens of microseconds) hits its highest point."], ["q06", "Падане 10 м", "10 m fall", "Какво би станало, ако машината падне от 10 метра височина?", "What would happen if the machine fell from a height of 10 meters?", "Машината пада свободно от 10 м върху бетон (скорост при удара ~14 м/с).", "The machine falls freely from 10 m onto concrete (impact speed ~14 m/s)."], ["q07", "×2 скорост", "×2 speed", "Какво би станало, ако машината работи два пъти по-бързо?", "What would happen if the machine ran twice as fast?", "Основното движение (обороти, ход, скорост на движение) е удвоено, без промяна в конструкцията и защитите.", "The main motion (rpm, stroke rate, travel speed) is doubled, with no change to the design or the safety limits."], ["q08", "Без смазка", "No lubricant", "Какво би станало, ако машината работи без смазка?", "What would happen if the machine ran without lubricant?", "Всички смазочни масла и греси са премахнати; машината работи с нормално натоварване.", "All lubricating oils and greases are removed; the machine runs under normal load."], ["q09", "50 години", "50 years", "Какво би станало, ако оставим машината на открито за 50 години?", "What would happen if we left the machine outdoors for 50 years?", "Машината стои без поддръжка 50 години на открито в умерен климат (като в България).", "The machine stands outdoors for 50 years without maintenance in a temperate climate (like Bulgaria)."], ["q10", "Луната", "The Moon", "Какво би станало, ако пренесем машината на Луната?", "What would happen if we took the machine to the Moon?", "Вакуум, 1/6 от земната гравитация, температура от −170 до +120 °C, абразивен прах; ако машината е електрическа — има захранване.", "Vacuum, 1/6 of Earth’s gravity, temperatures from −170 to +120 °C, abrasive dust; electric machines get power."]];
const T={
 bg:{title:"Какво би станало, ако…? — 500 опита с машини",home:"← Всички приложения",donate:"Стани дарител",donateUrl:"https://obr.education/stani-daritel/",
  donate2:"Подкрепи „Образование без раници“",h1:"Какво би станало, ако…?",
  lead:"50 машини, 10 мисловни опита, 500 резултата. Всяко квадратче е един опит. Цветът показва оценката. Натисни квадратче.",
  metricLabel:"Критерий за оцветяване",score:"Оценка:",legendNote:"ред = опит, колона = машина",
  m:{damage:"Щети",danger:"Опасност за хора",plausibility:"Правдоподобност",educational_value:"Полезност за обучение",mean:"Средна оценка"},
  after:"След",before:"Преди",prevQ:"← Опит",nextQ:"Опит →",prevM:"← Машина",nextM:"Машина →",
  allTen:"Всички 10 опита: ",machine:"Машина",short:"Накратко:",err:"Данните не се заредиха. Презареди страницата.",
  howT:"Как са направени",
  how1:"Рисунките са схематични и са направени с код. Всяка машина е сглобена от части с истински материал: стомана, чугун, алуминий, гума, стъкло, електроника. Резултатът идва от свойствата на тези материали: при колко градуса се топят, кога стават крехки, как ръждясват.",
  how2:"Оценките (1–5) са правила, не измервания. <b>Щети</b>: 1 — почти нищо, 5 — машината е унищожена. <b>Опасност за хора</b>: 1 — безопасно, 5 — смъртоносно. <b>Правдоподобност</b>: колко сигурно е предсказанието. <b>Полезност за обучение</b>: колко неочевидна физика проверява опитът.",
  how3:"Данните са свободни за ползване — например за обучение на модели за физически изкуствен интелект.",
  csv:"Данни (CSV)",jsonl:"Данни (JSONL)",readme:"Описание"},
 en:{title:"What would happen if…? — 500 machine experiments",home:"← All apps",donate:"Donate",donateUrl:"https://obr.education/en/donate/",
  donate2:"Support Education Without Backpacks",h1:"What would happen if…?",
  lead:"50 machines, 10 thought experiments, 500 results. Each square is one experiment. The color shows the rating. Tap a square.",
  metricLabel:"Color by",score:"Rating:",legendNote:"row = experiment, column = machine",
  m:{damage:"Damage",danger:"Danger to people",plausibility:"Plausibility",educational_value:"Learning value",mean:"Average"},
  after:"After",before:"Before",prevQ:"← Experiment",nextQ:"Experiment →",prevM:"← Machine",nextM:"Machine →",
  allTen:"All 10 experiments: ",machine:"Machine",short:"In short:",err:"The data did not load. Please reload the page.",
  howT:"How they were made",
  how1:"The drawings are schematic and made with code. Each machine is built from parts made of real materials: steel, cast iron, aluminum, rubber, glass, electronics. The result comes from the properties of those materials: at what temperature they melt, when they turn brittle, how they rust.",
  how2:"The ratings (1–5) are rules, not measurements. <b>Damage</b>: 1 — almost nothing, 5 — the machine is destroyed. <b>Danger to people</b>: 1 — safe, 5 — deadly. <b>Plausibility</b>: how confident the prediction is. <b>Learning value</b>: how much non-obvious physics the experiment tests.",
  how3:"The data is free to use — for example, to train physical AI models.",
  csv:"Data (CSV)",jsonl:"Data (JSONL)",readme:"Description"}};
const MK=["damage","danger","plausibility","educational_value","mean"];
const COL=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)"];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
let D=[],by={},M=[],metric="damage",cur="m01-q01",lang="bg";
try{metric=localStorage.getItem("wi-metric")||metric}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");const st=localStorage.getItem("d4-lang");
  lang=(u==="en"||u==="bg")?u:(st==="bg"?"bg":(st==="en"||st==="de")?"en":"bg")}catch(e){}
const t=()=>T[lang];
const qb=q=>lang==="en"?q[2]:q[1], qt=q=>lang==="en"?q[4]:q[3], qc=q=>lang==="en"?q[6]:q[5];
const mn=m=>lang==="en"?m.en:m.bg;
const rv=(r,k)=>lang==="en"?r[k+"_en"]:r[k];
const val=(r,k)=>k==="mean"?(r.plausibility+r.damage+r.danger+r.educational_value)/4:r[k];
const col=v=>COL[Math.max(0,Math.min(4,Math.round(v)-1))];
const img=id=>"img/"+id+".webp";

function drawStatic(){
  document.documentElement.lang=lang;document.title=t().title;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t()[el.dataset.t];if(v==null)return;if(el.dataset.html)el.innerHTML=v;else el.textContent=v});
  for(const id of ["donate","donate2"])$(id).href=t().donateUrl;
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("metric").setAttribute("aria-label",t().metricLabel);
  $("msel").setAttribute("aria-label",t().machine);
}
function drawMetric(){
  $("metric").innerHTML=MK.map(k=>`<button data-k="${k}" aria-pressed="${k===metric}">${t().m[k]}</button>`).join("");
  $("legend").innerHTML=`<span>${t().score}</span>`+[1,2,3,4,5].map(i=>`<span><i style="background:${COL[i-1]}"></i>${i}</span>`).join("")+`<span class="r">${t().legendNote}</span>`;
}
function drawGrid(){
  const mid=cur.split("-")[0];
  let h=`<div></div>`+M.map((m,i)=>`<button class="mh ${m.id===mid?"on":""}" data-m="${m.id}" title="${esc(mn(m))}">${i+1}</button>`).join("");
  for(const q of Q){
    h+=`<div class="ql">${esc(qb(q))}</div>`;
    for(const m of M){const r=by[m.id+"-"+q[0]];const v=val(r,metric);
      h+=`<button class="cell ${r.key===cur?"on":""}" data-e="${r.key}" style="background:${col(v)}" title="${esc(mn(m))} — ${esc(qb(q))}: ${v.toFixed(metric==="mean"?1:0)}" aria-label="${esc(mn(m))}, ${esc(qb(q))}"></button>`}
  }
  $("grid").innerHTML=h;
}
function drawDetail(){
  const r=by[cur],q=Q.find(x=>x[0]===r.question_id),m=M.find(x=>x.id===r.machine_id);
  const bars=MK.slice(0,4).map(k=>`<div class="bar2"><b>${t().m[k]}</b><div class="track"><span style="width:${r[k]*20}%;background:${col(r[k])}"></span></div><em>${r[k]}</em></div>`).join("");
  $("det").innerHTML=`<div class="pics">
    <figure class="big"><img src="${img(r.id)}" alt="${esc(mn(m))} — ${esc(t().after)}: ${esc(qb(q))}"><figcaption>${esc(t().after)}: ${esc(qb(q))}</figcaption></figure>
    <figure><img src="${img(r.machine_id)}" alt="${esc(mn(m))} — ${esc(t().before)}"><figcaption>${esc(t().before)}</figcaption></figure>
    <div class="nav"><button id="prevq">${t().prevQ}</button><button id="nextq">${t().nextQ}</button><button id="prevm">${t().prevM}</button><button id="nextm">${t().nextM}</button></div>
  </div>
  <div><div class="kick">${esc(mn(m))} · ${esc(rv(r,"category"))} · ${esc(r.id)}</div>
    <h2>${esc(qt(q))}</h2><div class="cond">${esc(qc(q))}</div>
    <p class="res">${esc(rv(r,"result"))}</p>
    <div class="bars">${bars}</div>
    <div class="key"><b>${t().short}</b> ${esc(rv(r,"key_effects"))}</div></div>`;
  $("prevq").onclick=()=>step(0,-1);$("nextq").onclick=()=>step(0,1);$("prevm").onclick=()=>step(-1,0);$("nextm").onclick=()=>step(1,0);
}
function drawMachine(){
  const mid=cur.split("-")[0],m=M.find(x=>x.id===mid);
  $("mtitle").textContent=t().allTen+mn(m);
  $("msel").innerHTML=M.map((x,i)=>`<option value="${x.id}">${i+1}. ${esc(mn(x))}</option>`).join("");
  $("msel").value=mid;
  $("strip").innerHTML=M.map((x,i)=>`<button class="thumb ${x.id===mid?"on":""}" data-m="${x.id}"><img loading="lazy" src="${img(x.id)}" alt=""><span>${i+1}. ${esc(mn(x))}</span></button>`).join("");
  $("cards").innerHTML=Q.map(q=>{const r=by[mid+"-"+q[0]];
    return `<button class="card ${r.key===cur?"on":""}" data-e="${r.key}"><img loading="lazy" src="${img(r.id)}" alt="${esc(qb(q))}"><div><b>${esc(qb(q))}</b> — ${esc(rv(r,"key_effects"))}<div class="dots">${MK.slice(0,4).map(k=>`<span title="${t().m[k]}: ${r[k]}" style="background:${col(r[k])}"></span>`).join("")}</div></div></button>`}).join("");
}
function render(scroll){drawStatic();drawMetric();drawGrid();drawDetail();drawMachine();if(scroll)$("det").scrollIntoView({behavior:"smooth",block:"start"})}
function go(k,scroll){if(!by[k])return;cur=k;try{history.replaceState(null,"",location.pathname+location.search+"#"+k)}catch(e){}render(scroll)}
function step(dm,dq){let [mid,qid]=cur.split("-");let mi=M.findIndex(x=>x.id===mid),qi=Q.findIndex(x=>x[0]===qid);
  mi=(mi+dm+M.length)%M.length;qi=(qi+dq+Q.length)%Q.length;go(M[mi].id+"-"+Q[qi][0])}
function setLang(l){lang=l;try{localStorage.setItem("d4-lang",l)}catch(e){}
  try{const u=new URL(location.href);if(u.searchParams.has("lang")){u.searchParams.set("lang",l);history.replaceState(null,"",u)}}catch(e){}
  render();try{window.d4Consent&&window.d4Consent.relang&&window.d4Consent.relang()}catch(e){}}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-e],[data-m],[data-k],[data-lang]");if(!b)return;
  if(b.dataset.lang){if(b.dataset.lang!==lang)setLang(b.dataset.lang);return}
  if(b.dataset.k){metric=b.dataset.k;try{localStorage.setItem("wi-metric",metric)}catch(_){}drawMetric();drawGrid();return}
  if(b.dataset.e){go(b.dataset.e,!b.classList.contains("card"));return}
  if(b.dataset.m){go(b.dataset.m+"-"+cur.split("-")[1])}
});
document.addEventListener("keydown",e=>{if(e.target.closest("select,input,textarea"))return;
  if(e.key==="ArrowRight")step(0,1);else if(e.key==="ArrowLeft")step(0,-1)});
$("msel").onchange=e=>go(e.target.value+"-"+cur.split("-")[1]);
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(by[k]&&k!==cur)go(k)});

drawStatic();
fetch("data.json").then(r=>r.json()).then(rows=>{
  D=rows;for(const r of D){r.key=r.machine_id+"-"+r.question_id;by[r.key]=r;if(!M.find(m=>m.id===r.machine_id))M.push({id:r.machine_id,bg:r.machine_bg,en:r.machine_en})}
  const h=location.hash.slice(1);if(by[h])cur=h;
  render();
}).catch(()=>{$("det").textContent=t().err});
}
</script>
<script src="../consent.js" defer></script>
</body>
</html>
