<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СтоБУМ — БУМ</title>
<meta name="description" content="Сто истории на успеха на българи в математиката, науката и обществото.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">


<link rel="preload" href="fonts/lato-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('bum-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body data-page="sto">
<header id="top"></header>
<main class="wrap">
  <div class="page-head">
    <span class="eyebrow">СтоБУМ</span>
    <h1>Сто истории на успеха</h1>
    <p>Не всички са прочути, но всички са истински. Жени и мъже от различни векове — математици, физички, лекари, инженерки, шахматисти, програмисти.</p>
  </div>
  <div class="strip-head"><h2>Пет случайни</h2><button class="linkbtn" type="button" id="shuffle">🎲 Разбъркай</button></div>
  <div class="strip" id="strip"></div>
  <div class="tools">
    <div class="row">
      <label class="sr" for="q">Търсене</label>
      <input class="search" id="q" type="search" placeholder="Търси по име, тема, място…" autocomplete="off">
      <label class="sr" for="sort">Подреди</label>
      <select class="sel" id="sort">
        <option value="born">По година ↑</option>
        <option value="born-desc">По година ↓</option>
        <option value="name">По име А–Я</option>
        <option value="random">Случайно</option>
      </select>
    </div>
    <div class="chips" id="f-sex" role="group" aria-label="Пол"></div>
    <div class="chips" id="f-cent" role="group" aria-label="Век"></div>
    <div class="chips" id="f-field" role="group" aria-label="Област"></div>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <ul class="list" id="list"></ul>
</main>
<footer id="foot"></footer>
<script src="data/ten.js"></script>
<script src="data/sto-a.js"></script>
<script src="data/sto-b.js"></script>
<script src="data/sto-c.js"></script>
<script src="data/sto-d.js"></script>
<script src="data/sto-e.js"></script>
<script src="data/kilo.js"></script>
<script src="data/ka.js"></script>
<script src="data/facets.js"></script>
<script src="js/art.js"></script>
<script src="js/bum.js"></script>
<script src="../consent.js" defer></script>
</body>
</html>
